name: Apply phase 4 Praca security

on:
  push:
    branches:
      - fix-especificacao-fase4

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase4-praca-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-especificacao-fase4
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-phase4-praca.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/tenants.ts artifacts/frontend/src/pages/AdminTenantDetail.tsx
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "fix: restringir liberação do PraçaAI ao SuperAdmin [phase4-praca-applied]"
          git push origin HEAD:fix-especificacao-fase4
