name: Temp Merge Pipeline Guard Current Deals

on:
  push:
    branches:
      - tmp/pipeline-deals-main-merge
    paths:
      - scripts/merge-pipeline-guard-into-current-deals.py
      - .github/workflows/temp-merge-pipeline-guard-current-deals.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/pipeline-deals-main-merge
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/merge-pipeline-guard-into-current-deals.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/deals.ts
          git commit -m "feat(pipeline): preservar guardas atuais e bloquear regressão comercial"
          git push origin HEAD:tmp/pipeline-deals-main-merge
