name: Apply editable automatic captions

on:
  push:
    branches:
      - feat/video-editable-auto-captions

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-editable-auto-captions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted caption patch
        run: python .github/scripts/patch_editable_auto_captions.py
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/patch_editable_auto_captions.py
          rm .github/workflows/apply-editable-auto-captions.yml
      - name: Commit result
        run: |
          git config user.name "vendorai-automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add artifacts/frontend/src/components/video/VideoTimelineEditor.tsx artifacts/api-server/src/routes/video_processing.ts .github/scripts/patch_editable_auto_captions.py .github/workflows/apply-editable-auto-captions.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(video): legendas automáticas editáveis e destaque por palavra"
            git push origin HEAD:feat/video-editable-auto-captions
          fi
