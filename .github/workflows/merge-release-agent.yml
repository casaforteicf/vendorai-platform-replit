name: Merge e Publicação Controlados

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Número do Pull Request homologado
        required: true
        type: string
      confirmation:
        description: Digite PUBLICAR para autorizar merge e publicação
        required: true
        type: string
      critical_confirmation:
        description: Para mudança crítica, digite APROVAR CRITICO
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: write

concurrency:
  group: vendorai-production-release
  cancel-in-progress: false

env:
  API_HEALTH_URL: https://vendorai-platform-replit-production.up.railway.app/api/auth/healthz
  FRONTEND_URL: https://app.appvendorai.com
  WEBSITE_URL: https://appvendorai.com

jobs:
  merge-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Validar autorização explícita
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "PUBLICAR"

      - name: Inspecionar PR e classificar risco
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          CRITICAL_CONFIRMATION: ${{ inputs.critical_confirmation }}
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ ]]

          data="$(gh api "repos/$REPO/pulls/$PR")"
          test "$(jq -r .state <<<"$data")" = "open"
          test "$(jq -r .draft <<<"$data")" = "false"
          test "$(jq -r .base.ref <<<"$data")" = "main"
          test "$(jq -r '.head.repo.full_name' <<<"$data")" = "$REPO"

          head_sha="$(jq -r .head.sha <<<"$data")"
          base_sha="$(jq -r .base.sha <<<"$data")"
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" --jq '.[].filename' > /tmp/files

          critical_re='(^|/)(migrations?|auth)(/|$)|(^|/)schema\.(ts|sql)$|billing|payment|subscription|secrets?|^\.github/workflows/|^cloudflare/|railway|terraform|(^|/)docker|(^|/)rls(/|$)|(^|/)\.env'
          critical=false
          if grep -Eiq "$critical_re" /tmp/files; then
            critical=true
            echo "Mudança crítica detectada:"
            grep -Ein "$critical_re" /tmp/files || true
            if [ "$CRITICAL_CONFIRMATION" != "APROVAR CRITICO" ]; then
              echo "::error::Mudança crítica exige confirmação adicional: APROVAR CRITICO"
              exit 1
            fi
          fi

          backend=false
          app=false
          website=false
          mobile=false
          shared='^(pnpm-lock.yaml$|pnpm-workspace.yaml$|package.json$|\.node-version$)'

          if grep -Eq '^(artifacts/api-server/|lib/db/|lib/api-zod/|lib/vendor-brain/|lib/integrations-anthropic-ai/|backend/Dockerfile$)' /tmp/files || grep -Eq "$shared" /tmp/files; then backend=true; fi
          if grep -Eq '^(artifacts/frontend/|artifacts/api-server/|lib/db/|lib/api-zod/|lib/api-client-react/|lib/vendor-brain/|backend/Dockerfile$)' /tmp/files || grep -Eq "$shared" /tmp/files; then app=true; fi
          if grep -Eq '^(artifacts/website/|lib/vendor-brain/)' /tmp/files || grep -Eq "$shared" /tmp/files; then website=true; fi
          if grep -Eq '^artifacts/mobile/' /tmp/files; then mobile=true; fi

          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "base_sha=$base_sha" >> "$GITHUB_OUTPUT"
          echo "critical=$critical" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"

      - name: Validar que o PR está atualizado e mergeável
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          EXPECTED: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          for n in {1..12}; do
            data="$(gh api "repos/$REPO/pulls/$PR")"
            test "$(jq -r .head.sha <<<"$data")" = "$EXPECTED"

            mergeable="$(jq -r .mergeable <<<"$data")"
            state="$(jq -r .mergeable_state <<<"$data")"
            echo "mergeable=$mergeable state=$state"

            if [ "$mergeable" = "true" ] && [ "$state" != "behind" ] && [ "$state" != "dirty" ] && [ "$state" != "blocked" ]; then
              exit 0
            fi
            if [ "$mergeable" = "false" ] || [ "$state" = "behind" ] || [ "$state" = "dirty" ]; then
              exit 1
            fi
            sleep 5
          done
          exit 1

      - name: Exigir CI verde no SHA exato do PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD: ${{ steps.pr.outputs.head_sha }}
          BACKEND: ${{ steps.pr.outputs.backend }}
          APP: ${{ steps.pr.outputs.app }}
        run: |
          set -euo pipefail

          runs="$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD&event=pull_request&per_page=100")"

          require_workflow() {
            local workflow="$1"
            local row
            row="$(jq -c --arg workflow "$workflow" '
              [.workflow_runs[] | select(.name == $workflow)] |
              sort_by(.created_at) | last // empty
            ' <<<"$runs")"

            if [ -z "$row" ]; then
              echo "::error::Workflow obrigatório não encontrado para $HEAD: $workflow"
              exit 1
            fi

            status="$(jq -r .status <<<"$row")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$row")"
            echo "$workflow: status=$status conclusion=$conclusion"

            test "$status" = "completed"
            test "$conclusion" = "success"
          }

          if [ "$BACKEND" = "true" ] || [ "$APP" = "true" ]; then
            require_workflow "VendorAI Stability Gate"
          fi

          if [ "$BACKEND" = "true" ]; then
            require_workflow "VendorAI API CI"
            require_workflow "Cloudflare API Container"
          fi

          if [ "$APP" = "true" ]; then
            require_workflow "Frontend PR Check"
          fi

          # Statuses externos não relacionados ao VendorAI (ex.: previews Vercel
          # bloqueados por conta) não podem mascarar os gates internos oficiais.

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Validação final das bibliotecas compartilhadas
        run: pnpm run typecheck:libs

      - name: Validar contrato de produção da API
        if: steps.pr.outputs.backend == 'true'
        run: pnpm --filter @workspace/api-server run ci:railway

      - name: Validar build do app
        if: steps.pr.outputs.app == 'true'
        env:
          VENDOR_BUILD_ID: ${{ steps.pr.outputs.head_sha }}
        run: pnpm --filter @workspace/frontend build

      - name: Trava contra corrida da main e alteração do PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          EXPECTED_HEAD: ${{ steps.pr.outputs.head_sha }}
          EXPECTED_BASE: ${{ steps.pr.outputs.base_sha }}
        run: |
          set -euo pipefail
          data="$(gh api "repos/$REPO/pulls/$PR")"
          test "$(jq -r .head.sha <<<"$data")" = "$EXPECTED_HEAD"
          test "$(jq -r .state <<<"$data")" = "open"
          test "$(jq -r .draft <<<"$data")" = "false"

          current_main="$(gh api "repos/$REPO/commits/main" --jq .sha)"
          if [ "$current_main" != "$EXPECTED_BASE" ]; then
            echo "::error::A main mudou desde a homologação deste PR. Atualize/rebase e rode os checks novamente."
            echo "base homologada=$EXPECTED_BASE main atual=$current_main"
            exit 1
          fi

      - name: Merge squash autorizado
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          EXPECTED: ${{ steps.pr.outputs.head_sha }}
        run: |
          set -euo pipefail
          result="$(gh api --method PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$EXPECTED")"
          test "$(jq -r .merged <<<"$result")" = "true"
          sha="$(jq -r .sha <<<"$result")"
          test -n "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Aguardar revisão Railway do merge autorizado
        if: steps.pr.outputs.backend == 'true'
        env:
          EXPECTED: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          for n in {1..42}; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 5 --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$API_HEALTH_URL" || true)"
            health="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
            rev="$(awk 'BEGIN{IGNORECASE=1} /^X-VendorAI-Revision:/ {gsub("\r","",$2); print $2}' "$headers" | tail -1)"
            rm -f "$headers" "$body"
            echo "railway http=$code health=$health revision=$rev"
            if [ "$code" = "200" ] && [ "$health" = "ok" ] && { [ "$rev" = "$EXPECTED" ] || [[ "$EXPECTED" == "$rev"* ]] || [[ "$rev" == "$EXPECTED"* ]]; }; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Railway não atingiu o SHA autorizado $EXPECTED"
          exit 1

      - name: Rebuild do app para o SHA resultante do merge
        if: steps.pr.outputs.app == 'true'
        env:
          VENDOR_BUILD_ID: ${{ steps.merge.outputs.sha }}
        run: pnpm --filter @workspace/frontend build

      - name: Publicar app no Cloudflare Pages
        if: steps.pr.outputs.app == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f artifacts/frontend/dist/public/index.html
          test -f artifacts/frontend/dist/public/_worker.js
          pnpm dlx wrangler@3.90.0 pages project create vendorai --production-branch main || true
          pnpm dlx wrangler@3.90.0 pages deploy artifacts/frontend/dist/public --project-name vendorai --branch main

      - name: Validar revisão publicada do app
        if: steps.pr.outputs.app == 'true'
        env:
          EXPECTED: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          prefix="${EXPECTED:0:12}"
          for n in {1..30}; do
            html="$(curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$FRONTEND_URL/?__vendorai_release=$RANDOM" || true)"
            if grep -F -- "-$prefix-" <<<"$html" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Frontend não expôs a revisão $prefix"
          exit 1

      - name: Build do site público
        if: steps.pr.outputs.website == 'true' && steps.pr.outputs.mobile != 'true'
        run: pnpm --filter @workspace/website build

      - name: Publicar site público
        if: steps.pr.outputs.website == 'true' && steps.pr.outputs.mobile != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -f artifacts/website/dist/public/index.html
          test -f artifacts/website/dist/public/_worker.js
          pnpm dlx wrangler@3.90.0 pages project create vendorai-website --production-branch main || true
          pnpm dlx wrangler@3.90.0 pages deploy artifacts/website/dist/public --project-name vendorai-website --branch main

      - name: Disparar build do APK
        if: steps.pr.outputs.mobile == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh workflow run jarvis-android-apk.yml --repo "$REPO" --ref main

      - name: Smoke test app e API
        if: steps.pr.outputs.app == 'true' || steps.pr.outputs.backend == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$FRONTEND_URL/login" >/dev/null
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$API_HEALTH_URL" >/dev/null

      - name: Smoke test site público
        if: steps.pr.outputs.website == 'true' || steps.pr.outputs.mobile == 'true'
        run: curl --fail --silent --show-error --connect-timeout 5 --max-time 15 "$WEBSITE_URL/" >/dev/null

      - name: Registrar publicação validada
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/statuses/$SHA"             -f state=success             -f context='vendorai/merge-publish'             -f description='PUBLICADO — merge autorizado e produção validada' >/dev/null

          gh pr comment "$PR" --repo "$REPO" --body "✅ Merge e Publicação Controlados: revisão $SHA publicada e validada em produção."

      - name: Registrar falha pós-merge
        if: failure() && steps.merge.outputs.sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.pr_number }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.merge.outputs.sha }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPO/statuses/$SHA"             -f state=failure             -f context='vendorai/merge-publish'             -f description='MERGE FEITO — publicação/validação pendente' >/dev/null || true

          gh pr comment "$PR" --repo "$REPO" --body "⚠️ O merge $SHA entrou na main, mas a publicação não foi validada. Nenhum rollback automático foi executado."
