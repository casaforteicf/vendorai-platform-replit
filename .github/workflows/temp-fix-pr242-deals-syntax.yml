name: Temp Fix PR242 Deals Syntax

on:
  push:
    branches:
      - feat/operational-pipelines-support-deliveries
    paths:
      - scripts/fix-pr242-deals-syntax.py
      - .github/workflows/temp-fix-pr242-deals-syntax.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operational-pipelines-support-deliveries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix syntax
        run: python scripts/fix-pr242-deals-syntax.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/Deals.tsx
          git commit -m "fix(crm): corrigir condição de movimento da pipeline comercial"
          git push origin HEAD:feat/operational-pipelines-support-deliveries
