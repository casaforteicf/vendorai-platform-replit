name: Frontend PR Check

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/frontend/**"
      - "lib/api-client-react/**"
      - "lib/vendor-brain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/frontend-pr-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build VendorAI frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/frontend build

      - name: Verify production bundle
        run: |
          test -f artifacts/frontend/dist/public/index.html
          test -f artifacts/frontend/dist/public/_worker.js
