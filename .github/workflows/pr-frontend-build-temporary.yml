name: PR Frontend Build Temporary

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/frontend/**"
      - ".github/workflows/pr-frontend-build-temporary.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter @workspace/frontend typecheck
      - run: pnpm --filter @workspace/frontend build
