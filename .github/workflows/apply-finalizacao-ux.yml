name: Apply final UX fixes

on:
  push:
    branches: [fix-finalizacao-ux]
    paths:
      - '.github/workflows/apply-finalizacao-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-finalizacao-ux
      - name: Apply Content Autopilot and custom vertical fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          # Content Autopilot
          p=Path('artifacts/frontend/src/pages/ContentAutopilot.tsx')
          s=p.read_text()
          old='const { data, isLoading } = useQuery<{ config: Config | null }>({'
          new='const { data, isLoading } = useQuery<{ config: Config | null; dataForSeoConfigured: boolean }>({'
          assert old in s
          s=s.replace(old,new,1)
          old='  const config = data?.config;\n'
          new='  const config = data?.config;\n  const dataForSeoConfigured = data?.dataForSeoConfigured ?? false;\n'
          assert old in s
          s=s.replace(old,new,1)

          anchor='''  const researchMutation = useMutation({\n'''
          run_mut='''  const runNowMutation = useMutation({\n    mutationFn: () =>\n      fetch(`/api/tenants/${tenantId}/content-autopilot/run-now`, { method: "POST", headers: authHeaders() })\n        .then(async (r) => {\n          const body = await r.json().catch(() => ({}));\n          if (!r.ok) throw new Error((body as { error?: string }).error ?? "Erro ao executar o Autopilot");\n          return body as { artigosGerados: number; erros: string[] };\n        }),\n    onSuccess: (res) => {\n      qc.invalidateQueries({ queryKey: ["content-autopilot-articles", tenantId] });\n      qc.invalidateQueries({ queryKey: ["content-autopilot-keywords", tenantId] });\n      qc.invalidateQueries({ queryKey: ["content-autopilot-blog-posts", tenantId] });\n      toast({\n        title: `Autopilot executado: ${res.artigosGerados} artigo${res.artigosGerados === 1 ? "" : "s"} gerado${res.artigosGerados === 1 ? "" : "s"}`,\n        description: res.erros?.length ? `${res.erros.length} item(ns) com erro — consulte os logs.` : undefined,\n      });\n    },\n    onError: (e: Error) => toast({ title: "Erro ao executar Autopilot", description: e.message, variant: "destructive" }),\n  });\n\n'''
          assert anchor in s
          s=s.replace(anchor,run_mut+anchor,1)

          marker='''              <div className="space-y-1.5">\n                <Label>URL do site</Label>\n'''
          insert='''              <div className="flex flex-wrap items-center justify-between gap-3 rounded-lg border bg-muted/30 p-3">\n                <div className="flex items-center gap-2 text-xs">\n                  <Badge variant={dataForSeoConfigured ? "outline" : "destructive"}>\n                    DataForSEO {dataForSeoConfigured ? "conectado" : "não configurado"}\n                  </Badge>\n                  <span className="text-muted-foreground">\n                    {config?.ativo ? "Automação diária ativa" : "Automação diária pausada"}\n                  </span>\n                </div>\n                <Button\n                  type="button"\n                  size="sm"\n                  variant="outline"\n                  onClick={() => runNowMutation.mutate()}\n                  disabled={!config?.ativo || runNowMutation.isPending}\n                >\n                  {runNowMutation.isPending ? <Loader2 className="h-4 w-4 mr-2 animate-spin" /> : <Sparkles className="h-4 w-4 mr-2" />}\n                  Executar agora\n                </Button>\n              </div>\n\n'''
          assert marker in s
          s=s.replace(marker,insert+marker,1)

          old='''                  disabled={!seedInput.trim() || researchMutation.isPending}\n'''
          new='''                  disabled={!seedInput.trim() || researchMutation.isPending || !dataForSeoConfigured}\n'''
          assert old in s
          s=s.replace(old,new,1)
          old='''              </div>\n            </CardContent>\n          </Card>\n\n          {keywords.length === 0 ? (\n'''
          new='''              </div>\n              {!dataForSeoConfigured && (\n                <p className="text-xs text-amber-600">\n                  Pesquisa de keywords indisponível até as credenciais DataForSEO serem configuradas pela plataforma.\n                </p>\n              )}\n            </CardContent>\n          </Card>\n\n          {keywords.length === 0 ? (\n'''
          # only replace first occurrence after Keywords marker
          idx=s.find('        <TabsContent value="keywords"')
          pos=s.find(old,idx)
          assert pos>=0
          s=s[:pos]+s[pos:].replace(old,new,1)
          p.write_text(s)

          # Configurações — vertical select becomes free text with suggestions
          p=Path('artifacts/frontend/src/pages/Configuracoes.tsx')
          s=p.read_text()
          start=s.index('const VERTICAIS = [')
          end=s.index('];',start)+2
          vert='''const VERTICAIS = [\n  "Farmácia",\n  "Tecnologia",\n  "Saúde",\n  "Educação",\n  "Financeiro",\n  "Varejo",\n  "Imobiliário",\n  "Serviços",\n  "Indústria",\n  "Construção & Reforma",\n  "Material de Construção — Varejo",\n  "Distribuidora de Materiais de Construção",\n  "Distribuidora de Peças",\n  "Distribuidora de Alimentos",\n  "Máquinas e Insumos",\n  "Loja de Piscina",\n  "Automotivo",\n  "Supermercado",\n  "Restaurante",\n  "Salão de Beleza",\n  "Clínica",\n  "Pet Shop (Varejo)",\n] as const;'''
          s=s[:start]+vert+s[end:]

          start=s.index('''                    <FormField\n                      control={profileForm.control}\n                      name="vertical"''')
          next_anchor='''                    <FormField\n                      control={profileForm.control}\n                      name="metodoVendas"'''
          end=s.index(next_anchor,start)
          repl='''                    <FormField\n                      control={profileForm.control}\n                      name="vertical"\n                      render={({ field }) => (\n                        <FormItem>\n                          <FormLabel>Vertical / segmento</FormLabel>\n                          <FormControl>\n                            <Input\n                              list="vendorai-vertical-options"\n                              placeholder="Selecione uma sugestão ou digite sua vertical"\n                              {...field}\n                              value={field.value ?? ""}\n                            />\n                          </FormControl>\n                          <datalist id="vendorai-vertical-options">\n                            {VERTICAIS.map((vertical) => (\n                              <option key={vertical} value={vertical} />\n                            ))}\n                          </datalist>\n                          <p className="text-xs text-muted-foreground">\n                            Você pode usar uma das sugestões ou cadastrar livremente um novo segmento. Verticais sem layout especializado usam o CRM padrão.\n                          </p>\n                          <FormMessage />\n                        </FormItem>\n                      )}\n                    />\n'''
          s=s[:start]+repl+s[end:]
          p.write_text(s)
          PY
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/frontend/src/pages/ContentAutopilot.tsx artifacts/frontend/src/pages/Configuracoes.tsx
          git commit -m 'fix: finalizar Autopilot e permitir vertical personalizada'
          git push origin HEAD:fix-finalizacao-ux
