name: Apply original spec fixes

on:
  push:
    branches:
      - fix-especificacao-original

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[spec-fixes-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply targeted corrections
        run: python3 scripts/apply-original-spec-fixes.py

      - name: Commit corrected files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/apply-original-spec-fixes.yml' ':!scripts/apply-original-spec-fixes.py'
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: alinhar módulos à especificação original [spec-fixes-applied]"
          git push origin HEAD:fix-especificacao-original
