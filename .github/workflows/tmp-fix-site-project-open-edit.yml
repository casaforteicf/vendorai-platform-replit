name: Temporary site project patch

on:
  push:
    branches:
      - fix/site-project-open-edit

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/site-project-open-edit
          fetch-depth: 0
      - name: Apply patch
        run: python3 scripts/tmp_patch_site_projects.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/SiteGeneratorCore.tsx
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "fix(sites): permitir abrir e editar projetos existentes"
            git push origin HEAD:fix/site-project-open-edit
          fi
