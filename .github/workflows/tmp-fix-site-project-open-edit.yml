name: Temporary site project patch

on:
  push:
    branches: ["fix/site-project-open-edit"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-project-open-edit
          fetch-depth: 0
      - name: Patch site project interactions
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("artifacts/frontend/src/pages/SiteGeneratorCore.tsx")
          text = path.read_text()

          old_load = '''  const loadSite = useCallback(async (id: string) => {
    try {
      const res = await fetch(`/api/tenants/${tenantId}/site-generator/${id}`, { headers: authHeaders });
      if (!res.ok) return;
      const site = await res.json();
      const originalHtml = site.html ?? "";
      const repairedHtml = absolutizeStorageUrls(originalHtml);
      if (repairedHtml !== originalHtml) {
        const repairRes = await fetch(`/api/tenants/${tenantId}/site-generator/${site.id}/html`, {
          method: "PATCH",
          headers: authHeaders,
          body: JSON.stringify({ html: repairedHtml }),
        });
        if (!repairRes.ok) throw new Error("Não foi possível corrigir as URLs das imagens");
      }
      setHtml(repairedHtml);
      setSiteId(site.id);
      setSiteSlug(site.siteSlug ?? null);
      setIsPublished(site.published ?? false);
      setCurrentSiteType(site.siteType ?? null);
      setCurrentConfig(site.config ?? null);
      setSeoScore(site.seoScore ?? null);
      setSeoChecklist(site.seoChecklist ?? null);
      setStatus("ready");
    } catch {}
  }, [tenantId, token]);'''

          new_load = '''  const loadSite = useCallback(async (id: string): Promise<boolean> => {
    if (!tenantId || !id) return false;

    const res = await fetch(`/api/tenants/${tenantId}/site-generator/${id}`, { headers: authHeaders });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(body.error ?? `Não foi possível abrir o projeto (${res.status})`);
    }

    const site = await res.json();
    const originalHtml = site.html ?? "";
    const repairedHtml = absolutizeStorageUrls(originalHtml);

    // Abrir o projeto nunca pode depender de uma gravação de manutenção.
    setHtml(repairedHtml);
    setSiteId(site.id);
    setSiteSlug(site.siteSlug ?? null);
    setIsPublished(site.published ?? false);
    setCurrentSiteType(site.siteType ?? null);
    setCurrentConfig(site.config ?? null);
    setSeoScore(site.seoScore ?? null);
    setSeoChecklist(site.seoChecklist ?? null);
    setHistory([]);
    setError(null);
    setStatus("ready");

    // Normalização de URLs legadas é best-effort e jamais bloqueia abertura/edição.
    if (repairedHtml !== originalHtml) {
      void fetch(`/api/tenants/${tenantId}/site-generator/${site.id}/html`, {
        method: "PATCH",
        headers: authHeaders,
        body: JSON.stringify({ html: repairedHtml }),
      }).then((repairRes) => {
        if (!repairRes.ok) console.warn(`Site ${site.id}: normalização de URLs não persistida (${repairRes.status}); projeto permanece aberto.`);
      }).catch((repairError) => {
        console.warn(`Site ${site.id}: falha ao persistir normalização de URLs; projeto permanece aberto.`, repairError);
      });
    }

    return true;
  }, [tenantId, token]);'''

          old_switch = '''  async function handleSwitchSite(id: string) {
    if (id === siteId) return;
    await loadSite(id);
    setActiveTab("preview");
  }

  const [deletingSiteId, setDeletingSiteId] = useState<string | null>(null);'''

          new_switch = '''  const [openingSiteId, setOpeningSiteId] = useState<string | null>(null);

  async function openSiteProject(id: string, target: "preview" | "refine" = "preview") {
    setOpeningSiteId(id);
    try {
      const alreadyLoaded = id === siteId && status === "ready" && Boolean(html);
      if (!alreadyLoaded) {
        const loaded = await loadSite(id);
        if (!loaded) throw new Error("Projeto não encontrado");
      }
      setActiveTab(target);
      return true;
    } catch (err) {
      toast({
        title: "Não foi possível abrir o projeto",
        description: err instanceof Error ? err.message : "Tente novamente.",
        variant: "destructive",
      });
      return false;
    } finally {
      setOpeningSiteId(null);
    }
  }

  async function handleSwitchSite(id: string) {
    await openSiteProject(id, "preview");
  }

  async function handleEditSite(id: string) {
    const opened = await openSiteProject(id, "preview");
    if (opened) {
      toast({ description: "Projeto aberto para edição. Clique nos textos ou imagens do preview para alterar." });
    }
  }

  const [deletingSiteId, setDeletingSiteId] = useState<string | null>(null);'''

          old_ui = '''              <div
                key={s.id}
                className={`group flex items-center gap-1.5 rounded-full border pl-3 pr-1.5 py-1 text-xs font-medium transition-all max-w-[240px] ${
                  isActive
                    ? "border-primary bg-primary text-primary-foreground"
                    : "border-border bg-background text-muted-foreground hover:border-primary hover:text-primary"
                }`}
              >
                <button
                  onClick={() => handleSwitchSite(s.id)}
                  title={s.name}
                  className="flex items-center gap-1.5 cursor-pointer min-w-0"
                >
                  {SITE_TYPE_ICONS[s.siteType]}
                  <span className="truncate">{s.name || SITE_TYPE_LABELS[s.siteType] || s.siteType}</span>
                  {isActive && <span className="ml-0.5 shrink-0">✓</span>}
                </button>
                <button
                  onClick={(e) => { e.stopPropagation(); setEditingSiteId(s.id); setEditingName(s.name); }}
                  title="Renomear"
                  className={`shrink-0 ${isActive ? "text-primary-foreground/80 hover:text-primary-foreground" : "text-muted-foreground hover:text-foreground"}`}
                >
                  <Pencil className="h-3 w-3" />
                </button>
                <button
                  onClick={(e) => { e.stopPropagation(); handleDeleteSite(s); }}
                  disabled={deletingSiteId === s.id}
                  title="Excluir"
                  className={`shrink-0 ${isActive ? "text-primary-foreground/80 hover:text-red-200" : "text-muted-foreground hover:text-destructive"}`}
                >
                  {deletingSiteId === s.id ? <Loader2 className="h-3 w-3 animate-spin" /> : <Trash2 className="h-3 w-3" />}
                </button>
              </div>'''

          new_ui = '''              <div
                key={s.id}
                className={`group flex items-center gap-1.5 rounded-full border pl-3 pr-1.5 py-1 text-xs font-medium transition-all max-w-[380px] ${
                  isActive
                    ? "border-primary bg-primary text-primary-foreground"
                    : "border-border bg-background text-muted-foreground hover:border-primary hover:text-primary"
                }`}
              >
                <button
                  type="button"
                  onClick={() => void handleSwitchSite(s.id)}
                  disabled={openingSiteId === s.id}
                  title={`Abrir projeto: ${s.name || SITE_TYPE_LABELS[s.siteType] || s.siteType}`}
                  className="flex items-center gap-1.5 cursor-pointer min-w-0 disabled:opacity-60"
                >
                  {openingSiteId === s.id ? <Loader2 className="h-3.5 w-3.5 animate-spin shrink-0" /> : SITE_TYPE_ICONS[s.siteType]}
                  <span className="truncate">{s.name || SITE_TYPE_LABELS[s.siteType] || s.siteType}</span>
                  {isActive && <span className="ml-0.5 shrink-0">✓</span>}
                </button>
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); void handleSwitchSite(s.id); }}
                  disabled={openingSiteId === s.id}
                  title="Abrir projeto"
                  className={`shrink-0 rounded px-1.5 py-0.5 text-[10px] font-semibold underline underline-offset-2 disabled:opacity-50 ${isActive ? "text-primary-foreground/90 hover:text-primary-foreground" : "text-primary hover:text-primary/80"}`}
                >
                  Abrir
                </button>
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); void handleEditSite(s.id); }}
                  disabled={openingSiteId === s.id}
                  title="Editar projeto no preview"
                  aria-label={`Editar ${s.name || "projeto"}`}
                  className={`shrink-0 disabled:opacity-50 ${isActive ? "text-primary-foreground/80 hover:text-primary-foreground" : "text-muted-foreground hover:text-foreground"}`}
                >
                  <Pencil className="h-3 w-3" />
                </button>
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); setEditingSiteId(s.id); setEditingName(s.name); }}
                  title="Renomear projeto"
                  className={`shrink-0 text-[10px] font-semibold ${isActive ? "text-primary-foreground/75 hover:text-primary-foreground" : "text-muted-foreground hover:text-foreground"}`}
                >
                  Nome
                </button>
                <button
                  type="button"
                  onClick={(e) => { e.stopPropagation(); void handleDeleteSite(s); }}
                  disabled={deletingSiteId === s.id}
                  title="Excluir"
                  className={`shrink-0 ${isActive ? "text-primary-foreground/80 hover:text-red-200" : "text-muted-foreground hover:text-destructive"}`}
                >
                  {deletingSiteId === s.id ? <Loader2 className="h-3 w-3 animate-spin" /> : <Trash2 className="h-3 w-3" />}
                </button>
              </div>'''

          for label, old, new in [
              ("loadSite", old_load, new_load),
              ("switch", old_switch, new_switch),
              ("UI", old_ui, new_ui),
          ]:
              if old not in text:
                  print(f"{label} already patched or source changed")
              else:
                  text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/SiteGeneratorCore.tsx
          if git diff --cached --quiet; then
            echo "No patch changes"
          else
            git commit -m "fix(sites): permitir abrir e editar projetos existentes"
            git push origin HEAD:fix/site-project-open-edit
          fi