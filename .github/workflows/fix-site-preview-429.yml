name: fix-site-preview-429

on:
  push:
    branches:
      - fix/site-preview-429-direct

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-preview-429-direct
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-site-preview-429.py
      - name: Commit patch
        run: |
          rm -f .github/workflows/fix-site-preview-429.yml .github/scripts/patch-site-preview-429.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(site-generator): preview direto e resiliente a 429"
          git push origin HEAD:fix/site-preview-429-direct
