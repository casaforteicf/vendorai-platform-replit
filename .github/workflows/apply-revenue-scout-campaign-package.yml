name: Apply Revenue Scout Campaign Package

on:
  push:
    branches:
      - feat/revenue-scout-campaign-package

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[revenue-scout-campaign-package-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused integration
        run: python .github/scripts/apply_revenue_scout_campaign_package.py

      - name: Validate patch shape
        run: |
          git diff --check
          grep -q 'router.post("/prospector/campaign-package"' artifacts/api-server/src/routes/prospector.ts
          grep -q 'vendorai_ads_revenue_scout_draft_v1' artifacts/frontend/src/pages/Ads.tsx
          grep -q 'vendorai_lp_revenue_scout_draft_v1' artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -q 'campaignView === "lp"' artifacts/frontend/src/pages/ContentHub.tsx

      - name: Commit implementation and remove temporary applicator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-revenue-scout-campaign-package.yml
          git rm .github/scripts/apply_revenue_scout_campaign_package.py
          git add artifacts/api-server/src/routes/campaigns.ts artifacts/api-server/src/routes/prospector.ts artifacts/frontend/src/pages/Prospector.tsx artifacts/frontend/src/pages/ContentHub.tsx artifacts/frontend/src/pages/SiteGenerator.tsx artifacts/frontend/src/pages/Ads.tsx artifacts/frontend/src/pages/Campanhas.tsx
          git commit -m "feat(marketing): conectar Revenue Scout a campanhas, LP e Ads [revenue-scout-campaign-package-applied]"
          git push origin HEAD:feat/revenue-scout-campaign-package
