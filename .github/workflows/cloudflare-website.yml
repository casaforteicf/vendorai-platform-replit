name: Cloudflare Website

on:
  push:
    branches: [main]
    paths:
      - "artifacts/website/**"
      - "lib/vendor-brain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/cloudflare-website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-website-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy VendorAI website
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build website
        run: pnpm --filter @workspace/website build

      - name: Verify website bundle
        run: |
          test -f artifacts/website/dist/public/index.html
          test -f artifacts/website/dist/public/_worker.js
          test -f artifacts/website/dist/public/llms.txt
          grep -q "User-agent: OAI-SearchBot" artifacts/website/dist/public/robots.txt
          find artifacts/website/dist/public -maxdepth 1 -type f -regextype posix-extended -regex '.*/[0-9a-f]{64}\.txt' | grep -q .

      - name: Ensure Cloudflare Pages project
        run: pnpm dlx wrangler@3.90.0 pages project create vendorai-website --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy website to Cloudflare Pages
        run: pnpm dlx wrangler@3.90.0 pages deploy artifacts/website/dist/public --project-name vendorai-website --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind appvendorai.com and www.appvendorai.com
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          project="vendorai-website"
          target="vendorai-website.pages.dev"
          domains=("appvendorai.com" "www.appvendorai.com")
          endpoint="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project/domains"

          zone_response=$(curl -sS "${auth[@]}" "$api/zones?name=appvendorai.com")
          if [ "$(jq -r '.success // false' <<<"$zone_response")" != "true" ]; then
            echo "Cloudflare could not read the appvendorai.com zone"
            jq -c '{errors, messages}' <<<"$zone_response"
            exit 1
          fi
          zone_id=$(jq -r '.result[0].id // empty' <<<"$zone_response")
          test -n "$zone_id"

          for domain in "${domains[@]}"; do
            current=$(curl -sS "${auth[@]}" "$endpoint/$domain")
            if [ "$(jq -r '.success // false' <<<"$current")" != "true" ]; then
              echo "Attaching $domain to Cloudflare Pages"
              attach=$(curl -sS "${auth[@]}" -X POST "$endpoint" --data "{\"name\":\"$domain\"}")
              if [ "$(jq -r '.success // false' <<<"$attach")" != "true" ]; then
                echo "Could not attach $domain"
                jq -c '{errors, messages}' <<<"$attach"
                exit 1
              fi
            fi

            records=$(curl -sS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$domain")
            if [ "$(jq -r '.success // false' <<<"$records")" != "true" ]; then
              echo "Could not read DNS for $domain"
              jq -c '{errors, messages}' <<<"$records"
              exit 1
            fi

            while IFS= read -r record_id; do
              [ -z "$record_id" ] && continue
              echo "Removing previous website record $record_id for $domain"
              deleted=$(curl -sS "${auth[@]}" -X DELETE "$api/zones/$zone_id/dns_records/$record_id")
              if [ "$(jq -r '.success // false' <<<"$deleted")" != "true" ]; then
                echo "Could not remove old website DNS record for $domain"
                jq -c '{errors, messages}' <<<"$deleted"
                exit 1
              fi
            done < <(jq -r '.result[] | select(.type == "A" or .type == "AAAA" or .type == "CNAME") | .id' <<<"$records")

            payload=$(jq -nc --arg name "$domain" --arg content "$target" '{type:"CNAME",name:$name,content:$content,ttl:1,proxied:true}')
            created=$(curl -sS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$payload")
            if [ "$(jq -r '.success // false' <<<"$created")" != "true" ]; then
              echo "Could not point $domain to Cloudflare Pages"
              jq -c '{errors, messages}' <<<"$created"
              exit 1
            fi
          done

          for attempt in {1..24}; do
            all_active=true
            for domain in "${domains[@]}"; do
              state=$(curl -sS "${auth[@]}" "$endpoint/$domain")
              status=$(jq -r '.result.status // empty' <<<"$state")
              echo "$domain Pages status: ${status:-unknown}"
              if [ "$status" != "active" ]; then
                all_active=false
              fi
            done
            if [ "$all_active" = true ]; then
              exit 0
            fi
            sleep 10
          done

          echo "Website domains are attached but not active yet"
          exit 1

      - name: Notify IndexNow with final sitemap URLs
        continue-on-error: true
        run: node artifacts/website/scripts/submit-indexnow.mjs
