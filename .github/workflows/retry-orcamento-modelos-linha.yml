name: Retry proposal line templates

on:
  push:
    branches: [feat-orcamento-modelos-linha]
    paths:
      - '.github/workflows/retry-orcamento-modelos-linha.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-orcamento-modelos-linha
          fetch-depth: 0
      - name: Repair anchor and apply product patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-orcamento-modelos-linha.py')
          s = p.read_text()
          old = "end_marker = '// ── Contract Template Section ─────────────────────────────────────────────────\\n'\n"
          new = "end_marker = 'const CONTRACT_VARIABLES = ['\n"
          if old not in s:
              raise SystemExit('old end marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          python scripts/apply-orcamento-modelos-linha.py
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/frontend/src/pages/Configuracoes.tsx artifacts/frontend/src/pages/LeadPropostaTab.tsx artifacts/api-server/src/routes/lead_proposals.ts
          git commit -m 'feat: modelos de orçamento por linha de produto'
          git push origin HEAD:feat-orcamento-modelos-linha
