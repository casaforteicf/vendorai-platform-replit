name: One-shot Vendor Credits publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/one-shot-vendor-credits-publish.yml"

permissions:
  contents: read

concurrency:
  group: vendorai-production-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build app frontend
        env:
          VENDOR_BUILD_ID: ${{ github.sha }}
        run: pnpm --filter @workspace/frontend build

      - name: Verify bundle
        run: |
          test -f artifacts/frontend/dist/public/index.html
          test -f artifacts/frontend/dist/public/_worker.js

      - name: Publish app to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          pnpm dlx wrangler@3.90.0 pages project create vendorai --production-branch main || true
          pnpm dlx wrangler@3.90.0 pages deploy artifacts/frontend/dist/public --project-name vendorai --branch main

      - name: Smoke test production
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --connect-timeout 5 --max-time 20 https://app.appvendorai.com/login >/dev/null
