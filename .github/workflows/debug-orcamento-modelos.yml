name: Debug proposal line templates

on:
  push:
    branches: [feat-orcamento-modelos-linha]
    paths:
      - 'scripts/debug-orcamento-modelos.py'
      - '.github/workflows/debug-orcamento-modelos.yml'

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-orcamento-modelos-linha
          fetch-depth: 0
      - run: python scripts/debug-orcamento-modelos.py
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add debug-orcamento-anchors.txt
          git commit -m 'debug: âncoras modelos orçamento'
          git push origin HEAD:feat-orcamento-modelos-linha
