name: Patch Official Metrics Integration
on:
  push:
    branches: [feat/official-metrics-command-center]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-metrics-command-center
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch route registry and dashboard
        run: |
          python - <<'PY'
          from pathlib import Path

          routes = Path('artifacts/api-server/src/routes/index.ts')
          s = routes.read_text()
          import_anchor = 'import dashboardRouter from "./dashboard";'
          if 'officialMetricsRouter' not in s:
              s = s.replace(import_anchor, import_anchor + '\nimport officialMetricsRouter from "./official_metrics.js";')
              use_anchor = 'router.use(dashboardRouter);\nrouter.use(analyticsRouter);'
              s = s.replace(use_anchor, 'router.use(dashboardRouter);\nrouter.use(officialMetricsRouter);\nrouter.use(analyticsRouter);')
          routes.write_text(s)

          dash = Path('artifacts/frontend/src/pages/Dashboard.tsx')
          s = dash.read_text()
          s = s.replace('import { useState } from "react";', 'import { useEffect, useState } from "react";')
          s = s.replace('const { user } = useAuth();', 'const { user, token } = useAuth();', 1)

          state_anchor = '  const [mostrarAnalise, setMostrarAnalise] = useState(false);\n'
          state_block = '''  const [mostrarAnalise, setMostrarAnalise] = useState(false);\n  const [official, setOfficial] = useState<any>(null);\n  const [officialLoading, setOfficialLoading] = useState(false);\n\n  useEffect(() => {\n    if (!tenantId || !token) return;\n    let cancelled = false;\n    setOfficialLoading(true);\n    fetch(`/api/tenants/${tenantId}/dashboard/command-center`, {\n      headers: { Authorization: `Bearer ${token}` },\n      cache: "no-store",\n    })\n      .then(async (response) => {\n        if (!response.ok) throw new Error("Falha ao carregar métricas oficiais");\n        return response.json();\n      })\n      .then((data) => { if (!cancelled) setOfficial(data); })\n      .catch(() => { if (!cancelled) setOfficial(null); })\n      .finally(() => { if (!cancelled) setOfficialLoading(false); });\n    return () => { cancelled = true; };\n  }, [tenantId, token]);\n'''
          if 'setOfficialLoading' not in s:
              s = s.replace(state_anchor, state_block, 1)

          setup_anchor = '      {tenantId && <SetupChecklist tenantId={tenantId} />}\n\n      {/* KPI Row 1 — Pipeline e conversão */}'
          official_header = '''      {tenantId && <SetupChecklist tenantId={tenantId} />}\n\n      <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 rounded-lg border bg-muted/20 px-4 py-3">\n        <div>\n          <p className="text-sm font-semibold flex items-center gap-2"><BarChart3 className="h-4 w-4 text-primary" /> Centro de Métricas Oficiais</p>\n          <p className="text-xs text-muted-foreground">Somente dados reais do banco. Métricas sem fonte confirmada permanecem sem valor.</p>\n        </div>\n        <Badge variant="outline" className="w-fit">Fonte transacional · tempo real</Badge>\n      </div>\n\n      {/* KPI Row 1 — métricas oficiais */}'''
          if 'Centro de Métricas Oficiais' not in s:
              s = s.replace(setup_anchor, official_header, 1)

          s = s.replace('''                  Total de Leads\n''', '''                  Leads novos\n''', 1)
          s = s.replace('''                <p className="text-[clamp(1.1rem,5vw,1.5rem)] font-bold">{dashboard?.leads.total ?? 0}</p>\n                <p className="text-xs text-muted-foreground mt-0.5">\n                  {dashboard?.leads.novosUltimos30Dias ?? 0} novos nos últimos 30 dias\n                </p>''', '''                <p className="text-[clamp(1.1rem,5vw,1.5rem)] font-bold">{official?.commercial?.newLeads ?? (officialLoading ? "…" : "—")}</p>\n                <p className="text-xs text-muted-foreground mt-0.5">criados no período oficial</p>''', 1)

          s = s.replace('''                  Valor em Pipeline\n''', '''                  Oportunidades ativas\n''', 1)
          s = s.replace('''                <p className="text-[clamp(1.1rem,5vw,1.5rem)] font-bold">\n                  {formatCurrency(dashboard?.deals.totalEmNegociacao)}\n                </p>\n                <p className="text-xs text-muted-foreground mt-0.5">\n                  {dashboard?.deals.totalDeals ?? 0} negócios ativos\n                </p>''', '''                <p className="text-[clamp(1.1rem,5vw,1.5rem)] font-bold">{official?.commercial?.activeOpportunities ?? (officialLoading ? "…" : "—")}</p>\n                <p className="text-xs text-muted-foreground mt-0.5">deals comerciais não encerrados</p>''', 1)

          s = s.replace('''                  Ganhos este mês\n''', '''                  Receita vendida\n''', 1)
          s = s.replace('''                  {formatCurrency(dashboard?.ganhosMes?.somaValor)}\n                </p>\n                <p className="text-xs text-muted-foreground mt-0.5">\n                  {dashboard?.ganhosMes?.count ?? 0}{" "}\n                  {(dashboard?.ganhosMes?.count ?? 0) === 1 ? "negócio fechado" : "negócios fechados"}\n                </p>''', '''                  {official ? formatCurrency(official.commercial?.soldRevenue) : (officialLoading ? "…" : "—")}\n                </p>\n                <p className="text-xs text-muted-foreground mt-0.5">{official?.commercial?.confirmedSales ?? 0} vendas confirmadas no período</p>''', 1)

          s = s.replace('''                  {formatPercent(dashboard?.deals.taxaConversao)}\n                </p>\n                <p className="text-xs text-muted-foreground mt-0.5">ganhos / total de deals</p>''', '''                  {official?.commercial?.commercialConversion == null ? "—" : `${(official.commercial.commercialConversion * 100).toFixed(1)}%`}\n                </p>\n                <p className="text-xs text-muted-foreground mt-0.5">ganhos da coorte / oportunidades criadas</p>''', 1)

          # Acrescenta um resumo operacional real antes do botão de análise completa.
          button_anchor = '      {/* Botão pra revelar o resto -- pedido real: dashboard tinha'
          op_block = '''      {official && (\n        <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">\n          <Card><CardHeader className="pb-2"><CardTitle className="text-xs uppercase tracking-wide text-muted-foreground">Execução ativa</CardTitle></CardHeader><CardContent><p className="text-xl font-bold">{official.operation?.executionActive ?? 0}</p><p className="text-xs text-muted-foreground">cards operacionais ativos</p></CardContent></Card>\n          <Card><CardHeader className="pb-2"><CardTitle className="text-xs uppercase tracking-wide text-muted-foreground">Suporte ativo</CardTitle></CardHeader><CardContent><p className="text-xl font-bold">{official.operation?.supportActive ?? 0}</p><p className="text-xs text-muted-foreground">assistências em andamento</p></CardContent></Card>\n          <Card><CardHeader className="pb-2"><CardTitle className="text-xs uppercase tracking-wide text-muted-foreground">Tarefas vencidas</CardTitle></CardHeader><CardContent><p className="text-xl font-bold">{official.operation?.overdueTasks ?? 0}</p><p className="text-xs text-muted-foreground">pendentes + planejadas</p></CardContent></Card>\n          <Card><CardHeader className="pb-2"><CardTitle className="text-xs uppercase tracking-wide text-muted-foreground">Qualidade dos dados</CardTitle></CardHeader><CardContent><p className="text-xl font-bold">{official.dataQuality?.score == null ? "—" : `${official.dataQuality.score}%`}</p><p className="text-xs text-muted-foreground">completude da base válida</p></CardContent></Card>\n        </div>\n      )}\n\n'''
          if 'cards operacionais ativos' not in s:
              s = s.replace(button_anchor, op_block + button_anchor, 1)

          dash.write_text(s)
          PY

          rm .github/workflows/patch-official-metrics.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/index.ts artifacts/frontend/src/pages/Dashboard.tsx .github/workflows/patch-official-metrics.yml
          git commit -m "feat(dashboard): ligar métricas oficiais ao command center"
          git push origin HEAD:feat/official-metrics-command-center
