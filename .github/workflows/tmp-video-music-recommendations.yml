name: tmp-video-music-recommendations
on:
  push:
    branches:
      - feat/video-brand-music-recommendations
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-brand-music-recommendations
          fetch-depth: 0
      - name: Patch video editor
        run: python .github/tmp_video_music_recommendations_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(video): recommend brand-safe music automatically"
            git push origin feat/video-brand-music-recommendations
          fi
