name: Apply Marketing Ads

on:
  push:
    branches:
      - fix-marketing-ads

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-marketing-ads
          fetch-depth: 0
      - run: python scripts/patch-marketing-ads.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/components/layout/SidebarLayout.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: colocar Anúncios Patrocinados dentro de Marketing"
          git push origin fix-marketing-ads
