name: Apply Marketing Ads nav

on:
  push:
    branches: [fix-marketing-ads]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-marketing-ads
          fetch-depth: 0
      - name: Add Sponsored Ads under Marketing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/frontend/src/components/layout/SidebarLayout.tsx')
          s = p.read_text()
          if 'Anúncios Patrocinados' in s:
              print('Already present')
          else:
              old = '''              <Link
                href="/content?tab=campanhas"
                onClick={onNavigate}
                className="flex items-center gap-2 px-3 py-2 rounded-md text-sm text-muted-foreground hover:bg-muted hover:text-foreground transition-colors"
              >
                <Megaphone className="h-3.5 w-3.5" /> Campanhas
              </Link>
'''
              new = old + '''              <Link
                href="/ads"
                onClick={onNavigate}
                className={cn(
                  "flex items-center gap-2 px-3 py-2 rounded-md text-sm transition-colors",
                  location === "/ads"
                    ? "bg-primary/10 text-primary font-medium"
                    : "text-muted-foreground hover:bg-muted hover:text-foreground"
                )}
              >
                <Target className="h-3.5 w-3.5" /> Anúncios Patrocinados
              </Link>
'''
              if old not in s:
                  raise SystemExit('Campaigns block anchor not found')
              p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit product change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/components/layout/SidebarLayout.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: colocar Anúncios Patrocinados dentro de Marketing [marketing-ads-applied]"
          git push origin fix-marketing-ads
