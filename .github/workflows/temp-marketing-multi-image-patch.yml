name: Temporary Marketing multi-image patch

on:
  push:
    branches:
      - fix/marketing-multi-image-upload

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/marketing-multi-image-upload

      - name: Apply focused product patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, found {count}")
              return text.replace(old, new, 1)

          # Frontend — permitir seleção múltipla apenas no Feed e manter Stories/Reels como hoje.
          p = Path("artifacts/frontend/src/pages/Content.tsx")
          text = p.read_text()
          if "allowMultipleImages = false" not in text:
              pattern = re.compile(r'function MediaUploadButton\(\{.*?\n\}\n\nfunction ImageActionPanel\(\{', re.S)
              replacement = r'''function MediaUploadButton({
            contentId,
            variationIndex,
            tenantId,
            mediaType,
            onUploaded,
            triggerRef,
            allowMultipleImages = false,
            currentImageCount = 0,
          }: {
            contentId: string;
            variationIndex: number;
            tenantId: string;
            mediaType: "image" | "video";
            onUploaded: (mediaUrl: string, imageUrls?: string[]) => void;
            triggerRef?: React.MutableRefObject<(() => void) | null>;
            allowMultipleImages?: boolean;
            currentImageCount?: number;
          }) {
            const { toast } = useToast();
            const qc = useQueryClient();
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState<{ current: number; total: number } | null>(null);
            const inputRef = useRef<HTMLInputElement>(null);

            React.useEffect(() => {
              if (triggerRef) {
                triggerRef.current = () => inputRef.current?.click();
                return () => { if (triggerRef) triggerRef.current = null; };
              }
              return undefined;
            }, [triggerRef]);

            const isVideo = mediaType === "video";
            const allowedTypes = isVideo
              ? ["video/mp4", "video/quicktime", "video/webm"]
              : ["image/jpeg", "image/png", "image/webp"];
            const maxBytes = isVideo ? 100 * 1024 * 1024 : 10 * 1024 * 1024;
            const accept = isVideo ? "video/mp4,video/quicktime,video/webm" : "image/jpeg,image/png,image/webp";
            const field = isVideo ? "videoUrl" : "imageUrl";
            const maxFeedImages = 10;

            function validateFile(file: File): string | null {
              if (!allowedTypes.includes(file.type)) {
                return isVideo ? "Use MP4, MOV ou WebM." : "Use JPG, PNG ou WebP.";
              }
              if (file.size > maxBytes) {
                return `Máximo ${isVideo ? "100" : "10"} MB por arquivo.`;
              }
              return null;
            }

            async function uploadFile(file: File, append: boolean): Promise<{ mediaUrl: string; imageUrls?: string[] }> {
              const metaRes = await fetch("/api/storage/uploads/request-url", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ name: file.name, size: file.size, contentType: file.type }),
              });
              if (!metaRes.ok) throw new Error("Falha ao obter URL de upload");
              const { uploadURL, objectPath } = (await metaRes.json()) as { uploadURL: string; objectPath: string };

              const putRes = await fetch(uploadURL, {
                method: "PUT",
                body: file,
                headers: { "Content-Type": file.type },
              });
              if (!putRes.ok) throw new Error(`Falha ao enviar ${isVideo ? "vídeo" : "imagem"}`);

              const patchRes = await fetch(
                `/api/tenants/${tenantId}/content/${contentId}/variations/${variationIndex}/image`,
                {
                  method: "PATCH",
                  headers: {
                    "Content-Type": "application/json",
                    Authorization: `Bearer ${localStorage.getItem("vendorai_token")}`,
                  },
                  body: JSON.stringify({ objectPath, field, append }),
                }
              );
              const patchData = (await patchRes.json().catch(() => ({}))) as { mediaUrl?: string; imageUrls?: string[]; error?: string };
              if (!patchRes.ok || !patchData.mediaUrl) {
                throw new Error(patchData.error ?? `Falha ao salvar ${isVideo ? "vídeo" : "imagem"}`);
              }
              return { mediaUrl: patchData.mediaUrl, imageUrls: patchData.imageUrls };
            }

            async function handleFiles(files: File[]) {
              if (files.length === 0) return;
              const selectedFiles = !isVideo && allowMultipleImages ? files : files.slice(0, 1);

              for (const file of selectedFiles) {
                const validationError = validateFile(file);
                if (validationError) {
                  toast({
                    title: allowedTypes.includes(file.type) ? `${isVideo ? "Vídeo" : "Imagem"} muito grande` : "Formato inválido",
                    description: validationError,
                    variant: "destructive",
                  });
                  return;
                }
              }

              if (!isVideo && allowMultipleImages && currentImageCount + selectedFiles.length > maxFeedImages) {
                toast({
                  title: "Máximo de 10 imagens",
                  description: `Este post já tem ${currentImageCount} imagem(ns). Remova alguma antes de adicionar ${selectedFiles.length}.`,
                  variant: "destructive",
                });
                return;
              }

              setUploading(true);
              setUploadProgress({ current: 0, total: selectedFiles.length });
              try {
                let lastMediaUrl = "";
                let latestImageUrls: string[] | undefined;

                for (let i = 0; i < selectedFiles.length; i++) {
                  setUploadProgress({ current: i + 1, total: selectedFiles.length });
                  const result = await uploadFile(selectedFiles[i]!, !isVideo && allowMultipleImages);
                  lastMediaUrl = result.mediaUrl;
                  if (result.imageUrls) latestImageUrls = result.imageUrls;
                }

                if (lastMediaUrl) onUploaded(lastMediaUrl, latestImageUrls);
                qc.invalidateQueries({ queryKey: ["content", tenantId] });
                toast({
                  title: !isVideo && selectedFiles.length > 1
                    ? `${selectedFiles.length} imagens adicionadas!`
                    : `${isVideo ? "Vídeo" : "Imagem"} atualizado!`,
                  description: !isVideo && allowMultipleImages
                    ? "As imagens ficaram salvas no post e podem ser publicadas como carrossel."
                    : `${isVideo ? "Vídeo" : "Imagem"} salvo e pronto para publicar.`,
                });
              } catch (err) {
                toast({ title: "Erro no upload", description: err instanceof Error ? err.message : "Tente novamente.", variant: "destructive" });
              } finally {
                setUploading(false);
                setUploadProgress(null);
              }
            }

            const uploadLabel = uploading && uploadProgress
              ? `Enviando ${uploadProgress.current}/${uploadProgress.total}…`
              : isVideo
                ? "Meu vídeo"
                : allowMultipleImages
                  ? "Adicionar imagens"
                  : "Minha imagem";

            return (
              <>
                <input
                  ref={inputRef}
                  type="file"
                  accept={accept}
                  multiple={!isVideo && allowMultipleImages}
                  className="hidden"
                  onChange={(e) => {
                    const files = Array.from(e.target.files ?? []);
                    if (files.length > 0) void handleFiles(files);
                    e.target.value = "";
                  }}
                />
                <Button
                  variant="outline"
                  size="sm"
                  onClick={() => inputRef.current?.click()}
                  disabled={uploading || (!isVideo && allowMultipleImages && currentImageCount >= maxFeedImages)}
                  title={isVideo ? "Usar meu vídeo" : allowMultipleImages ? "Adicionar uma ou várias imagens" : "Usar minha imagem"}
                  className="h-7 px-2 text-xs gap-1"
                >
                  {uploading ? <Loader2 className="h-3 w-3 animate-spin" /> : <Upload className="h-3 w-3" />}
                  {uploadLabel}
                </Button>
              </>
            );
          }

          function ImageActionPanel({'''
              text, n = pattern.subn(replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f"frontend MediaUploadButton: expected 1 replacement, found {n}")

              old_call = '''                  <MediaUploadButton
                    contentId={contentId}
                    variationIndex={index}
                    tenantId={tenantId}
                    mediaType={(type === "reels" || type === "tiktok") ? "video" : "image"}
                    onUploaded={(type === "reels" || type === "tiktok") ? setLocalVideoUrl : (url) => { setLocalImageUrl(url); setLocalImageUrls(null); }}
                    triggerRef={(type !== "reels" && type !== "tiktok") ? uploadTriggerRef : undefined}
                  />'''
              new_call = '''                  <MediaUploadButton
                    contentId={contentId}
                    variationIndex={index}
                    tenantId={tenantId}
                    mediaType={(type === "reels" || type === "tiktok") ? "video" : "image"}
                    allowMultipleImages={type === "feed"}
                    currentImageCount={type === "feed"
                      ? ((effectiveVariation as FeedVariation).imageUrls?.length ?? ((effectiveVariation as FeedVariation).imageUrl ? 1 : 0))
                      : 0}
                    onUploaded={(type === "reels" || type === "tiktok")
                      ? (url) => setLocalVideoUrl(url)
                      : type === "feed"
                        ? (url, imageUrls) => {
                            const nextUrls = imageUrls?.length ? imageUrls : [url];
                            setLocalImageUrls(nextUrls);
                            setLocalImageUrl(nextUrls[0]);
                          }
                        : (url) => { setLocalImageUrl(url); setLocalImageUrls(null); }}
                    triggerRef={(type !== "reels" && type !== "tiktok") ? uploadTriggerRef : undefined}
                  />'''
              text = replace_once(text, old_call, new_call, "frontend MediaUploadButton usage")
              text = replace_once(
                  text,
                  '            onGenerated={setLocalImageUrl}',
                  '            onGenerated={(url) => { setLocalImageUrl(url); setLocalImageUrls(null); }}',
                  "frontend regenerate image state",
              )
              p.write_text(text)

          # Backend content route — append de imagens com limite seguro de carrossel.
          p = Path("artifacts/api-server/src/routes/content.ts")
          text = p.read_text()
          if "append: z.boolean().optional().default(false)" not in text:
              text = replace_once(
                  text,
                  '''const patchMediaBodySchema = z.object({
            objectPath: z.string().min(1),
            field: z.enum(["imageUrl", "videoUrl"]).default("imageUrl"),
          });''',
                  '''const patchMediaBodySchema = z.object({
            objectPath: z.string().min(1),
            field: z.enum(["imageUrl", "videoUrl"]).default("imageUrl"),
            append: z.boolean().optional().default(false),
          });''',
                  "backend patch schema",
              )

              route_pattern = re.compile(
                  r'router\.patch\("/tenants/:tenantId/content/:contentId/variations/:idx/image", async \(req, res\) => \{.*?\n\}\);\n\nrouter\.delete\("/tenants/:tenantId/content/:contentId/variations/:idx/image",',
                  re.S,
              )
              route_replacement = r'''router.patch("/tenants/:tenantId/content/:contentId/variations/:idx/image", async (req, res) => {
            const tenantId = String(req.params["tenantId"]);
            const contentId = String(req.params["contentId"]);
            const idx = parseInt(String(req.params["idx"]), 10);

            if (req.user?.platformRole !== "super_admin" && req.user?.tenantId !== tenantId) {
              res.status(403).json({ error: "Acesso negado" });
              return;
            }

            const body = patchMediaBodySchema.safeParse(req.body);
            if (!body.success) {
              res.status(400).json({ error: "objectPath é obrigatório" });
              return;
            }

            const [gen] = await db
              .select()
              .from(contentGenerationsTable)
              .where(and(eq(contentGenerationsTable.id, contentId), eq(contentGenerationsTable.tenantId, tenantId)))
              .limit(1);

            if (!gen) { res.status(404).json({ error: "Conteúdo não encontrado" }); return; }

            const variations = [...gen.result.variations] as (typeof gen.result.variations[number] & {
              imageUrl?: string | null;
              imageUrls?: string[];
              videoUrl?: string;
            })[];
            if (!variations[idx]) { res.status(400).json({ error: "Variação inválida" }); return; }

            const mediaUrl = `/api/storage${body.data.objectPath}`;
            const variation = variations[idx]!;
            let responseImageUrls: string[] | undefined;

            if (body.data.field === "imageUrl") {
              if (body.data.append) {
                const currentUrls = variation.imageUrls ?? (variation.imageUrl ? [variation.imageUrl] : []);
                const nextUrls = Array.from(new Set([...currentUrls, mediaUrl]));
                if (nextUrls.length > 10) {
                  res.status(422).json({ error: "O Feed aceita no máximo 10 imagens por publicação." });
                  return;
                }
                responseImageUrls = nextUrls;
                variations[idx] = {
                  ...variation,
                  imageUrl: nextUrls[0] ?? mediaUrl,
                  imageUrls: nextUrls.length > 1 ? nextUrls : undefined,
                };
              } else {
                responseImageUrls = [mediaUrl];
                variations[idx] = { ...variation, imageUrl: mediaUrl, imageUrls: undefined };
              }
            } else {
              variations[idx] = { ...variation, videoUrl: mediaUrl };
            }

            await db
              .update(contentGenerationsTable)
              .set({ result: { variations } })
              .where(eq(contentGenerationsTable.id, contentId));

            res.json({ success: true, mediaUrl, field: body.data.field, imageUrls: responseImageUrls });
          });

          router.delete("/tenants/:tenantId/content/:contentId/variations/:idx/image",'''
              text, n = route_pattern.subn(route_replacement, text, count=1)
              if n != 1:
                  raise SystemExit(f"backend media route: expected 1 replacement, found {n}")
              p.write_text(text)

          # Tipos compartilhados — o JSON já suporta imageUrls; formalizar no contrato.
          p = Path("lib/db/src/schema/content_generations.ts")
          text = p.read_text()
          if "imageUrls?: string[]" not in text:
              text = replace_once(
                  text,
                  'export type FeedVariation = { caption: string; hashtags: string[]; imageUrl?: string };\nexport type StoriesVariation = { text: string; cta: string; imageUrl?: string };',
                  'export type FeedVariation = { caption: string; hashtags: string[]; imageUrl?: string; imageUrls?: string[] };\nexport type StoriesVariation = { text: string; cta: string; imageUrl?: string; imageUrls?: string[] };',
                  "shared content variation types",
              )
              p.write_text(text)

          # Instagram — publicação real de carrossel quando houver mais de uma imagem.
          p = Path("artifacts/api-server/src/lib/instagram-publish.ts")
          text = p.read_text()
          if "publishFeedCarousel" not in text:
              marker = 'export async function publishStoriesPost('
              carousel_fn = '''export async function publishFeedCarousel(
            instagramAccountId: string,
            token: string,
            caption: string,
            imageUrls: string[],
            log: Logger,
          ): Promise<string> {
            if (imageUrls.length < 2 || imageUrls.length > 10) {
              throw new InstagramApiError("O carrossel do Instagram precisa ter entre 2 e 10 imagens.", 422);
            }

            log.info({ instagramAccountId, imageCount: imageUrls.length }, "instagram-publish: creating carousel items");

            const childIds: string[] = [];
            for (const imageUrl of imageUrls) {
              const child = (await gFetch(`${GRAPH}/${encodeURIComponent(instagramAccountId)}/media`, {
                method: "POST",
                headers: { "Content-Type": "application/x-www-form-urlencoded" },
                body: new URLSearchParams({
                  image_url: imageUrl,
                  is_carousel_item: "true",
                  access_token: token,
                }).toString(),
              })) as { id: string };
              childIds.push(child.id);
            }

            const container = (await gFetch(`${GRAPH}/${encodeURIComponent(instagramAccountId)}/media`, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({
                media_type: "CAROUSEL",
                children: childIds.join(","),
                caption,
                access_token: token,
              }).toString(),
            })) as { id: string };

            const published = (await gFetch(`${GRAPH}/${encodeURIComponent(instagramAccountId)}/media_publish`, {
              method: "POST",
              headers: { "Content-Type": "application/x-www-form-urlencoded" },
              body: new URLSearchParams({ creation_id: container.id, access_token: token }).toString(),
            })) as { id: string };

            log.info({ postId: published.id, imageCount: imageUrls.length }, "instagram-publish: carousel published");
            return published.id;
          }

          '''
              if marker not in text:
                  raise SystemExit("instagram carousel marker not found")
              text = text.replace(marker, carousel_fn + marker, 1)
              p.write_text(text)

          # Publisher — usar todas as imagens do Feed, não apenas a primeira.
          p = Path("artifacts/api-server/src/services/contentSocialPublisher.ts")
          text = p.read_text()
          if "publishFeedCarousel" not in text:
              text = replace_once(
                  text,
                  '''import {
            publishFeedPost,
            publishReelPost,
            publishStoriesPost,
          } from "../lib/instagram-publish.js";''',
                  '''import {
            publishFeedCarousel,
            publishFeedPost,
            publishReelPost,
            publishStoriesPost,
          } from "../lib/instagram-publish.js";''',
                  "publisher import",
              )

              old_feed = '''  if (gen.type === "feed") {
            const feed = variation as FeedVariation;
            const imageUrl = feed.imageUrl;
            if (!imageUrl) throw new SocialPublicationError("Imagem não disponível para publicar o Feed.", 400);
            const publicImageUrl = await resolveInstagramMediaUrl(imageUrl);
            const caption = params.captionOverride ?? `${feed.caption}\\n\\n${(feed.hashtags ?? []).join(" ")}`;
            postId = await publishFeedPost(accountId, accessToken, caption, publicImageUrl, params.log);
            captionOuTexto = caption;
          } else if (gen.type === "stories") {'''
              new_feed = '''  if (gen.type === "feed") {
            const feed = variation as FeedVariation;
            const imageUrls = feed.imageUrls?.length ? feed.imageUrls : feed.imageUrl ? [feed.imageUrl] : [];
            if (imageUrls.length === 0) throw new SocialPublicationError("Imagem não disponível para publicar o Feed.", 400);
            if (imageUrls.length > 10) throw new SocialPublicationError("O Feed aceita no máximo 10 imagens por publicação.", 400);
            const publicImageUrls = await Promise.all(imageUrls.map(resolveInstagramMediaUrl));
            const caption = params.captionOverride ?? `${feed.caption}\\n\\n${(feed.hashtags ?? []).join(" ")}`;
            postId = publicImageUrls.length > 1
              ? await publishFeedCarousel(accountId, accessToken, caption, publicImageUrls, params.log)
              : await publishFeedPost(accountId, accessToken, caption, publicImageUrls[0]!, params.log);
            captionOuTexto = caption;
          } else if (gen.type === "stories") {'''
              text = replace_once(text, old_feed, new_feed, "publisher feed carousel")
              p.write_text(text)

          PY

          git diff --check

      - name: Commit product changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No product changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/Content.tsx \
                  artifacts/api-server/src/routes/content.ts \
                  artifacts/api-server/src/lib/instagram-publish.ts \
                  artifacts/api-server/src/services/contentSocialPublisher.ts \
                  lib/db/src/schema/content_generations.ts
          git commit -m "Marketing: permitir várias imagens no Feed"
          git push origin HEAD:fix/marketing-multi-image-upload
