name: tmp-music-collections-patch
on:
  push:
    branches:
      - feat/media-music-collections-brand
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-music-collections-brand
          fetch-depth: 0
      - name: Patch MediaCenter
        run: python .github/tmp_music_collections_patch.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/MediaCenter.tsx
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat(media): connect music collections and brand filters"
            git push origin feat/media-music-collections-brand
          fi
