name: VendorAI Stability Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/frontend/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/vendorai-stability-gate.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/frontend/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/vendorai-stability-gate.yml"
  workflow_dispatch:

concurrency:
  group: vendorai-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-p0:
    name: P0 CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: CRM deal isolation regression
        run: pnpm --filter @workspace/api-server exec vitest run --config vitest.config.ts src/__tests__/deals-isolation.test.ts

  obras-p0:
    name: P0 Obras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: Obras portal regressions
        run: pnpm --filter @workspace/frontend exec vitest run --config vitest.config.ts src/pages/PortalObra.integration.test.tsx src/lib/portalTabStorage.test.ts

  tenant-integrity:
    name: Tenant + Production Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: Tenant isolation baseline
        run: pnpm --filter @workspace/api-server audit:tenant:baseline
      - name: Production integrity audit
        run: pnpm --filter @workspace/api-server audit:production-integrity

  full-validation:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: Vendor Brain foundation typecheck
        run: pnpm --filter @workspace/vendor-brain typecheck
      - name: Launch-critical API typecheck
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.launch-ci.json --noEmit
      - name: Frontend production build
        run: pnpm --filter @workspace/frontend build
      - name: API production build
        run: pnpm --filter @workspace/api-server build
      - name: Repository-wide API typecheck diagnostic
        continue-on-error: true
        run: |
          pnpm exec tsc -b lib/integrations-anthropic-ai/tsconfig.json
          pnpm --filter @workspace/api-server typecheck
      - name: Frontend typecheck diagnostic
        continue-on-error: true
        run: pnpm --filter @workspace/frontend typecheck
