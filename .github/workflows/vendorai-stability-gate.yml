name: VendorAI Stability Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/frontend/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/vendorai-stability-gate.yml"
      - ".github/workflows/merge-release-agent.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/frontend/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/vendorai-stability-gate.yml"
  workflow_dispatch:

concurrency:
  group: vendorai-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-p0:
    name: P0 CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile

      - name: Detectar escopo de código
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          code_changed=true

          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            echo "Arquivos alterados:"
            echo "$changed_files"

            if ! grep -Eq '^(artifacts/|lib/|scripts/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig(\..+)?\.json$|\.node-version$)' <<<"$changed_files"; then
              code_changed=false
            fi
          fi

          echo "code_changed=$code_changed" >> "$GITHUB_OUTPUT"
          echo "code_changed=$code_changed"

      - name: CRM deal isolation regression
        run: pnpm --filter @workspace/api-server exec vitest run --config vitest.config.ts src/__tests__/deals-isolation.test.ts

  obras-p0:
    name: P0 Obras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: Obras portal regressions
        run: pnpm --filter @workspace/frontend exec vitest run --config vitest.config.ts src/pages/PortalObra.integration.test.tsx src/lib/portalTabStorage.test.ts

  tenant-integrity:
    name: Tenant + Production Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: Tenant isolation baseline
        run: pnpm --filter @workspace/api-server audit:tenant:baseline
      - name: Production integrity audit
        run: pnpm --filter @workspace/api-server audit:production-integrity

  full-validation:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Enable pnpm
        run: npm install --global pnpm@10.26.1
      - run: pnpm install --frozen-lockfile
      - name: Typecheck sem regressão contra a base do PR
        if: steps.scope.outputs.code_changed == 'true'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ] && [ -n "${BASE_SHA:-}" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            changed_files="$(git diff --name-only "$BASE_SHA" HEAD)"
            echo "Arquivos alterados:"
            echo "$changed_files"

            if ! grep -Eq '^(artifacts/|lib/|scripts/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig(\..+)?\.json$|\.node-version$)' <<<"$changed_files"; then
              echo "✅ PR altera apenas governança/documentação fora do código TypeScript; comparação de typecheck não se aplica."
              exit 0
            fi
          fi

          normalize_errors() {
            sed -E               -e 's#^([^:[:space:]]+/)*##'               -e 's#\([0-9]+,[0-9]+\)##g'               -e 's#[[:space:]]+# #g'               | grep -E 'error TS[0-9]+:'               | sort -u
          }

          set +e
          pnpm typecheck 2>&1 | tee /tmp/head-typecheck.log
          head_status=${PIPESTATUS[0]}
          set -e

          if [ "$head_status" = "0" ]; then
            echo "Typecheck do PR está totalmente verde."
            exit 0
          fi

          if [ "${{ github.event_name }}" != "pull_request" ] || [ -z "${BASE_SHA:-}" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::error::Typecheck falhou e não há base de PR disponível para comparação."
            exit "$head_status"
          fi

          normalize_errors < /tmp/head-typecheck.log > /tmp/head-errors.txt

          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach /tmp/vendorai-base "$BASE_SHA"

          (
            cd /tmp/vendorai-base
            pnpm install --frozen-lockfile >/dev/null
            set +e
            NODE_OPTIONS=--max-old-space-size=6144 pnpm typecheck 2>&1 | tee /tmp/base-typecheck.log
            exit 0
          )

          normalize_errors < /tmp/base-typecheck.log > /tmp/base-errors.txt

          comm -23 /tmp/head-errors.txt /tmp/base-errors.txt > /tmp/new-errors.txt

          echo "Erros na base: $(wc -l < /tmp/base-errors.txt)"
          echo "Erros no PR: $(wc -l < /tmp/head-errors.txt)"
          echo "Erros novos: $(wc -l < /tmp/new-errors.txt)"

          if [ -s /tmp/new-errors.txt ]; then
            echo "::error::O PR introduziu novos erros de TypeScript:"
            cat /tmp/new-errors.txt
            exit 1
          fi

          echo "✅ Nenhum erro novo de TypeScript foi introduzido pelo PR."
          echo "::warning::A base ainda possui dívida de TypeScript; este PR não a aumentou."
      - name: Backend tests
        if: steps.scope.outputs.code_changed == 'true'
        run: pnpm --filter @workspace/api-server test
      - name: Frontend tests
        if: steps.scope.outputs.code_changed == 'true'
        run: pnpm --filter @workspace/frontend test
      - name: Build all production packages
        if: steps.scope.outputs.code_changed == 'true'
        run: pnpm build
