name: VendorAI Stability Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/frontend/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/vendorai-stability-gate.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "artifacts/frontend/**"
      - "lib/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/workflows/vendorai-stability-gate.yml"
  workflow_dispatch:

concurrency:
  group: vendorai-stability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crm-p0:
    name: P0 CRM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: CRM deal isolation regression
        run: pnpm --filter @workspace/api-server exec vitest run --config vitest.config.ts src/__tests__/deals-isolation.test.ts

  obras-p0:
    name: P0 Obras
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Obras portal regressions
        run: pnpm --filter @workspace/frontend exec vitest run --config vitest.config.ts src/pages/PortalObra.integration.test.tsx src/lib/portalTabStorage.test.ts

  tenant-integrity:
    name: Tenant + Production Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Tenant isolation baseline
        run: pnpm --filter @workspace/api-server audit:tenant:baseline
      - name: Production integrity audit
        run: pnpm --filter @workspace/api-server audit:production-integrity

  full-validation:
    name: Typecheck + Tests + Build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".node-version"
      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@10.26.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Root typecheck
        run: pnpm typecheck
      - name: Backend tests
        run: pnpm --filter @workspace/api-server test
      - name: Frontend tests
        run: pnpm --filter @workspace/frontend test
      - name: Build all production packages
        run: pnpm build
