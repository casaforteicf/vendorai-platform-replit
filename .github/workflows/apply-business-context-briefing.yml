name: Apply business context briefing patch

on:
  push:
    branches:
      - feat/business-context-briefing-suggestions

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/business-context-briefing-suggestions
          fetch-depth: 0
      - name: Skip generated patch commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[context-patch\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply contextual briefing patch
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/apply-business-context-briefing.py
      - name: Remove one-shot patch files
        if: steps.guard.outputs.skip != 'true'
        run: rm .github/workflows/apply-business-context-briefing.yml scripts/apply-business-context-briefing.py
      - name: Commit patch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'VendorAI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/frontend/src/pages/SiteGenerator.tsx .github/workflows/apply-business-context-briefing.yml scripts/apply-business-context-briefing.py
          git commit -m 'feat: contextual briefing suggestions [context-patch]'
          git push origin HEAD:feat/business-context-briefing-suggestions
