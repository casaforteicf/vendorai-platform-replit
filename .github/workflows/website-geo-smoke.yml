name: Website GEO and AI Discovery Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "artifacts/website/**"
      - ".github/workflows/website-geo-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geo-smoke:
    name: Validate llms.txt and sitemap discovery in production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for exact commit on edge
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 48); do
            deployed=$(curl -fsS -H 'Cache-Control: no-cache' "https://appvendorai.com/deployment-version.txt?sha=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n' || true)
            echo "Edge version: ${deployed:-pending} (expected ${GITHUB_SHA})"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for ${GITHUB_SHA} on Cloudflare edge."
          exit 1

      - name: Validate llms.txt and official entity signals
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -H 'Cache-Control: no-cache' -o /tmp/llms.txt -w '%{http_code}' "https://appvendorai.com/llms.txt?smoke=${GITHUB_SHA}")
          test "$status" = "200"
          grep -q '^# VendorAI' /tmp/llms.txt
          grep -q 'Plataforma brasileira de CRM' /tmp/llms.txt
          grep -q 'https://appvendorai.com/produtos/crm' /tmp/llms.txt
          grep -q 'https://appvendorai.com/produtos/revenue-scout' /tmp/llms.txt
          grep -q 'https://www.instagram.com/appvendor.ai/' /tmp/llms.txt
          grep -q '59.623.589/0001-27' /tmp/llms.txt
          grep -q 'Orientação para sistemas de IA' /tmp/llms.txt

          curl -fsS -H 'Accept: text/html' -H 'Cache-Control: no-cache' "https://appvendorai.com/?smoke=${GITHUB_SHA}" -o /tmp/home.html
          grep -q 'data-vendorai-entity="official"' /tmp/home.html
          grep -q '"sameAs": \["https://www.instagram.com/appvendor.ai/"\]' /tmp/home.html
          grep -q '59.623.589/0001-27' /tmp/home.html

      - name: Validate sitemap index and child sitemaps
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "https://appvendorai.com/sitemap.xml?smoke=${GITHUB_SHA}" -o /tmp/sitemap.xml
          grep -q '<sitemapindex' /tmp/sitemap.xml
          grep -q 'sitemap-core.xml' /tmp/sitemap.xml
          grep -q 'sitemap-products.xml' /tmp/sitemap.xml
          grep -q 'sitemap-solutions.xml' /tmp/sitemap.xml
          grep -q 'sitemap-segments.xml' /tmp/sitemap.xml
          grep -q 'sitemap-content.xml' /tmp/sitemap.xml

          for child in core products solutions segments content; do
            status=$(curl -sS -H 'Cache-Control: no-cache' -o "/tmp/sitemap-${child}.xml" -w '%{http_code}' "https://appvendorai.com/sitemap-${child}.xml?smoke=${GITHUB_SHA}")
            echo "sitemap-${child}.xml -> HTTP ${status}"
            test "$status" = "200"
            grep -q '<urlset' "/tmp/sitemap-${child}.xml"
          done

          grep -q '<loc>https://appvendorai.com/produtos/crm</loc>' /tmp/sitemap-products.xml
          grep -q '<loc>https://appvendorai.com/solucoes/crm-whatsapp</loc>' /tmp/sitemap-solutions.xml
          grep -q '<loc>https://appvendorai.com/lp/distribuidora-materiais-construcao</loc>' /tmp/sitemap-segments.xml
          grep -q '<loc>https://appvendorai.com/blog/crm-integrado-com-whatsapp-o-que-e-e-como-funciona</loc>' /tmp/sitemap-content.xml
