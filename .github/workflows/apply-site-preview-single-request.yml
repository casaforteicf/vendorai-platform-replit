name: Apply site preview single-request repair
on:
  push:
    paths:
      - '.github/workflows/apply-site-preview-single-request.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-preview-direct-api
          fetch-depth: 0
      - name: Patch preview flow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          frontend = Path('artifacts/frontend/src/pages/SiteGenerator.tsx')
          s = frontend.read_text()

          old_type = 'const [sites, setSites] = useState<Array<{ id: string; name?: string; updatedAt?: string; createdAt?: string }>>([]);'
          new_type = 'const [sites, setSites] = useState<Array<{ id: string; name?: string; html?: string; updatedAt?: string; createdAt?: string }>>([]);'
          if old_type not in s:
              raise SystemExit('frontend sites type marker not found')
          s = s.replace(old_type, new_type, 1)

          pattern = re.compile(r'''      const currentExists = selectedSiteId && sorted\.some\(\(site: any\) => site\.id === selectedSiteId\);\n      const requestedExists = requestedSiteId && sorted\.some\(\(site: any\) => site\.id === requestedSiteId\);\n      const targetId = requestedExists \? requestedSiteId! : currentExists \? selectedSiteId : sorted\[0\]\.id;\n\n      let siteRes = await resilientFetch\(`/api/tenants/\$\{tenantId\}/site-generator/\$\{targetId\}/preview`, \{ headers: headers\(token\) \}, 2\);\n      if \(siteRes\.status === 404\) \{\n        // Compatibilidade durante deploy escalonado: usa a rota legada se a rota dedicada ainda não chegou ao backend\.\n        siteRes = await resilientFetch\(`/api/tenants/\$\{tenantId\}/site-generator/\$\{targetId\}`, \{ headers: headers\(token\) \}, 2\);\n      \}\n      const body = await siteRes\.json\(\)\.catch\(\(\) => \(\{\}\)\);\n      const site = body\?\.site \?\? body;\n      if \(!siteRes\.ok\) \{\n        throw new Error\(site\?\.error \?\? `Não foi possível carregar o site \(\$\{siteRes\.status\}\)`\);\n      \}\n''')
          replacement = '''      const currentExists = selectedSiteId && sorted.some((site: any) => site.id === selectedSiteId);\n      const requestedExists = requestedSiteId && sorted.some((site: any) => site.id === requestedSiteId);\n      const targetId = requestedExists ? requestedSiteId! : currentExists ? selectedSiteId : sorted[0].id;\n      const targetSite = sorted.find((site: any) => site.id === targetId);\n\n      // O endpoint de listagem já devolve o HTML salvo. Isso transforma o preview\n      // em uma única requisição e evita que o segundo GET seja bloqueado pelo\n      // rate limit quando o restante do painel está carregando em paralelo.\n      let site: any = targetSite;\n      if (typeof targetSite?.html !== "string" || !targetSite.html.trim()) {\n        // Compatibilidade temporária enquanto o backend novo termina o deploy.\n        const siteRes = await resilientFetch(`/api/tenants/${tenantId}/site-generator/${targetId}`, { headers: headers(token) }, 1);\n        const body = await siteRes.json().catch(() => ({}));\n        site = body?.site ?? body;\n        if (!siteRes.ok) {\n          throw new Error(site?.error ?? `Não foi possível carregar o site (${siteRes.status})`);\n        }\n      }\n'''
          s, count = pattern.subn(replacement, s, count=1)
          if count != 1:
              raise SystemExit(f'frontend preview block marker count={count}')
          frontend.write_text(s)

          backend = Path('artifacts/api-server/src/routes/site_generator_core.ts')
          b = backend.read_text()
          old_select = '''      id: generatedSitesTable.id,\n      name: generatedSitesTable.name,\n      siteType: generatedSitesTable.siteType,\n      config: generatedSitesTable.config,\n      createdAt: generatedSitesTable.createdAt,\n      updatedAt: generatedSitesTable.updatedAt,\n'''
          new_select = '''      id: generatedSitesTable.id,\n      name: generatedSitesTable.name,\n      siteType: generatedSitesTable.siteType,\n      config: generatedSitesTable.config,\n      html: generatedSitesTable.html,\n      published: generatedSitesTable.published,\n      siteSlug: generatedSitesTable.siteSlug,\n      createdAt: generatedSitesTable.createdAt,\n      updatedAt: generatedSitesTable.updatedAt,\n'''
          if old_select not in b:
              raise SystemExit('backend list select marker not found')
          b = b.replace(old_select, new_select, 1)
          backend.write_text(b)
          PY
      - name: Remove one-shot workflow
        run: rm -f .github/workflows/apply-site-preview-single-request.yml
      - name: Commit repair
        run: |
          git config user.name 'VendorAI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: render saved site preview from a single API request'
          git push origin fix/site-preview-direct-api
