name: Validate Instagram Direct Publishing

on:
  push:
    branches:
      - fix-instagram-direct-publishing

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-instagram-direct-publishing
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript targeted Instagram files
        run: |
          set +e
          NODE_OPTIONS=--max-old-space-size=8192 pnpm --filter @workspace/api-server exec tsc --noEmit --pretty false > /tmp/tsc.log 2>&1
          status=$?
          set -e
          echo "tsc exit: $status"
          matches=$(grep -E "(instagram-publish\.ts|instagram-oauth\.ts|content-performance\.ts)" /tmp/tsc.log || true)
          if [ -n "$matches" ]; then
            echo "$matches"
            exit 1
          fi
          echo "No TypeScript errors reported in changed Instagram files."
