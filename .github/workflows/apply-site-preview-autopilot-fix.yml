name: Apply site preview and autopilot URL fix

on:
  push:
    branches:
      - fix/site-preview-and-autopilot-url

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-preview-and-autopilot-url
          fetch-depth: 0
      - name: Guard generated patch commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[preview-url-patch\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply patch
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/apply-site-preview-autopilot-fix.py
      - name: Remove one-shot files
        if: steps.guard.outputs.skip != 'true'
        run: rm .github/workflows/apply-site-preview-autopilot-fix.yml scripts/apply-site-preview-autopilot-fix.py
      - name: Commit patch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'VendorAI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/frontend/src/pages/SiteGenerator.tsx artifacts/api-server/src/routes/site_generator.ts artifacts/frontend/src/pages/ContentAutopilotLegacyUI.tsx artifacts/api-server/src/routes/content_autopilot_core.ts .github/workflows/apply-site-preview-autopilot-fix.yml scripts/apply-site-preview-autopilot-fix.py
          git commit -m 'fix: restore site previews and safe autopilot URLs [preview-url-patch]'
          git push origin HEAD:fix/site-preview-and-autopilot-url
