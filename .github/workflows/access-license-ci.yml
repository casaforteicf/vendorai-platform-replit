name: VendorAI Access License CI

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/accessLicense*.ts"
      - "artifacts/api-server/src/middlewares/accessLicense.ts"
      - "artifacts/api-server/src/routes/access_license.ts"
      - "artifacts/frontend/src/components/billing/**"
      - "lib/db/src/schema/access_licenses.ts"
      - "lib/db/migrations/148_access_license_time_passes.sql"
      - ".github/workflows/access-license-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  access-license:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test access license rules
        run: pnpm --filter @workspace/api-server exec vitest run src/services/accessLicenseCore.test.ts
      - name: Verify migration is discoverable
        run: test -f lib/db/migrations/148_access_license_time_passes.sql
