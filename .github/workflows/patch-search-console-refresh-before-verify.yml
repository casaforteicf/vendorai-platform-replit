name: Patch Search Console refresh before verify

on:
  push:
    branches:
      - fix/search-console-refresh-before-verify

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 scripts/patch_search_console_refresh.py
      - name: Commit patch
        run: |
          rm -f scripts/patch_search_console_refresh.py
          rm -f .github/workflows/patch-search-console-refresh-before-verify.yml
          git config user.name "VendorAI Automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add artifacts/api-server/src/services/search-console-oauth.ts scripts/patch_search_console_refresh.py .github/workflows/patch-search-console-refresh-before-verify.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(search-console): renovar token antes de verificar propriedade"
          git push
