name: One-off audit remediation

on:
  push:
    branches:
      - fix/audit-remediation-final

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/audit-remediation-final
          fetch-depth: 0

      - name: Apply audited hardening fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Vehicle lookup: never silently use mocks in production.
          p = Path('artifacts/api-server/src/services/vehicle-lookup.ts')
          s = p.read_text()
          old = '''function providerFromEnv(): VehicleLookupProvider {
            return (process.env.VEHICLE_LOOKUP_PROVIDER ?? "mock").toLowerCase() === "senatran"
              ? new SenatranVehicleProvider() : new MockVehicleProvider();
          }'''
          new = '''class UnconfiguredVehicleProvider implements VehicleLookupProvider {
            readonly name = "unconfigured";
            private fail(): never {
              throw Object.assign(new Error("VEHICLE_LOOKUP_PROVIDER_NOT_CONFIGURED"), { code: "PROVIDER_NOT_CONFIGURED" });
            }
            async lookupByPlate(_plate: string): Promise<ProviderResult | null> { return this.fail(); }
            async lookupByChassis(_chassis: string): Promise<ProviderResult | null> { return this.fail(); }
          }

          function providerFromEnv(): VehicleLookupProvider {
            const provider = (process.env.VEHICLE_LOOKUP_PROVIDER ?? "").trim().toLowerCase();
            const isProduction = process.env.NODE_ENV === "production";
            const allowMock = process.env.VEHICLE_LOOKUP_ALLOW_MOCK === "true";

            if (provider === "senatran") return new SenatranVehicleProvider();
            if ((provider === "mock" || (!provider && !isProduction)) && (!isProduction || allowMock)) {
              return new MockVehicleProvider();
            }
            return new UnconfiguredVehicleProvider();
          }'''
          if old not in s:
            raise SystemExit('vehicle provider block not found')
          p.write_text(s.replace(old, new, 1))

          # 2) Agent engine: all exported callOpenAI traffic must go through AI Gateway.
          p = Path('artifacts/api-server/src/lib/agent-engine.ts')
          s = p.read_text()
          old = '''  if (tenantId && agentName) {
            const feature = AGENT_FEATURE_MAP[agentName];
            const { content, inputTokens, outputTokens } = await gatewayCallOpenAI(
              tenantId,
              feature,
              messages,
              { model: "gpt-4o-mini", temperature: 0.7, maxTokens: 600, log }
            );
            return { resposta: content, tokensUsed: inputTokens + outputTokens };
          }

          // Fallback: direct call (for non-tenant contexts or until full migration)
          const openai = tenantId ? await getOpenAIForTenant(tenantId) : getOpenAI();
          const completion = await openai.chat.completions.create({
            model:       "gpt-4o-mini",
            messages,
            temperature: 0.7,
            max_tokens:  600,
          });
          return {
            resposta:   completion.choices[0]?.message?.content?.trim() ?? "",
            tokensUsed: completion.usage?.total_tokens ?? 0,
          };'''
          new = '''  if (!tenantId || !agentName) {
            throw Object.assign(
              new Error("AI_GATEWAY_CONTEXT_REQUIRED: callOpenAI requires tenantId and agentName"),
              { code: "AI_GATEWAY_CONTEXT_REQUIRED" },
            );
          }

          const feature = AGENT_FEATURE_MAP[agentName];
          const { content, inputTokens, outputTokens } = await gatewayCallOpenAI(
            tenantId,
            feature,
            messages,
            { model: "gpt-4o-mini", temperature: 0.7, maxTokens: 600, log }
          );
          return { resposta: content, tokensUsed: inputTokens + outputTokens };'''
          if old not in s:
            raise SystemExit('agent engine fallback block not found')
          p.write_text(s.replace(old, new, 1))

          # 3) Arch: remove only the second duplicated CRUD implementation.
          p = Path('artifacts/api-server/src/routes/arch.ts')
          s = p.read_text()
          pattern = re.compile(
            r'\n// ─+\n// GET /arch/prompt-variations — list all for tenant\n// ─+\n'
            r'router\.get\("/arch/prompt-variations".*?'
            r'(?=\n// ─+\n// GET /arqdor/projects/:id — load a full ProjectContext blob for this tenant)',
            re.S,
          )
          s2, count = pattern.subn('\n', s, count=1)
          if count != 1:
            raise SystemExit(f'expected one duplicate prompt-variations block, removed {count}')
          p.write_text(s2)

          # Remove this one-off workflow from the branch before committing.
          Path('.github/workflows/audit-remediation-oneoff.yml').unlink()

      - name: Commit patched files
        run: |
          git config user.name "VendorAI Audit Bot"
          git config user.email "vendorai@appvendorai.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: harden audited production fallbacks"
          git push origin HEAD:fix/audit-remediation-final
