name: Apply site generator context resilience

on:
  push:
    branches:
      - fix/site-generator-context-resilience

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-generator-context-resilience
          fetch-depth: 0
      - name: Skip generated patch commit
        id: guard
        run: |
          if git log -1 --pretty=%B | grep -q '\[site-context-patch\]'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          else
            echo 'skip=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Apply corrected patch
        if: steps.guard.outputs.skip != 'true'
        run: python scripts/apply-site-generator-context-resilience-v2.py
      - name: Remove one-shot files
        if: steps.guard.outputs.skip != 'true'
        run: rm -f .github/workflows/apply-site-generator-context-resilience.yml scripts/apply-site-generator-context-resilience.py scripts/apply-site-generator-context-resilience-v2.py
      - name: Commit patch
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'VendorAI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make site context resilient [site-context-patch]'
          git push origin HEAD:fix/site-generator-context-resilience
