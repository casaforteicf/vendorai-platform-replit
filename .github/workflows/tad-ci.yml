name: TAD CI

on:
  pull_request:
    paths:
      - 'tad/**'
      - '.github/workflows/tad-ci.yml'
  push:
    branches:
      - 'feat/tad-v023-live-readiness'
    paths:
      - 'tad/**'
      - '.github/workflows/tad-ci.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tad
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable Corepack
        run: corepack enable
      - name: Install workspace dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Build
        run: pnpm build
