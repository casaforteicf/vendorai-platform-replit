name: Patch Search Console verify in integrations

on:
  push:
    branches:
      - fix/search-console-verify-in-integrations

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put Search Console verification inside integrations
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f"marker not found: {label}")
              return text.replace(old, new, 1)

          hub = Path("artifacts/frontend/src/pages/IntegrationSettingsHub.tsx")
          text = hub.read_text()
          text = replace_once(
              text,
              '  const { user } = useAuth();\n  const { toast } = useToast();',
              '  const { user } = useAuth();\n  const tenantId = user?.tenantId ?? "";\n  const { toast } = useToast();',
              "hub tenant id",
          )
          text = replace_once(
              text,
              '      detail: status?.searchConsole?.connected && !status?.searchConsole?.verified ? "Verificação pendente" : undefined,',
              '      detail: status?.searchConsole?.connected && !status?.searchConsole?.verified ? "Conta autorizada · falta confirmar a propriedade" : undefined,',
              "hub search console detail",
          )
          marker = '  const validateCredential = async (provider: "asaas" | "zapsign") => {'
          verify_fn = '''  const verifySearchConsole = async () => {
    if (!tenantId) {
      toast({ title: "Não foi possível identificar o tenant para verificar o Search Console.", variant: "destructive" });
      return;
    }
    setBusy("search-console");
    try {
      const data = await apiJson(`/api/tenants/${encodeURIComponent(tenantId)}/search-console-connection/verify`, {
        method: "POST",
      });
      if (data?.verified === true) {
        toast({ title: "Search Console verificado e sitemap enviado com sucesso." });
      } else {
        toast({
          title: "O Google ainda está processando a verificação.",
          description: "Aguarde de 2 a 5 minutos e clique novamente em “Verificar agora”. Não é necessário reconectar a conta.",
        });
      }
      await loadStatus();
    } catch (error) {
      toast({
        title: "Não foi possível verificar o Search Console agora",
        description: error instanceof Error ? error.message : "Tente novamente em alguns instantes.",
        variant: "destructive",
      });
    } finally {
      setBusy(null);
    }
  };

'''
          text = replace_once(text, marker, verify_fn + marker, "hub verify function")
          marker = '  const connectedCount = rows.filter((row) => row.connected).length;'
          helpers = '''  const handleRowAction = async (row: IntegrationRow) => {
    if (row.key === "search-console" && row.attention) {
      await verifySearchConsole();
      return;
    }
    await startConnection(row.key);
  };

  const rowActionLabel = (row: IntegrationRow) => {
    if (busy === row.key) return row.key === "search-console" && row.attention ? "Verificando..." : "Abrindo...";
    if (row.key === "search-console" && row.attention) return "Verificar agora";
    if (row.key === "domain") return "Configurar domínio";
    if (row.connected) return "Reconectar / gerenciar";
    if (row.attention) return "Revisar integração";
    return "Conectar agora";
  };

'''
          text = replace_once(text, marker, helpers + marker, "hub row helpers")
          text = replace_once(
              text,
              '                  onClick={() => void startConnection(row.key)}',
              '                  onClick={() => void handleRowAction(row)}',
              "hub action handler",
          )
          text = replace_once(
              text,
              '                  {busy === row.key ? "Abrindo..." : row.key === "domain" ? "Configurar domínio" : row.connected ? "Reconectar / gerenciar" : row.attention ? "Revisar integração" : "Conectar agora"}',
              '                  {rowActionLabel(row)}',
              "hub action label",
          )
          hub.write_text(text)

          normalized = Path("artifacts/frontend/src/pages/ConfiguracoesNormalized.tsx")
          text = normalized.read_text()
          text = replace_once(
              text,
              '            detail: data.searchConsole?.connected && !data.searchConsole?.verified ? "Aguardando verificação" : "SEO e indexação",',
              '            detail: data.searchConsole?.connected && !data.searchConsole?.verified ? "Autorizado · verificação pendente" : "SEO e indexação",',
              "health detail",
          )
          text = replace_once(
              text,
              '          card.setAttribute("aria-label", `${item.connected ? "Gerenciar" : item.attention ? "Revisar" : "Conectar"} ${item.label}`);',
              '          card.setAttribute("aria-label", item.key === "search-console" && item.attention ? "Verificar agora Search Console" : `${item.connected ? "Gerenciar" : item.attention ? "Revisar" : "Conectar"} ${item.label}`);',
              "health aria label",
          )
          text = replace_once(
              text,
              '          action.textContent = item.connected ? "Gerenciar integração →" : item.attention ? "Revisar integração →" : "Conectar agora →";',
              '          action.textContent = item.key === "search-console" && item.attention ? "Verificar agora →" : item.connected ? "Gerenciar integração →" : item.attention ? "Revisar integração →" : "Conectar agora →";',
              "health action label",
          )
          text = replace_once(
              text,
              '          card.addEventListener("click", () => focusIntegration(item.key));',
              '''          card.addEventListener("click", async () => {
            if (item.key !== "search-console" || !item.attention) {
              focusIntegration(item.key);
              return;
            }

            const token = localStorage.getItem("vendorai_token");
            if (!token) {
              focusIntegration(item.key);
              return;
            }

            card.disabled = true;
            action.textContent = "Verificando...";
            detail.textContent = "Confirmando a propriedade com o Google...";

            try {
              const meResponse = await fetch("/api/auth/me", {
                credentials: "include",
                headers: { Authorization: `Bearer ${token}` },
              });
              if (!meResponse.ok) throw new Error(`HTTP ${meResponse.status}`);
              const me = await meResponse.json() as { tenantId?: string };
              if (!me.tenantId) throw new Error("Tenant não identificado");

              const verifyResponse = await fetch(`/api/tenants/${encodeURIComponent(me.tenantId)}/search-console-connection/verify`, {
                method: "POST",
                credentials: "include",
                headers: { Authorization: `Bearer ${token}` },
              });
              const verifyData = await verifyResponse.json().catch(() => ({})) as { verified?: boolean; error?: string };
              if (!verifyResponse.ok) throw new Error(verifyData.error || `HTTP ${verifyResponse.status}`);

              if (verifyData.verified === true) {
                detail.textContent = "Verificado. Sitemap enviado automaticamente.";
                action.textContent = "Concluído ✓";
                await loadIntegrationHealth(panel);
              } else {
                detail.textContent = "Google ainda processando. Aguarde 2–5 minutos e tente novamente.";
                action.textContent = "Verificar agora →";
              }
            } catch {
              detail.textContent = "Não foi possível verificar agora. Tente novamente em instantes.";
              action.textContent = "Verificar agora →";
            } finally {
              card.disabled = false;
            }
          });''',
              "health direct verify",
          )
          normalized.write_text(text)
          PY
      - name: Commit patch
        run: |
          rm -f .github/workflows/patch-search-console-verify-in-integrations.yml
          git config user.name "VendorAI Automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add artifacts/frontend/src/pages/IntegrationSettingsHub.tsx artifacts/frontend/src/pages/ConfiguracoesNormalized.tsx .github/workflows/patch-search-console-verify-in-integrations.yml
          git diff --cached --quiet && exit 0
          git commit -m "fix(search-console): verificar direto nas integrações"
          git push
