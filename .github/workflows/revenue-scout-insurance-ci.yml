name: Revenue Scout Insurance CI

on:
  pull_request:
    paths:
      - "artifacts/api-server/src/services/corporateInsuranceRevenuePack.ts"
      - "artifacts/api-server/src/services/insuranceRenewalEngine.ts"
      - "artifacts/api-server/src/services/insuranceWhitespaceEngine.ts"
      - "artifacts/api-server/src/services/distributorRevenueEngine.ts"
      - "artifacts/api-server/src/__tests__/**"
      - "artifacts/api-server/src/routes/scout.ts"
      - "artifacts/frontend/src/pages/scout/InsuranceRenewals.tsx"
      - "lib/db/src/schema/**"
      - "lib/db/migrations/034_insurance_revenue_scout.sql"
      - "lib/db/migrations/035_insurance_renewal_opportunities.sql"
      - ".github/workflows/revenue-scout-insurance-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck libraries
        run: pnpm run typecheck:libs
      - name: Typecheck changed API and frontend files
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set +e
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee /tmp/api-typecheck.log
          pnpm --filter @workspace/frontend typecheck 2>&1 | tee /tmp/frontend-typecheck.log
          set -e
          if grep -E 'src/(services/(corporateInsuranceRevenuePack|insuranceRenewalEngine|insuranceWhitespaceEngine|distributorRevenueEngine)|routes/scout)\.ts.*error TS' /tmp/api-typecheck.log; then
            exit 1
          fi
          if grep -E 'src/(pages/scout/InsuranceRenewals|App|components/layout/SidebarLayout)\.tsx.*error TS' /tmp/frontend-typecheck.log; then
            exit 1
          fi
      - name: Run Revenue Scout insurance tests
        run: pnpm --filter @workspace/api-server test -- corporateInsuranceRevenuePack.test.ts insuranceWhitespaceEngine.test.ts distributorRevenueEngine.test.ts
      - name: Verify migrations are discoverable
        run: test -f lib/db/migrations/034_insurance_revenue_scout.sql && test -f lib/db/migrations/035_insurance_renewal_opportunities.sql
