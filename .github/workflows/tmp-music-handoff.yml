name: Temporary Music Handoff Patch

on:
  push:
    branches:
      - feat/media-center-music-hub

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-center-music-hub
          fetch-depth: 0
      - name: Patch files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f"anchor not found in {path}")
              path.write_text(text.replace(old, new, 1))

          backend = Path('artifacts/api-server/src/routes/media_library.ts')
          replace(backend,
              '  const changes: { metadata?: Record<string, unknown>; projectId?: string | null } = {};',
              '  const changes: { metadata?: Record<string, unknown>; projectId?: string | null; role?: string } = {};')
          replace(backend,
              '  if (body["projectId"] !== undefined) {',
              '  if (body["role"] !== undefined) {\n    const role = nonEmptyString(body["role"]);\n    if (!role || !ASSET_ROLES.has(role)) {\n      res.status(422).json({ error: "role de ativo inválido" });\n      return;\n    }\n    changes.role = role;\n  }\n\n  if (body["projectId"] !== undefined) {')

          editor = Path('artifacts/frontend/src/components/video/VideoTimelineEditor.tsx')
          replace(editor,
              '  const [musicMode, setMusicMode] = useState<MusicMode>("none");\n  const [musicFile, setMusicFile] = useState<File | null>(null);\n  const [musicAssetId, setMusicAssetId] = useState("");',
              '  const requestedMusicAssetId = useRef(new URLSearchParams(window.location.search).get("musicAssetId") ?? "");\n  const [musicMode, setMusicMode] = useState<MusicMode>(requestedMusicAssetId.current ? "library" : "none");\n  const [musicFile, setMusicFile] = useState<File | null>(null);\n  const [musicAssetId, setMusicAssetId] = useState(requestedMusicAssetId.current);')
          replace(editor,
              '  useEffect(() => {\n    void loadAssets();\n    void loadMusic();\n  }, [loadAssets, loadMusic]);\n\n  useEffect(() => {\n    if (!projectId || !tenantId) return;',
              '  useEffect(() => {\n    void loadAssets();\n    void loadMusic();\n  }, [loadAssets, loadMusic]);\n\n  useEffect(() => {\n    const requested = requestedMusicAssetId.current;\n    if (!requested || musicTracks.length === 0) return;\n    if (musicTracks.some((track) => track.id === requested)) {\n      setMusicMode("library");\n      setMusicAssetId(requested);\n      setTool("audio");\n      requestedMusicAssetId.current = "";\n    }\n  }, [musicTracks]);\n\n  useEffect(() => {\n    if (!projectId || !tenantId) return;')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/media_library.ts artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          git commit -m "fix(media): hand off music assets to video editor"
          git push origin HEAD:feat/media-center-music-hub
