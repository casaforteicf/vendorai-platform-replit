name: Apply original spec phase 2

on:
  push:
    branches:
      - fix-especificacao-fase2

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[phase2-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply phase 2 corrections
        run: python3 scripts/apply-original-spec-phase2.py

      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . ':!.github/workflows/apply-original-spec-phase2.yml' ':!scripts/apply-original-spec-phase2.py'
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "fix: integrar onboarding, anúncios e conversas [phase2-applied]"
          git push origin HEAD:fix-especificacao-fase2
