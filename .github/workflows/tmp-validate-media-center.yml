name: Temporary Media Center Validation

on:
  push:
    branches:
      - fix/media-center-folder-actions

permissions:
  contents: read

jobs:
  validate-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm --filter @workspace/frontend run typecheck

      - name: Build frontend
        run: pnpm --filter @workspace/frontend run build
