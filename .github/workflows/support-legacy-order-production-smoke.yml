name: Support Legacy Order Production Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - "e2e/tests/support-legacy-order-production.spec.ts"
      - ".github/workflows/support-legacy-order-production-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Validate support legacy-order import in production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @workspace/e2e exec playwright install --with-deps chromium

      - name: Run production smoke
        env:
          E2E_BASE_URL: https://app.appvendorai.com
        run: pnpm --filter @workspace/e2e exec playwright test tests/support-legacy-order-production.spec.ts --project=chromium

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: support-legacy-order-production-smoke
          path: |
            e2e/test-results
            e2e/playwright-report
          if-no-files-found: ignore