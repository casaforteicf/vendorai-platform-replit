name: Apply Ads Instagram AI

on:
  push:
    branches:
      - feat-ads-patrocinio-instagram-ai

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[ads-instagram-ai-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-ads-patrocinio-instagram-ai
          fetch-depth: 0
      - run: python scripts/patch-ads-instagram-ai.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/Content.tsx artifacts/frontend/src/pages/Ads.tsx artifacts/api-server/src/routes/ads.ts artifacts/api-server/src/services/meta-ads-campaign-publish.ts lib/db/src/schema/ad_campaigns.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: patrocinar conteúdo do Instagram e gerar anúncio com IA [ads-instagram-ai-applied]"
          git push origin feat-ads-patrocinio-instagram-ai
