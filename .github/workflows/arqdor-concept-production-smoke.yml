name: Arqdor Production Handoff Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/scripts/arqdor-concept-production-smoke.sh"
      - ".github/workflows/arqdor-concept-production-smoke.yml"

permissions:
  contents: read

concurrency:
  group: arqdor-production-handoff-smoke
  cancel-in-progress: false

jobs:
  handoff-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      BASE_URL: https://app.appvendorai.com
      APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
      SUPABASE_DATABASE_URL: ${{ secrets.SUPABASE_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y postgresql-client
          fi

      - name: Run production handoff smoke
        shell: bash
        run: |
          chmod +x .github/scripts/arqdor-concept-production-smoke.sh
          .github/scripts/arqdor-concept-production-smoke.sh
