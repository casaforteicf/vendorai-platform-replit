name: Bootstrap Visitor Native Push

on:
  push:
    branches: [feat/visitor-native-push]
    paths:
      - .github/workflows/native-push-bootstrap.yml

permissions:
  contents: write

jobs:
  patch-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/visitor-native-push
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Connect public visitor presence to native push
        shell: python
        run: |
          from pathlib import Path
          p = Path('artifacts/api-server/src/routes/site.ts')
          s = p.read_text()
          import_line = 'import { syncBehaviorIntentForLead } from "../jobs/behaviorIntentSync.js";\n'
          push_import = 'import { notifyVisitorOnline } from "../services/visitorPushNotifications.js";\n'
          if push_import not in s:
              if import_line not in s:
                  raise SystemExit('behaviorIntentSync import anchor not found')
              s = s.replace(import_line, import_line + push_import, 1)
          anchor = '    if (identifiedSession?.leadId) {\n'
          push_call = '''    void notifyVisitorOnline({\n      tenantId: INSTITUTIONAL_TENANT_ID,\n      sessionId: d.anonymousSessionId,\n    }).catch((err) => {\n      logger.warn({ err, sessionId: d.anonymousSessionId }, "site/behavior-event: native visitor push failed");\n    });\n\n'''
          if push_call not in s:
              if anchor not in s:
                  raise SystemExit('identified session anchor not found')
              s = s.replace(anchor, push_call + anchor, 1)
          p.write_text(s)

      - name: Refresh workspace lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Validate API and mobile types
        run: |
          pnpm install --no-frozen-lockfile
          pnpm --filter @workspace/api-server exec tsc -p tsconfig.launch-ci.json --noEmit
          pnpm --filter @workspace/mobile typecheck

      - name: Commit generated patch and lockfile
        shell: bash
        run: |
          rm .github/workflows/native-push-bootstrap.yml
          git config user.name "VendorAI Native Push Bot"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/api-server/src/routes/site.ts pnpm-lock.yaml .github/workflows/native-push-bootstrap.yml
          git commit -m "feat: connect site presence to native visitor push"
          git push origin HEAD:feat/visitor-native-push
