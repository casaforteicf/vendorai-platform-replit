# Validation workflow for AI assistant + Beat Sync
name: Apply video AI assistant with Beat Sync

on:
  push:
    branches:
      - feat/video-ai-edit-assistant
    paths:
      - .github/workflows/apply-video-ai-assistant-beatsync.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-ai-edit-assistant
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Adapt patch to current editor version and Beat Sync
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/patches/apply_video_ai_edit_assistant.py')
          s = p.read_text()

          s = s.replace(
              "    ''')}), [channel, ratio, quality, clips, layers, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd]);''',",
              "    '''  }), [channel, ratio, quality, clips, layers, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd]);''',",
          )
          s = s.replace(
              "    ''')}), [channel, ratio, quality, clips, layers, aiPlan, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd]);''',",
              "    '''  }), [channel, ratio, quality, clips, layers, aiPlan, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd]);''',",
          )

          s = s.replace(
              "    '''  const serializedContext = useMemo(() => ({\\n    editorVersion: 9,\\n    channel,''',\n    '''  const serializedContext = useMemo(() => ({\\n    editorVersion: 10,\\n    channel,''',",
              "    '''  const serializedContext = useMemo(() => ({\\n    editorVersion: 10,\\n    channel,''',\n    '''  const serializedContext = useMemo(() => ({\\n    editorVersion: 11,\\n    channel,''',",
          )

          old_deps = "    '''  }), [channel, ratio, quality, clips, layers, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd]);''',"
          new_deps = "    '''  }), [channel, ratio, quality, clips, layers, aiPlan, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd]);''',"
          beat_old = "    '''  }), [channel, ratio, quality, clips, layers, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd, activeBeatAnalysis, beatStep, showBeatMarkers]);''',"
          beat_new = "    '''  }), [channel, ratio, quality, clips, layers, aiPlan, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd, activeBeatAnalysis, beatStep, showBeatMarkers]);''',"
          if old_deps not in s or new_deps not in s:
              raise SystemExit('serialized dependency anchors not found in AI patch')
          s = s.replace(old_deps, beat_old, 1).replace(new_deps, beat_new, 1)
          p.write_text(s)
          PY
      - name: Apply AI editor patch on current Beat Sync editor
        run: python .github/patches/apply_video_ai_edit_assistant.py
      - name: Verify combined capabilities
        run: |
          grep -q 'type MusicRecommendationProfile' artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          grep -q 'type BeatAnalysis' artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          grep -q 'type AiEditPlan' artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          grep -q 'editorVersion: 11' artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          grep -q 'Assistente IA' artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          grep -q 'Beat Sync' artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate API production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @workspace/api-server build
      - name: Validate frontend production build
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @workspace/frontend build
      - name: Remove temporary automation files
        run: rm -f .github/patches/apply_video_ai_edit_assistant.py .github/workflows/apply-video-ai-assistant-beatsync.yml
      - name: Commit validated combined result
        run: |
          git config user.name "vendorai-automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add -A
          git commit -m "feat(video): add AI edit assistant" || exit 0
          git push origin HEAD:feat/video-ai-edit-assistant
