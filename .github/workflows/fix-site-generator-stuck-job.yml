name: Apply site generator stuck-job fix

on:
  push:
    branches:
      - fix/site-generator-stuck-job

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-generator-stuck-job
          fetch-depth: 0

      - name: Patch real SiteGenerator
        shell: python
        run: |
          from pathlib import Path
          path = Path("artifacts/frontend/src/pages/SiteGenerator.tsx")
          text = path.read_text(encoding="utf-8")

          replacements = [
              ("void pollJob(jobId, 20 * 60 * 1000)", "void pollJob(jobId, 30 * 1000)"),
              ("async function pollJob(jobId: string, timeoutMs = 12 * 60 * 1000)", "async function pollJob(jobId: string, timeoutMs = 2 * 60 * 1000)"),
              ('} catch (e) { const m = e instanceof Error ? e.message : "Não foi possível gerar"; setError(m); toast({ title: m.includes("continua em processamento") ? "Geração continua no servidor" : "Erro na geração", description: m, variant: m.includes("continua em processamento") ? "default" : "destructive" }); } finally { setGenerating(false); }', '} catch (e) { const m = e instanceof Error ? e.message : "Não foi possível gerar"; if (m.includes("continua em processamento")) setError(null); else setError(m); toast({ title: m.includes("continua em processamento") ? "Geração continua no servidor" : "Erro na geração", description: m.includes("continua em processamento") ? "O processamento continua no servidor, mas o botão foi liberado. O resultado não será perdido." : m, variant: m.includes("continua em processamento") ? "default" : "destructive" }); } finally { setGenerating(false); }'),
          ]

          for old, new in replacements:
              assert old in text, f"anchor not found: {old[:80]}"
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate patch
        run: |
          git diff --check
          grep -q "pollJob(jobId, 30 \* 1000)" artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -q "timeoutMs = 2 \* 60 \* 1000" artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -q "o botão foi liberado" artifacts/frontend/src/pages/SiteGenerator.tsx

      - name: Commit focused fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/SiteGenerator.tsx
          git rm .github/workflows/fix-site-generator-stuck-job.yml
          git commit -m "fix(site-generator): destravar acompanhamento de geração"
          git push origin HEAD:fix/site-generator-stuck-job
