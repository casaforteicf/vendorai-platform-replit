name: Apply site generator stuck-job fix

on:
  push:
    branches:
      - fix/site-generator-stuck-job

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-generator-stuck-job
          fetch-depth: 0

      - name: Patch real SiteGenerator
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("artifacts/frontend/src/pages/SiteGenerator.tsx")
          text = path.read_text(encoding="utf-8")

          anchor = 'function pendingJobKey(tenantId: string) { return `vendorai_site_generation_job:${tenantId}`; }'
          replacement = '''function pendingJobKey(tenantId: string) { return `vendorai_site_generation_job:${tenantId}`; }
          function clearPendingJob(tenantId: string) { sessionStorage.removeItem(pendingJobKey(tenantId)); }
          function generationStillRunning(message: string) { return message.includes("continua em processamento"); }
          const FOREGROUND_GENERATION_WAIT_MS = 2 * 60 * 1000;
          const RECOVERY_GENERATION_WAIT_MS = 30 * 1000;'''.replace("          ", "")
          assert anchor in text, "pending job helper anchor missing"
          text = text.replace(anchor, replacement, 1)

          recovery_pattern = re.compile(r'''\n  useEffect\(\(\) => \{\n    if \(!tenantId\) return;\n    const jobId = sessionStorage\.getItem\(pendingJobKey\(tenantId\)\);\n    if \(!jobId\) return;[\s\S]*?\n  \}, \[tenantId, token\]\);''')
          recovery_replacement = '''
          useEffect(() => {
            if (!tenantId) return;
            const jobId = sessionStorage.getItem(pendingJobKey(tenantId));
            if (!jobId) return;
            let cancelled = false;
            setGenerating(true);
            setError(null);
            void pollJob(jobId, RECOVERY_GENERATION_WAIT_MS)
              .then(() => {
                if (cancelled) return;
                clearPendingJob(tenantId);
                setEditor(true);
                toast({ title: "Site recuperado", description: "A geração terminou no servidor. Abrindo o preview." });
              })
              .catch((e) => {
                if (cancelled) return;
                const message = e instanceof Error ? e.message : "Não foi possível recuperar a geração";
                if (generationStillRunning(message)) {
                  setError(null);
                  toast({ title: "Geração continua no servidor", description: "O acompanhamento foi liberado. Você pode verificar o site novamente depois." });
                  return;
                }
                clearPendingJob(tenantId);
                setError(message);
              })
              .finally(() => { if (!cancelled) setGenerating(false); });
            return () => { cancelled = true; };
          }, [tenantId, token]);'''.replace("          ", "")
          text, count = recovery_pattern.subn(recovery_replacement, text, count=1)
          assert count == 1, f"recovery effect replacements={count}"

          poll_pattern = re.compile(r'''  async function pollJob\(jobId: string, timeoutMs = 12 \* 60 \* 1000\) \{[\s\S]*?\n  \}\n\n  async function runJob''')
          poll_replacement = '''  async function pollJob(jobId: string, timeoutMs = FOREGROUND_GENERATION_WAIT_MS) {
            const end = Date.now() + timeoutMs;
            let consecutiveFailures = 0;
            const check = async () => {
              const p = await fetch(`/api/tenants/${tenantId}/site-generator/jobs/${jobId}?t=${Date.now()}`, { headers: headers(token), cache: "no-store" });
              if (!p.ok) {
                if (p.status === 404) {
                  throw new Error("A geração anterior não está mais disponível no servidor. O formulário foi liberado para uma nova tentativa.");
                }
                if ([429, 502, 503, 504].includes(p.status) && consecutiveFailures < 5) {
                  consecutiveFailures++;
                  return null;
                }
                const b = await p.json().catch(() => ({}));
                throw new Error(b.error ?? "Falha ao acompanhar geração");
              }
              consecutiveFailures = 0;
              return p.json();
            };
            while (Date.now() < end) {
              const b = await check();
              if (b?.status === "done") return b.result;
              if (b?.status === "error") throw new Error(b.error ?? "Erro na geração");
              await new Promise((r) => window.setTimeout(r, 3000));
            }
            const final = await check();
            if (final?.status === "done") return final.result;
            if (final?.status === "error") throw new Error(final.error ?? "Erro na geração");
            throw new Error("A geração continua em processamento no servidor. O acompanhamento foi liberado e o resultado não será perdido.");
          }

          async function runJob'''.replace("          ", "")
          text, count = poll_pattern.subn(poll_replacement, text, count=1)
          assert count == 1, f"pollJob replacements={count}"

          run_pattern = re.compile(r'''  async function runJob\(config: Record<string, unknown>\) \{[\s\S]*?\n  \}\n\n  async function generate''')
          run_replacement = '''  async function runJob(config: Record<string, unknown>) {
            const start = await fetch(`/api/tenants/${tenantId}/site-generator/generate`, { method: "POST", headers: headers(token), cache: "no-store", body: JSON.stringify(config) });
            const sb = await start.json().catch(() => ({}));
            if (!start.ok || !sb.jobId) throw new Error(sb.error ?? "Não foi possível iniciar a geração");
            sessionStorage.setItem(pendingJobKey(tenantId), sb.jobId);
            try {
              const result = await pollJob(sb.jobId, FOREGROUND_GENERATION_WAIT_MS);
              clearPendingJob(tenantId);
              return result;
            } catch (e) {
              const message = e instanceof Error ? e.message : "Erro na geração";
              if (!generationStillRunning(message)) clearPendingJob(tenantId);
              throw e;
            }
          }

          async function generate'''.replace("          ", "")
          text, count = run_pattern.subn(run_replacement, text, count=1)
          assert count == 1, f"runJob replacements={count}"

          old_catch = '    } catch (e) { const m = e instanceof Error ? e.message : "Não foi possível gerar"; setError(m); toast({ title: m.includes("continua em processamento") ? "Geração continua no servidor" : "Erro na geração", description: m, variant: m.includes("continua em processamento") ? "default" : "destructive" }); } finally { setGenerating(false); }'
          new_catch = '    } catch (e) { const m = e instanceof Error ? e.message : "Não foi possível gerar"; if (generationStillRunning(m)) { setError(null); toast({ title: "Geração continua no servidor", description: "O acompanhamento foi liberado. O processamento continua sem deixar o botão travado." }); } else { setError(m); toast({ title: "Erro na geração", description: m, variant: "destructive" }); } } finally { setGenerating(false); }'
          assert old_catch in text, "generate catch anchor missing"
          text = text.replace(old_catch, new_catch, 1)

          path.write_text(text, encoding="utf-8")

      - name: Validate patch
        run: |
          git diff --check
          grep -q "FOREGROUND_GENERATION_WAIT_MS" artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -q "RECOVERY_GENERATION_WAIT_MS" artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -q "A geração anterior não está mais disponível" artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -q "O acompanhamento foi liberado" artifacts/frontend/src/pages/SiteGenerator.tsx

      - name: Commit focused fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/SiteGenerator.tsx
          git rm .github/workflows/fix-site-generator-stuck-job.yml
          git commit -m "fix(site-generator): destravar acompanhamento de geração"
          git push origin HEAD:fix/site-generator-stuck-job
