name: Sync Main Official Metrics
on:
  push:
    branches: [feat/official-metrics-command-center]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/official-metrics-command-center
          fetch-depth: 0
      - name: Merge latest main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
          rm .github/workflows/sync-main-official-metrics.yml
          git add -A
          git commit -m "chore: remover workflow temporário de sincronização" || true
          git push origin HEAD:feat/official-metrics-command-center
