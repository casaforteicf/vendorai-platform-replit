name: Apply preview direct API hotfix
on:
  push:
    paths:
      - '.github/workflows/apply-preview-direct-api-hotfix.yml'
      - '.github/patches/preview-direct-api-hotfix.patch'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create hotfix branch
        run: |
          git checkout -B fix/site-preview-direct-api
      - name: Apply patch
        run: git apply --whitespace=fix .github/patches/preview-direct-api-hotfix.patch
      - name: Remove one-shot files
        run: |
          rm -f .github/workflows/apply-preview-direct-api-hotfix.yml .github/patches/preview-direct-api-hotfix.patch
      - name: Commit and push
        run: |
          git config user.name 'VendorAI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: bypass API rate limit for saved site preview'
          git push -f origin fix/site-preview-direct-api
