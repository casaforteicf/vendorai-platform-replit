name: VendorAI LipSync Worker CI

on:
  pull_request:
    paths:
      - "artifacts/media-lipsync-worker/**"
      - ".github/workflows/media-lipsync-worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/media-lipsync-worker/**"
      - ".github/workflows/media-lipsync-worker-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python syntax
        run: python -m py_compile artifacts/media-lipsync-worker/app/main.py
      - name: Shell syntax
        run: bash -n artifacts/media-lipsync-worker/entrypoint.sh
      - name: Validate worker contract
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("artifacts/media-lipsync-worker/app/main.py").read_text()
          required = [
              '@app.get("/health")',
              '@app.post("/v1/lipsync/generate")',
              'x_vendorai_worker_secret',
              'source_face',
              'audio',
              'video/mp4',
              'scripts.inference',
              'musetalkV15',
              'extra_margin',
              'nvidia-smi',
          ]
          missing = [value for value in required if value not in src]
          if missing:
              raise SystemExit(f"lip-sync worker contract missing: {missing}")
          PY
      - name: Validate container files
        run: |
          test -s artifacts/media-lipsync-worker/Dockerfile
          test -s artifacts/media-lipsync-worker/requirements.txt
          test -s artifacts/media-lipsync-worker/entrypoint.sh
          grep -q "nvidia/cuda:11.8" artifacts/media-lipsync-worker/Dockerfile
          grep -q "TMElyralab/MuseTalk" artifacts/media-lipsync-worker/Dockerfile
          grep -q "0a89dec45a0192b824e3cf4daf96c239440c5ed8" artifacts/media-lipsync-worker/Dockerfile
          grep -q "torch==2.0.1" artifacts/media-lipsync-worker/Dockerfile
          grep -q "VENDORAI_LIPSYNC_AUTO_DOWNLOAD_WEIGHTS" artifacts/media-lipsync-worker/entrypoint.sh
          grep -q "python-multipart" artifacts/media-lipsync-worker/requirements.txt
