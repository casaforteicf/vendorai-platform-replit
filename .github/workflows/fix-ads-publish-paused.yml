name: Fix ads publish paused

on:
  push:
    branches:
      - fix/ads-publish-paused

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ads-publish-paused
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/fix_ads_publish_paused.py
      - name: Validate and commit
        run: |
          git rm .github/workflows/fix-ads-publish-paused.yml .github/scripts/fix_ads_publish_paused.py
          git add artifacts/api-server/src/routes/ads.ts artifacts/frontend/src/pages/Ads.tsx
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ads): publicar campanhas sempre pausadas"
          git push origin HEAD:fix/ads-publish-paused
