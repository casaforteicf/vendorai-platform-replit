name: Fix ads publish paused

on:
  push:
    branches:
      - fix/ads-publish-paused

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/ads-publish-paused
          fetch-depth: 0
      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          api = "artifacts/api-server/src/routes/ads.ts"
          replace_once(api, '''    const activateNow = req.body?.activate !== false;
    if (activateNow) {
      await db.update(adCreativesTable)
        .set({ status: "aprovado", aprovadoPorId: (req as any).user?.sub ?? null, aprovadoEm: new Date() })
        .where(eq(adCreativesTable.campaignId, campaignId));
    }

    const result = plataforma === "google"
      ? await publishCampaignToGoogleAds(tenantId, campaignId)
      : await publishCampaignToMetaAds(tenantId, campaignId);

    if (activateNow) {
      if (plataforma === "google") await setGoogleAdsCampaignStatus(tenantId, campaignId, true);
      else await setMetaAdsCampaignStatus(tenantId, campaignId, true);
    }

    logger.info({ tenantId, campaignId, plataforma, activateNow }, "ads: campanha publicada via rota");
    await recordAdCampaignEvent({ tenantId, campaignId, userId: (req as any).user?.sub, eventType: activateNow ? "published_and_activated" : "published", severity: "success", message: activateNow ? "Campanha publicada e ativada na plataforma." : "Campanha publicada em modo pausado.", metadata: { plataforma } });
    return res.status(201).json({ ...result, activated: activateNow });''', '''    const result = plataforma === "google"
      ? await publishCampaignToGoogleAds(tenantId, campaignId)
      : await publishCampaignToMetaAds(tenantId, campaignId);

    logger.info({ tenantId, campaignId, plataforma, activateNow: false }, "ads: campanha publicada via rota");
    await recordAdCampaignEvent({ tenantId, campaignId, userId: (req as any).user?.sub, eventType: "published", severity: "success", message: "Campanha publicada em modo pausado.", metadata: { plataforma } });
    return res.status(201).json({ ...result, activated: false });''')

          ui = "artifacts/frontend/src/pages/Ads.tsx"
          replace_once(ui, '''  // Publicar cria a estrutura completa e a ativa em uma única ação confirmada.
  // A plataforma ainda faz sua análise obrigatória antes de iniciar a entrega.
  const publicarCampanha = useMutation({
    mutationFn: async (campaignId: string) => {
      const r = await fetch(`/api/tenants/${tenantId}/ads/campaigns/${campaignId}/publicar`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ activate: true }),
      });
      if (!r.ok) throw new Error((await r.json())?.error ?? "Falha ao publicar");
      return r.json();
    },
    onSuccess: () => {
      qc.invalidateQueries({ queryKey: ["ad-campaigns", tenantId] });
      toast({ title: "Campanha enviada e ativada", description: "Ela ficará em análise e começará a veicular quando a plataforma aprovar." });
    },''', '''  // Publicar cria a estrutura real na plataforma sempre em modo pausado.
  // Somente a ação separada "Ativar" pode iniciar gasto real.
  const publicarCampanha = useMutation({
    mutationFn: async (campaignId: string) => {
      const r = await fetch(`/api/tenants/${tenantId}/ads/campaigns/${campaignId}/publicar`, {
        method: "POST", headers: authHeaders(), body: JSON.stringify({ activate: false }),
      });
      if (!r.ok) throw new Error((await r.json())?.error ?? "Falha ao publicar");
      return r.json();
    },
    onSuccess: () => {
      qc.invalidateQueries({ queryKey: ["ad-campaigns", tenantId] });
      toast({ title: "Campanha publicada pausada", description: "Ela foi enviada para análise. O gasto só começa quando você clicar em Ativar." });
    },''')

          replace_once(ui,
              '["1. Configurar público e oferta", "2. Gerar o anúncio", "3. Publicar e iniciar"]',
              '["1. Configurar público e oferta", "2. Gerar e aprovar", "3. Publicar pausada e ativar"]')
          replace_once(ui,
              '<li>Ao clicar em <strong>Publicar e iniciar</strong>, a plataforma analisa o anúncio e só começa a entrega depois da aprovação automática.</li>',
              '<li><strong>Publicar</strong> envia a campanha em modo pausado para análise. Somente <strong>Ativar</strong> inicia o gasto real.</li>')
          replace_once(ui,
              'if (window.confirm(`Publicar e iniciar com até R$ ${c.orcamentoDiario} por dia e limite planejado de R$ ${Number(c.segmentacao?.campaignControl?.totalBudget ?? Number(c.orcamentoDiario) * 30).toFixed(2)}? A mídia será cobrada diretamente pela plataforma.`)) {',
              'if (window.confirm(`Publicar esta campanha em modo pausado? Nenhum gasto começa agora. Depois da publicação, use Ativar quando quiser iniciar a veiculação de até R$ ${c.orcamentoDiario} por dia.`)) {')
          replace_once(ui,
              '}} disabled={publicarCampanha.isPending}>',
              '}} disabled={publicarCampanha.isPending || creative.status !== "aprovado"}>')
          replace_once(ui,
              'Publicar e iniciar no {c.plataforma === "meta" ? "Meta Ads" : "Google Ads"}',
              'Publicar no {c.plataforma === "meta" ? "Meta Ads" : "Google Ads"}')
          PY

          git rm .github/workflows/fix-ads-publish-paused.yml
          git add artifacts/api-server/src/routes/ads.ts artifacts/frontend/src/pages/Ads.tsx
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ads): publicar campanhas sempre pausadas"
          git push origin HEAD:fix/ads-publish-paused
