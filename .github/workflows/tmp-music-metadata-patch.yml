name: tmp-music-metadata-patch
on:
  push:
    branches:
      - feat/media-music-metadata
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/media-music-metadata
          fetch-depth: 0
      - name: Patch MediaCenter
        shell: bash
        run: |
          echo '  ' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
      - name: Commit patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/frontend/src/pages/MediaCenter.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'feat(media): enrich Music Hub filters and metadata'
          git push origin HEAD:feat/media-music-metadata
