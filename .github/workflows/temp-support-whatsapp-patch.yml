name: Temp Support WhatsApp Patch

on:
  push:
    branches:
      - feat/operational-pipelines-support-deliveries
    paths:
      - scripts/patch-support-whatsapp.py
      - .github/workflows/temp-support-whatsapp-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/operational-pipelines-support-deliveries
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/patch-support-whatsapp.py
      - name: Commit patched webhook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/webhooks.ts
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat(support): receber atualizações do técnico via WhatsApp"
          git push origin HEAD:feat/operational-pipelines-support-deliveries
