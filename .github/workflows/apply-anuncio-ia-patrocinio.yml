name: Apply AI Sponsored Ads Fix

on:
  push:
    branches:
      - fix-anuncio-ia-patrocinio

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[ai-sponsored-fix-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-anuncio-ia-patrocinio
          fetch-depth: 0
      - run: python scripts/fix-anuncio-ia-patrocinio.py
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TypeScript targeted ads files
        run: |
          set +e
          NODE_OPTIONS=--max-old-space-size=8192 pnpm --filter @workspace/api-server exec tsc --noEmit --pretty false > /tmp/api-tsc.log 2>&1
          api_status=$?
          NODE_OPTIONS=--max-old-space-size=8192 pnpm --filter @workspace/frontend exec tsc --noEmit --pretty false > /tmp/front-tsc.log 2>&1
          front_status=$?
          set -e
          echo "api tsc exit: $api_status; frontend tsc exit: $front_status"
          api_matches=$(grep -E "(routes/ads\.ts|meta-ads-campaign-publish\.ts)" /tmp/api-tsc.log || true)
          front_matches=$(grep -E "pages/Ads\.tsx" /tmp/front-tsc.log || true)
          if [ -n "$api_matches$front_matches" ]; then
            echo "$api_matches"
            echo "$front_matches"
            exit 1
          fi
          echo "No TypeScript errors reported in changed ads files."
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/ads.ts artifacts/api-server/src/services/meta-ads-campaign-publish.ts artifacts/frontend/src/pages/Ads.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: completar patrocínio de conteúdo com IA [ai-sponsored-fix-applied]"
          git push origin fix-anuncio-ia-patrocinio
