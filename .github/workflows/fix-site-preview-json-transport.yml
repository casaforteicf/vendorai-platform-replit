name: Fix site preview JSON transport

on:
  push:
    branches:
      - fix/site-preview-json-transport

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-preview-json-transport
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/fix_site_preview_json_transport.py

      - name: Validate diff
        run: |
          git diff --check
          grep -F 'site-generator?includeHtml=0' artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -F 'preview?format=html' artifacts/frontend/src/pages/SiteGenerator.tsx
          grep -F 'req.query.includeHtml === "0"' artifacts/api-server/src/routes/site_generator_core.ts
          grep -F 'req.query.format === "html"' artifacts/api-server/src/routes/site_generator.ts

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API and frontend
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: |
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/frontend typecheck

      - name: Commit focused fix
        run: |
          rm scripts/fix_site_preview_json_transport.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/site_generator.ts artifacts/api-server/src/routes/site_generator_core.ts artifacts/frontend/src/pages/SiteGenerator.tsx scripts/fix_site_preview_json_transport.py
          git commit -m "fix(site-generator): evitar JSON corrompido no preview"
          git push origin HEAD:fix/site-preview-json-transport
