name: Apply Google Callback Default

on:
  push:
    branches:
      - fix-google-login-production-callback

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[google-callback-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-google-login-production-callback
          fetch-depth: 0
      - run: python scripts/fix-google-callback-default.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/google-login.ts .env.example
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: usar callback canônico no Google Login [google-callback-applied]"
          git push origin fix-google-login-production-callback
