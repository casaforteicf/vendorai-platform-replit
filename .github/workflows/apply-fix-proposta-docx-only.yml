name: Apply Proposal DOCX Only Fix

on:
  push:
    branches:
      - fix-proposta-docx-only

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[docx-only-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-proposta-docx-only
          fetch-depth: 0
      - run: python scripts/fix-proposta-docx-only.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/routes/lead_proposals.ts artifacts/frontend/src/pages/Configuracoes.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: aceitar somente DOCX nos modelos de proposta [docx-only-applied]"
          git push origin fix-proposta-docx-only
