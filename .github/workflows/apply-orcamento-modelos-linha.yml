name: Apply proposal line templates

on:
  push:
    branches: [feat-orcamento-modelos-linha]
    paths:
      - 'scripts/apply-orcamento-modelos-linha.py'
      - '.github/workflows/apply-orcamento-modelos-linha.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-orcamento-modelos-linha
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-orcamento-modelos-linha.py
      - name: Commit product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/frontend/src/pages/Configuracoes.tsx artifacts/frontend/src/pages/LeadPropostaTab.tsx artifacts/api-server/src/routes/lead_proposals.ts
          if git diff --cached --quiet; then
            echo 'No product changes'
          else
            git commit -m 'feat: modelos de orçamento por linha de produto [proposal-lines-applied]'
            git push origin HEAD:feat-orcamento-modelos-linha
          fi
