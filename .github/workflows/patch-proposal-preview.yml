name: Patch proposal preview

on:
  push:
    branches:
      - fix/proposal-preview-filename

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[proposal-preview-patch]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/proposal-preview-filename
      - name: Apply targeted proposal fixes
        shell: python
        run: |
          from pathlib import Path

          path = Path('artifacts/frontend/src/pages/LeadPropostaTab.tsx')
          text = path.read_text(encoding='utf-8')

          old_preview = '''  async function previewProposal(version: number) {
    if (!leadId || !token) return;
    try {
      const res = await fetch(`/api/leads/${leadId}/proposals/${version}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) return;
      const data = await res.json();
      setPreviewHtml(data.htmlContent);
      setActiveVersion(version);
      setPreviewOpen(true);
    } catch {
      /* ignore */
    }
  }
'''

          new_preview = '''  async function previewProposal(version: number) {
    if (!leadId || !token) return;

    // Abre a aba de forma síncrona para não ser bloqueada pelo navegador.
    // O conteúdo é carregado por fetch autenticado e exibido via Blob URL,
    // isolando o HTML da proposta da aplicação principal.
    const previewWindow = window.open('', '_blank');
    if (previewWindow) {
      previewWindow.document.title = 'Carregando proposta...';
      previewWindow.document.body.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:24px;color:#475569">Carregando proposta...</div>';
    }

    try {
      const res = await fetch(`/api/leads/${leadId}/proposals/${version}`, {
        headers: { Authorization: `Bearer ${token}` },
      });
      if (!res.ok) throw new Error(`Falha ao carregar proposta (${res.status})`);
      const data = await res.json();
      if (!data?.htmlContent || typeof data.htmlContent !== 'string') {
        throw new Error('Conteúdo da proposta não disponível');
      }

      setPreviewHtml(data.htmlContent);
      setActiveVersion(version);

      if (previewWindow && !previewWindow.closed) {
        const blobUrl = window.URL.createObjectURL(
          new Blob([data.htmlContent], { type: 'text/html;charset=utf-8' }),
        );
        previewWindow.location.replace(blobUrl);
        previewWindow.focus();
        window.setTimeout(() => window.URL.revokeObjectURL(blobUrl), 60_000);
      } else {
        setPreviewOpen(true);
        toast({
          title: 'Pré-visualização aberta no sistema',
          description: 'O navegador bloqueou a nova aba. Libere pop-ups para abrir a proposta em uma aba separada.',
        });
      }
    } catch (e: any) {
      if (previewWindow && !previewWindow.closed) previewWindow.close();
      toast({
        title: 'Erro ao visualizar proposta',
        description: e?.message || 'Não foi possível carregar a proposta.',
        variant: 'destructive',
      });
    }
  }
'''

          old_download = '''  function downloadProposal(version: number, format: "html" | "pdf" = "html") {
    if (!leadId || !token) return;
    const url = `/api/leads/${leadId}/proposals/${version}/${format === "pdf" ? "pdf" : "download"}`;
    const clientName = (lead?.empresa || lead?.nome || "cliente")
      .normalize("NFD").replace(/[\\u0300-\\u036f]/g, "")
      .replace(/[^a-zA-Z0-9\\s-]/g, "").trim().replace(/\\s+/g, "_").toLowerCase();
    const filename = `proposta_${clientName}_v${version}.${format === "pdf" ? "pdf" : "html"}`;
    const a = document.createElement("a");
    a.href = url;
    a.setAttribute("download", filename);
    fetch(url, { headers: { Authorization: `Bearer ${token}` } })
      .then(async (res) => {
        if (!res.ok) throw new Error("Falha no download");
        const blob = await res.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        a.href = blobUrl;
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(blobUrl);
      })
      .catch((e: any) => {
        toast({ title: "Erro no download", description: e.message, variant: "destructive" });
      });
  }
'''

          new_download = '''  function downloadProposal(version: number, format: "html" | "pdf" = "html") {
    if (!leadId || !token) return;
    const url = `/api/leads/${leadId}/proposals/${version}/${format === "pdf" ? "pdf" : "download"}`;
    const clientName = (lead?.empresa || lead?.nome || "Cliente")
      .normalize("NFD")
      .replace(/[\\u0300-\\u036f]/g, "")
      .replace(/[^a-zA-Z0-9]+/g, "_")
      .replace(/^_+|_+$/g, "")
      .slice(0, 80) || "Cliente";
    const proposalNumber = "P001";
    const revisionNumber = `R${String(version).padStart(2, "0")}`;
    const extension = format === "pdf" ? "pdf" : "html";
    const filename = `Proposta_${clientName}_${proposalNumber}_${revisionNumber}.${extension}`;
    const a = document.createElement("a");
    a.href = url;
    a.setAttribute("download", filename);
    fetch(url, { headers: { Authorization: `Bearer ${token}` } })
      .then(async (res) => {
        if (!res.ok) throw new Error("Falha no download");
        const blob = await res.blob();
        const blobUrl = window.URL.createObjectURL(blob);
        a.href = blobUrl;
        a.download = filename;
        a.click();
        window.URL.revokeObjectURL(blobUrl);
      })
      .catch((e: any) => {
        toast({ title: "Erro no download", description: e.message, variant: "destructive" });
      });
  }
'''

          if old_preview not in text:
              raise SystemExit('previewProposal target not found')
          if old_download not in text:
              raise SystemExit('downloadProposal target not found')

          text = text.replace(old_preview, new_preview, 1)
          text = text.replace(old_download, new_download, 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "VendorAI Automation"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/frontend/src/pages/LeadPropostaTab.tsx
          git diff --cached --check
          git commit -m "fix: visualizar e nomear proposta [proposal-preview-patch]"
          git push origin HEAD:fix/proposal-preview-filename
