name: Temporary integration grouping

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/group-integrations-by-provider
          fetch-depth: 0
      - name: Apply grouping
        run: python scripts/tmp_group_integrations.py
      - name: Commit result
        run: |
          rm .github/workflows/tmp-group-integrations.yml scripts/tmp_group_integrations.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/Configuracoes.tsx .github/workflows/tmp-group-integrations.yml scripts/tmp_group_integrations.py
          git commit -m "refactor(integrations): agrupar conexoes por provedor"
          git push origin HEAD:fix/group-integrations-by-provider
