name: Registrar novidades automaticamente

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  registrar:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Baixar versão principal
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Registrar melhoria incorporada
        env:
          PR_PAYLOAD: ${{ toJson(github.event.pull_request) }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export CHANGED_FILES=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | tr '\n' ',')
          PAYLOAD=$(node -e 'const p=JSON.parse(process.env.PR_PAYLOAD); process.stdout.write(Buffer.from(JSON.stringify({number:p.number,title:p.title,body:p.body,merged:p.merged,mergedAt:p.merged_at,changedFiles:process.env.CHANGED_FILES})).toString("base64"))')
          node scripts/register-changelog.mjs artifacts/api-server/src/data/automatic-changelog.ts "$PAYLOAD"

      - name: Publicar registro em Novidades
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "VendorAI Novidades"
          git config user.email "actions@users.noreply.github.com"
          git add artifacts/api-server/src/data/automatic-changelog.ts
          git commit -m "Registra automaticamente novidade do PR #${{ github.event.pull_request.number }}"
          git push origin main
