name: Cloudflare Pages
# Production deploy: Pages frontend; Railway backend remains unchanged.

on:
  push:
    branches: [main]
    paths:
      - "artifacts/frontend/**"
      - "lib/api-client-react/**"
      - "lib/vendor-brain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy VendorAI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/frontend build

      - name: Verify Cloudflare Pages bundle
        run: |
          test -f artifacts/frontend/dist/public/index.html
          test -f artifacts/frontend/dist/public/_worker.js

      - name: Ensure Cloudflare Pages project
        run: pnpm dlx wrangler@3.90.0 pages project create vendorai --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@3.90.0 pages deploy artifacts/frontend/dist/public --project-name vendorai --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind app.appvendorai.com
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          domain="app.appvendorai.com"
          endpoint="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/vendorai/domains"

          current=$(curl -sS "${auth[@]}" "$endpoint/$domain")
          current_ok=$(jq -r '.success // false' <<<"$current")
          current_status=$(jq -r '.result.status // empty' <<<"$current")

          # If the custom domain is already active, the deployment is complete.
          # Do not require Zone/DNS permissions on every frontend publish.
          if [ "$current_ok" = "true" ] && [ "$current_status" = "active" ]; then
            echo "Custom domain already active: $domain"
            exit 0
          fi

          if [ "$current_ok" != "true" ]; then
            echo "Custom domain is not attached yet; attaching it to Pages."
            attach=$(curl -sS "${auth[@]}" -X POST "$endpoint" --data "{\"name\":\"$domain\"}")
            if [ "$(jq -r '.success // false' <<<"$attach")" != "true" ]; then
              echo "Cloudflare could not attach the custom domain:"
              jq -c '{errors, messages}' <<<"$attach"
              exit 1
            fi
          fi

          # DNS is only needed when the domain is not active yet.
          zone_response=$(curl -sS "${auth[@]}" "$api/zones?name=appvendorai.com")
          if [ "$(jq -r '.success // false' <<<"$zone_response")" != "true" ]; then
            echo "Cloudflare could not read the appvendorai.com zone:"
            jq -c '{errors, messages}' <<<"$zone_response"
            exit 1
          fi

          zone_id=$(jq -r '.result[0].id // empty' <<<"$zone_response")
          if [ -z "$zone_id" ]; then
            echo "Cloudflare zone appvendorai.com was not found for this token/account."
            exit 1
          fi

          record_response=$(curl -sS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=CNAME&name=$domain")
          if [ "$(jq -r '.success // false' <<<"$record_response")" != "true" ]; then
            echo "Cloudflare could not read the production DNS record:"
            jq -c '{errors, messages}' <<<"$record_response"
            exit 1
          fi

          record_id=$(jq -r '.result[0].id // empty' <<<"$record_response")
          payload='{"type":"CNAME","name":"app","content":"vendorai.pages.dev","ttl":1,"proxied":true}'

          if [ -n "$record_id" ]; then
            dns_result=$(curl -sS "${auth[@]}" -X PUT "$api/zones/$zone_id/dns_records/$record_id" --data "$payload")
          else
            dns_result=$(curl -sS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$payload")
          fi
          if [ "$(jq -r '.success // false' <<<"$dns_result")" != "true" ]; then
            echo "Cloudflare could not update the production DNS record:"
            jq -c '{errors, messages}' <<<"$dns_result"
            exit 1
          fi

          for attempt in {1..18}; do
            domain_state=$(curl -sS "${auth[@]}" "$endpoint/$domain")
            if [ "$(jq -r '.success // false' <<<"$domain_state")" != "true" ]; then
              echo "Unable to read custom-domain state on attempt $attempt."
              jq -c '{errors, messages}' <<<"$domain_state"
              sleep 10
              continue
            fi

            status=$(jq -r '.result.status // empty' <<<"$domain_state")
            echo "Custom domain status: ${status:-unknown}"
            if [ "$status" = "active" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "Custom domain was attached but is not active yet."
          exit 1
