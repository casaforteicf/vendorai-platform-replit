name: Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "artifacts/frontend/**"
      - "lib/api-client-react/**"
      - "lib/vendor-brain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy VendorAI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/frontend build

      - name: Verify Cloudflare Pages bundle
        run: |
          test -f artifacts/frontend/dist/public/index.html
          test -f artifacts/frontend/dist/public/_worker.js

      - name: Ensure Cloudflare Pages project
        run: pnpm dlx wrangler@3.90.0 pages project create vendorai --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@3.90.0 pages deploy artifacts/frontend/dist/public --project-name vendorai --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind and validate app.appvendorai.com
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          domain="app.appvendorai.com"
          endpoint="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/vendorai/domains/$domain"

          current=$(curl -sS "${auth[@]}" "$endpoint")
          if [ "$(jq -r '.success // false' <<<"$current")" != "true" ]; then
            created=$(curl -fsS "${auth[@]}" -X POST \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/vendorai/domains" \
              --data '{"name":"app.appvendorai.com"}')
            jq -e '.success == true' <<<"$created" >/dev/null
          fi

          # For zones already managed by Cloudflare, Pages creates the CNAME
          # automatically after the custom domain is associated. Avoid requiring
          # separate Zone Read / DNS Edit permissions in this deployment token.
          for attempt in $(seq 1 12); do
            status_json=$(curl -fsS "${auth[@]}" "$endpoint")
            status=$(jq -r '.result.status // "unknown"' <<<"$status_json")
            validation=$(jq -r '.result.validation_data.status // "unknown"' <<<"$status_json")
            echo "Cloudflare Pages custom domain: status=$status validation=$validation"

            if [ "$status" = "active" ]; then
              exit 0
            fi
            if [ "$status" = "error" ] || [ "$status" = "blocked" ] || [ "$status" = "deactivated" ]; then
              jq '{success, errors, result: {name: .result.name, status: .result.status, validation_data: .result.validation_data}}' <<<"$status_json"
              exit 1
            fi

            if [ "$attempt" -lt 12 ]; then
              sleep 10
            fi
          done

          echo "Custom domain was associated, but is not active yet. Cloudflare may still be provisioning DNS/certificate."
          exit 1
