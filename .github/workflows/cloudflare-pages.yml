name: Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "artifacts/frontend/**"
      - "lib/api-client-react/**"
      - "lib/vendor-brain/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy VendorAI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build frontend
        run: pnpm --filter @workspace/frontend build

      - name: Verify Cloudflare Pages bundle
        run: |
          test -f artifacts/frontend/dist/public/index.html
          test -f artifacts/frontend/dist/public/_worker.js

      - name: Ensure Cloudflare Pages project
        run: pnpm dlx wrangler@3.90.0 pages project create vendorai --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        run: pnpm dlx wrangler@3.90.0 pages deploy artifacts/frontend/dist/public --project-name vendorai --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Bind app.appvendorai.com
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          domain="app.appvendorai.com"

          current=$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/vendorai/domains/$domain" || true)
          if [ "$(jq -r '.success // false' <<<"$current")" != "true" ]; then
            curl -fsS "${auth[@]}" -X POST \
              "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/vendorai/domains" \
              --data '{"name":"app.appvendorai.com"}' | jq -e '.success == true'
          fi

          zone_id=$(curl -fsS "${auth[@]}" "$api/zones?name=appvendorai.com" | jq -er '.result[0].id')
          record_id=$(curl -fsS "${auth[@]}" "$api/zones/$zone_id/dns_records?name=$domain" | jq -r '.result[0].id // empty')
          payload='{"type":"CNAME","name":"app","content":"vendorai.pages.dev","ttl":1,"proxied":true}'

          if [ -n "$record_id" ]; then
            curl -fsS "${auth[@]}" -X PUT "$api/zones/$zone_id/dns_records/$record_id" --data "$payload" | jq -e '.success == true'
          else
            curl -fsS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$payload" | jq -e '.success == true'
          fi

          for attempt in {1..12}; do
            status=$(curl -fsS "${auth[@]}" "$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/vendorai/domains/$domain" | jq -r '.result.status // empty')
            echo "Custom domain status: ${status:-unknown}"
            if [ "$status" = "active" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "Custom domain was attached but is not active yet."
