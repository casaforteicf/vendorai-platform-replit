name: Cloudflare Pages
# Production deploy: Pages frontend; Railway backend remains unchanged.
# Redeploy marker: settings-central-3219-2026-10-06.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vendorai-production-release
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy VendorAI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Gate frontend on production API
        shell: bash
        env:
          API_HEALTH_URL: https://vendorai-platform-replit-production.up.railway.app/api/auth/healthz
          BEFORE_SHA: ${{ github.event.before }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail

          api_changed=false
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${BEFORE_SHA:-}" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
            if git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" | grep -Eq '^(artifacts/api-server/|lib/db/|lib/api-zod/|lib/vendor-brain/|backend/Dockerfile$)'; then
              api_changed=true
            fi
          fi

          echo "API changed in this release: $api_changed"
          echo "Waiting for production API: $API_HEALTH_URL"

          for attempt in {1..30}; do
            headers="$(mktemp)"
            body="$(mktemp)"

            if curl --silent --show-error --fail \
              --connect-timeout 5 --max-time 15 \
              -D "$headers" -o "$body" "$API_HEALTH_URL"; then
              status="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
              revision="$(awk 'BEGIN{IGNORECASE=1} /^X-VendorAI-Revision:/ {gsub("\r", "", $2); print $2}' "$headers" | tail -1)"

              echo "Attempt $attempt: status=${status:-missing} revision=${revision:-missing}"

              if [ "$status" = "ok" ]; then
                if [ "$api_changed" = "false" ]; then
                  echo "Production API is healthy. Frontend release may proceed."
                  exit 0
                fi

                if [ "$revision" = "$EXPECTED_REVISION" ]; then
                  echo "Production API is healthy and matches release $EXPECTED_REVISION."
                  exit 0
                fi
              fi
            else
              echo "Attempt $attempt: production API is not healthy yet."
            fi

            rm -f "$headers" "$body"
            sleep 10
          done

          if [ "$api_changed" = "true" ]; then
            echo "Frontend deploy blocked: production API did not become healthy on revision $EXPECTED_REVISION."
          else
            echo "Frontend deploy blocked: production API is unhealthy."
          fi
          exit 1

      - name: Build frontend
        env:
          VENDOR_BUILD_ID: ${{ github.sha }}
        run: pnpm --filter @workspace/frontend build

      - name: Verify Cloudflare Pages bundle
        run: |
          test -f artifacts/frontend/dist/public/index.html
          test -f artifacts/frontend/dist/public/_worker.js

      - name: Ensure Cloudflare Pages project
        run: pnpm dlx wrangler@3.90.0 pages project create vendorai --production-branch main || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        id: deploy_primary
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Primary Cloudflare Pages deploy attempt $attempt/3"
            if pnpm dlx wrangler@3.90.0 pages deploy artifacts/frontend/dist/public --project-name vendorai --branch main; then
              echo "Primary deploy succeeded on attempt $attempt."
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 10))
            fi
          done
          echo "Primary Cloudflare Pages deploy failed after 3 attempts."
          exit 1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Trigger alternate fullstack fallback
        id: deploy_fallback
        if: steps.deploy_primary.outcome != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run cloudflare-fullstack-alt.yml --repo "$REPO" --ref main

          run_id=""
          for attempt in {1..30}; do
            run_id="$(gh run list --repo "$REPO" --workflow cloudflare-fullstack-alt.yml --branch main --event workflow_dispatch --created ">=$before" --json databaseId,headSha,status,conclusion --jq 'map(select(.headSha == env.EXPECTED_SHA)) | sort_by(.databaseId) | last | .databaseId // empty' 2>/dev/null || true)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Alternate Cloudflare workflow was dispatched but no matching run for $EXPECTED_SHA was found."
            exit 1
          fi

          echo "Waiting for alternate workflow run $run_id"
          gh run watch "$run_id" --repo "$REPO" --exit-status

      - name: Fail if all frontend publish paths failed
        if: steps.deploy_primary.outcome != 'success' && steps.deploy_fallback.outcome != 'success'
        run: |
          echo "::error::Primary Cloudflare Pages deploy and alternate fullstack fallback both failed."
          exit 1

      - name: Bind app.appvendorai.com
        if: steps.deploy_primary.outcome == 'success' || steps.deploy_fallback.outcome == 'success'
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4"
          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          domain="app.appvendorai.com"
          endpoint="$api/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/vendorai/domains"

          current=$(curl -sS "${auth[@]}" "$endpoint/$domain")
          current_ok=$(jq -r '.success // false' <<<"$current")
          current_status=$(jq -r '.result.status // empty' <<<"$current")

          # If the custom domain is already active, the deployment is complete.
          # Do not require Zone/DNS permissions on every frontend publish.
          if [ "$current_ok" = "true" ] && [ "$current_status" = "active" ]; then
            echo "Custom domain already active: $domain"
            exit 0
          fi

          if [ "$current_ok" != "true" ]; then
            echo "Custom domain is not attached yet; attaching it to Pages."
            attach=$(curl -sS "${auth[@]}" -X POST "$endpoint" --data "{\"name\":\"$domain\"}")
            if [ "$(jq -r '.success // false' <<<"$attach")" != "true" ]; then
              echo "Cloudflare could not attach the custom domain:"
              jq -c '{errors, messages}' <<<"$attach"
              exit 1
            fi
          fi

          # DNS is only needed when the domain is not active yet.
          zone_response=$(curl -sS "${auth[@]}" "$api/zones?name=appvendorai.com")
          if [ "$(jq -r '.success // false' <<<"$zone_response")" != "true" ]; then
            echo "Cloudflare could not read the appvendorai.com zone:"
            jq -c '{errors, messages}' <<<"$zone_response"
            exit 1
          fi

          zone_id=$(jq -r '.result[0].id // empty' <<<"$zone_response")
          if [ -z "$zone_id" ]; then
            echo "Cloudflare zone appvendorai.com was not found for this token/account."
            exit 1
          fi

          record_response=$(curl -sS "${auth[@]}" "$api/zones/$zone_id/dns_records?type=CNAME&name=$domain")
          if [ "$(jq -r '.success // false' <<<"$record_response")" != "true" ]; then
            echo "Cloudflare could not read the production DNS record:"
            jq -c '{errors, messages}' <<<"$record_response"
            exit 1
          fi

          record_id=$(jq -r '.result[0].id // empty' <<<"$record_response")
          payload='{"type":"CNAME","name":"app","content":"vendorai.pages.dev","ttl":1,"proxied":true}'

          if [ -n "$record_id" ]; then
            dns_result=$(curl -sS "${auth[@]}" -X PUT "$api/zones/$zone_id/dns_records/$record_id" --data "$payload")
          else
            dns_result=$(curl -sS "${auth[@]}" -X POST "$api/zones/$zone_id/dns_records" --data "$payload")
          fi
          if [ "$(jq -r '.success // false' <<<"$dns_result")" != "true" ]; then
            echo "Cloudflare could not update the production DNS record:"
            jq -c '{errors, messages}' <<<"$dns_result"
            exit 1
          fi

          for attempt in {1..18}; do
            domain_state=$(curl -sS "${auth[@]}" "$endpoint/$domain")
            if [ "$(jq -r '.success // false' <<<"$domain_state")" != "true" ]; then
              echo "Unable to read custom-domain state on attempt $attempt."
              jq -c '{errors, messages}' <<<"$domain_state"
              sleep 10
              continue
            fi

            status=$(jq -r '.result.status // empty' <<<"$domain_state")
            echo "Custom domain status: ${status:-unknown}"
            if [ "$status" = "active" ]; then
              exit 0
            fi
            sleep 10
          done

          echo "Custom domain was attached but is not active yet."
          exit 1


      - name: Verify production bundle integrity
        if: steps.deploy_primary.outcome == 'success' || steps.deploy_fallback.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          root="artifacts/frontend/dist/public"
          public_base="https://app.appvendorai.com"

          entry="$(grep -oE '/assets/index-[^" ]+\.js' "$root/index.html" | head -1)"
          if [ -z "$entry" ]; then
            echo "::error::Could not resolve frontend entry asset from built index.html."
            exit 1
          fi

          echo "Waiting for production HTML to expose $entry"
          matched=false
          for attempt in {1..24}; do
            html="$(curl -fsSL --connect-timeout 5 --max-time 20 "$public_base/?__vendorai_integrity=$RANDOM" || true)"
            if grep -F -- "$entry" <<<"$html" >/dev/null; then
              matched=true
              break
            fi
            echo "Production still points to another bundle (attempt $attempt/24)."
            sleep 5
          done

          if [ "$matched" != true ]; then
            echo "::error::Production HTML did not switch to the newly deployed entry asset $entry."
            exit 1
          fi

          bash scripts/verify-cloudflare-pages-assets.sh "$root" "$public_base"
