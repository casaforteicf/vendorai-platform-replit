name: Apply Instagram Direct Publishing Fix

on:
  push:
    branches:
      - fix-instagram-direct-publishing

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[instagram-direct-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-instagram-direct-publishing
          fetch-depth: 0
      - run: python scripts/fix-instagram-direct-publishing.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/api-server/src/services/instagram-oauth.ts artifacts/api-server/src/lib/instagram-publish.ts artifacts/api-server/src/services/content-performance.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: alinhar publicação ao Instagram Login direto [instagram-direct-applied]"
          git push origin fix-instagram-direct-publishing
