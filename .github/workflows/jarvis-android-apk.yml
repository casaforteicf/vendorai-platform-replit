name: Publish Existing VendorAI Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/jarvis-android-apk.yml

permissions:
  contents: write

jobs:
  publish-existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXISTING_BUILD_ID: 942fee26-33dc-46a2-b171-dd9417137430

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar EXPO_TOKEN
        shell: bash
        run: test -n "$EXPO_TOKEN" || (echo "Secret EXPO_TOKEN ausente" && exit 1)

      - name: Instalar EAS CLI
        run: npm install --global eas-cli

      - name: Obter link direto do APK existente
        working-directory: artifacts/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build:view "$EXISTING_BUILD_ID" --json > /tmp/eas-build.json

          APK_URL="$(node <<'NODE'
          const fs = require('fs');
          const build = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          const url =
            build?.artifacts?.buildUrl ||
            build?.artifacts?.applicationArchiveUrl ||
            build?.artifact?.url ||
            build?.buildUrl ||
            '';
          if (!url || !/^https:\/\/expo\.dev\/artifacts\/eas\/.+\.apk(?:\?.*)?$/.test(url)) {
            console.error('O build existente não retornou um link direto de APK válido.');
            console.error(JSON.stringify(build?.artifacts || build, null, 2));
            process.exit(1);
          }
          process.stdout.write(url);
          NODE
          )"

          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "Link direto do APK existente capturado com sucesso."

      - name: Publicar endereço próprio do APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APK_URL:-}"
          printf '/downloads/vendorai.apk %s 302\n' "$APK_URL" > artifacts/website/public/_redirects

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/website/public/_redirects

          if git diff --cached --quiet; then
            echo "O endereço do APK já está atualizado."
            exit 0
          fi

          git commit -m "chore(site): apontar download para APK direto existente"
          git push origin HEAD:main
