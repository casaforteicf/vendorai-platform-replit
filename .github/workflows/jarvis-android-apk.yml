name: Build Jarvis Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/jarvis-android-apk.yml
      - artifacts/mobile/**

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      PICOVOICE_ACCESS_KEY: ${{ secrets.PICOVOICE_ACCESS_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar identidade visual do site no app
        shell: bash
        run: |
          cp artifacts/website/public/apple-touch-icon.png artifacts/mobile/assets/images/icon.png
          test -s artifacts/mobile/assets/images/icon.png

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate

      - name: Validar EXPO_TOKEN
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || (echo "Secret EXPO_TOKEN ausente" && exit 1)
          if [ -z "$PICOVOICE_ACCESS_KEY" ]; then
            echo "PICOVOICE_ACCESS_KEY ainda ausente: APK será gerado com voz do JARVIS, mas wake word em segundo plano ficará desativada."
          fi

      - name: Baixar modelo Porcupine pt-BR
        if: ${{ env.PICOVOICE_ACCESS_KEY != '' }}
        shell: bash
        run: |
          mkdir -p artifacts/mobile/assets/jarvis
          curl -fL \
            https://raw.githubusercontent.com/Picovoice/porcupine/master/lib/common/porcupine_params_pt.pv \
            -o artifacts/mobile/assets/jarvis/porcupine_params_pt.pv
          test -s artifacts/mobile/assets/jarvis/porcupine_params_pt.pv

      - name: Instalar dependências
        run: pnpm install --no-frozen-lockfile

      - name: Instalar EAS CLI
        run: npm install --global eas-cli

      - name: Inicializar projeto EAS
        working-directory: artifacts/mobile
        run: eas init --force --non-interactive

      - name: Sincronizar Picovoice no EAS
        if: ${{ env.PICOVOICE_ACCESS_KEY != '' }}
        working-directory: artifacts/mobile
        run: |
          eas env:set preview \
            --name PICOVOICE_ACCESS_KEY \
            --value "$PICOVOICE_ACCESS_KEY" \
            --visibility secret \
            --scope project \
            --non-interactive

      - name: Gerar APK Android e capturar link direto
        working-directory: artifacts/mobile
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile preview --non-interactive --wait --json > /tmp/eas-build.json

          APK_URL="$(node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/eas-build.json', 'utf8'));
          const build = Array.isArray(payload) ? payload[0] : payload;
          const url =
            build?.artifacts?.buildUrl ||
            build?.artifacts?.applicationArchiveUrl ||
            build?.artifact?.url ||
            build?.buildUrl ||
            '';
          if (!url || !/^https:\/\/expo\.dev\/artifacts\/eas\/.+\.apk(?:\?.*)?$/.test(url)) {
            console.error('EAS não retornou um link direto de APK válido.');
            process.exit(1);
          }
          process.stdout.write(url);
          NODE
          )"

          echo "APK_URL=$APK_URL" >> "$GITHUB_ENV"
          echo "APK direto capturado com sucesso."

      - name: Publicar endereço próprio do APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${APK_URL:-}"
          printf '/downloads/vendorai.apk %s 302\n' "$APK_URL" > artifacts/website/public/_redirects

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/website/public/_redirects

          if git diff --cached --quiet; then
            echo "O endereço do APK já está atualizado."
            exit 0
          fi

          git commit -m "chore(site): atualizar APK Android publicado"
          git push origin HEAD:main
