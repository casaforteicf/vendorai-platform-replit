name: Apply onboarding WhatsApp QR

on:
  push:
    branches:
      - fix-onboarding-whatsapp-qr

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[onboarding-qr-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-onboarding-whatsapp-qr
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-onboarding-whatsapp-qr.py
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/frontend/src/pages/OnboardingIntegracoes.tsx artifacts/api-server/src/routes/onboarding.ts
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "feat: conectar WhatsApp por QR Code no onboarding [onboarding-qr-applied]"
          git push origin HEAD:fix-onboarding-whatsapp-qr
