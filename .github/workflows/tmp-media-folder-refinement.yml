name: Temporary Media Folder Refinement

on:
  push:
    branches:
      - fix/media-center-folder-actions

permissions:
  contents: write

jobs:
  patch-media-center:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-center-folder-actions
          fetch-depth: 0

      - name: Apply targeted Media Center refinement
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/patch_media_center.py
          python /tmp/patch_media_center.py
          git rm .github/workflows/tmp-media-folder-refinement.yml
          git diff --check
          grep -q 'const folderRows = useMemo' artifacts/frontend/src/pages/MediaCenter.tsx
          grep -q 'chooseFolderForAsset' artifacts/frontend/src/pages/MediaCenter.tsx

      - name: Commit refinement
        shell: bash
        run: |
          git config user.name 'vendorai-automation'
          git config user.email 'vendorai-automation@users.noreply.github.com'
          git add -A
          git commit -m 'fix(media): refine folder tree and inspector actions'
          git push origin HEAD:fix/media-center-folder-actions
