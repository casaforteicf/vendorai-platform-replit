name: Fix global 429 public delivery limiter

on:
  push:
    branches:
      - fix/global-429-public-delivery-limiter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/global-429-public-delivery-limiter
          fetch-depth: 0

      - name: Apply focused patch
        run: python scripts/fix_global_429_public_delivery_limiter.py

      - name: Validate focused patch
        run: |
          git diff --check
          ! grep -F 'pracaDeliveryPublicRouter.use(rateLimit(' artifacts/api-server/src/routes/praca_delivery_ops.ts
          grep -F 'const publicDeliveryRateLimiter = rateLimit({' artifacts/api-server/src/routes/praca_delivery_ops.ts
          grep -F 'pracaDeliveryPublicRouter.get("/public/praca-delivery/:trackingToken", publicDeliveryRateLimiter' artifacts/api-server/src/routes/praca_delivery_ops.ts
          grep -F 'pracaDeliveryPublicRouter.post("/public/praca-delivery/:trackingToken/messages", publicDeliveryRateLimiter' artifacts/api-server/src/routes/praca_delivery_ops.ts

      - name: Commit focused fix
        run: |
          rm scripts/fix_global_429_public_delivery_limiter.py
          rm .github/workflows/fix-global-429-public-delivery-limiter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(api): limitar 429 apenas ao portal público de entregas"
          git push origin HEAD:fix/global-429-public-delivery-limiter
