name: Arqdor C08 validation
on:
  pull_request:
    paths:
      - 'artifacts/api-server/src/routes/arqdor_furniture*'
      - 'artifacts/frontend/src/modules/arqdor/**'
      - 'artifacts/api-server/src/routes/arch.ts'
      - '.github/workflows/arqdor-c08-check.yml'
  workflow_dispatch:
jobs:
  c08-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: API typecheck
        run: pnpm --filter @workspace/api-server typecheck
      - name: Furniture API geometry tests
        run: pnpm --filter @workspace/api-server exec vitest run src/routes/arqdor_furniture_bim_geometry.test.ts src/routes/arqdor_concept_furniture_geometry.test.ts
      - name: Furniture frontend tests
        run: pnpm --filter @workspace/frontend exec vitest run --config vitest.config.ts src/modules/arqdor/shared/furniture-project-snapshot.test.ts src/modules/arqdor/shared/furniture-door-swing-clashes.test.ts
