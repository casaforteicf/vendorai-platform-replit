name: VendorAI API CI

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/vendor-brain/**"
      - ".github/workflows/vendorai-api-ci.yml"
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # @workspace/db creates the pg Pool at module import time. These focused
      # unit tests do not execute queries, so a syntactically valid local URL is
      # enough and avoids depending on production/staging secrets in CI.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendorai_ci
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        # GitHub tests the synthetic PR merge commit. When main advances with a
        # workspace-only dependency, that synthetic tree can temporarily have a
        # package.json/lock importer mismatch even though neither side changes
        # third-party versions. Let pnpm reconcile workspace links in-run; all
        # resolved external versions still come from the committed lockfile.
        run: pnpm install --no-frozen-lockfile

      - name: Vendor Brain foundation typecheck
        run: pnpm --filter @workspace/vendor-brain typecheck

      # Blocking gate for every launch-critical lifecycle, billing and analytics
      # module touched by this PR, including Command Center and Revenue Scout.
      - name: Launch lifecycle and analytics typecheck
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.launch-ci.json --noEmit

      - name: JARVIS Action Orchestrator tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/services/jarvis-action-orchestrator.test.ts

      - name: Trial and billing tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/lib/trial-tenant-resolution.test.ts
          src/lib/vendorai-subscription-lifecycle.test.ts
          src/lib/vendorai-subscription-rules.test.ts

      - name: Agenda tenant and ownership isolation tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/__tests__/agendamentos-isolation.test.ts

      - name: Tenant session isolation tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/__tests__/tenant-switch-isolation.test.ts
          src/__tests__/session-tenant-context.test.ts

      # Keep repository-wide TypeScript debt visible without allowing unrelated
      # legacy modules (PraçaAI, Access License, agents, stories, etc.) to hide
      # the launch-specific gate above. Anthropic is built first to avoid false
      # TS6305 project-reference errors.
      - name: API-wide typecheck diagnostic
        continue-on-error: true
        run: |
          pnpm exec tsc -b lib/integrations-anthropic-ai/tsconfig.json
          pnpm --filter @workspace/api-server typecheck