name: VendorAI API CI

on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - ".github/workflows/vendorai-api-ci.yml"
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # @workspace/db creates the pg Pool at module import time. These focused
      # unit tests do not execute queries, so a syntactically valid local URL is
      # enough and avoids depending on production/staging secrets in CI.
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendorai_ci
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck API Server
        run: pnpm --filter @workspace/api-server typecheck

      - name: Trial and billing tests
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/lib/trial-tenant-resolution.test.ts
          src/lib/vendorai-subscription-lifecycle.test.ts
