name: tmp-beat-advanced-patch
on:
  push:
    branches: [feat/video-beat-sync-advanced]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-beat-sync-advanced
          fetch-depth: 0
      - name: Apply advanced Beat Sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('artifacts/frontend/src/components/video/VideoTimelineEditor.tsx')
          text = p.read_text()
          if 'type BeatSyncStrength =' in text:
              print('advanced Beat Sync already applied')
          else:
              def rep(old, new, count=1):
                  global text
                  if old not in text:
                      raise SystemExit('Missing anchor:\n' + old[:300])
                  text = text.replace(old, new, count)

              rep('''  transitionDuration?: number;\n  motion?: ClipMotion;\n};''', '''  transitionDuration?: number;\n  motion?: ClipMotion;\n  beatLocked?: boolean;\n};''')

              rep('''type BeatStep = 1 | 2 | 4;\ntype AudioMixPreset = "voice" | "balanced" | "institutional" | "music";''', '''type BeatStep = 1 | 2 | 4;\ntype BeatSyncStrength = "light" | "balanced" | "aggressive";\ntype AudioMixPreset = "voice" | "balanced" | "institutional" | "music";\n\ntype BeatCutPreview = {\n  clipId: string;\n  nextClipId: string;\n  index: number;\n  boundary: number;\n  target: number;\n  delta: number;\n  downbeat: boolean;\n  manual: boolean;\n};''')

              rep('''  source: "audio" | "metadata";\n  waveform: number[];\n};''', '''  source: "audio" | "metadata";\n  waveform: number[];\n  downbeatIndex: number;\n};''')

              # Add downbeat detection before return in beat analysis.
              rep('''  return {\n    bpm: Math.round(bpm * 10) / 10,\n    offset: Math.round(bestOffset * 1000) / 1000,\n    confidence: Math.round(clamp(correlationConfidence, 0.2, 0.98) * 100) / 100,\n    source: "audio",\n    waveform: buildWaveformSamples(buffer),\n  };''', '''  const beatBuckets = [0, 0, 0, 0];\n  const beatCounts = [0, 0, 0, 0];\n  let beatOrdinal = 0;\n  for (let time = bestOffset; time < duration; time += period) {\n    const index = Math.min(energies.length - 1, Math.max(0, Math.round(time / windowDuration)));\n    const bucket = beatOrdinal % 4;\n    beatBuckets[bucket] += Math.max(0, (energies[index] ?? 0) - mean);\n    beatCounts[bucket] += 1;\n    beatOrdinal += 1;\n  }\n  let downbeatIndex = 0;\n  let downbeatScore = Number.NEGATIVE_INFINITY;\n  for (let bucket = 0; bucket < 4; bucket += 1) {\n    const score = beatBuckets[bucket] / Math.max(1, beatCounts[bucket]);\n    if (score > downbeatScore) { downbeatScore = score; downbeatIndex = bucket; }\n  }\n\n  return {\n    bpm: Math.round(bpm * 10) / 10,\n    offset: Math.round(bestOffset * 1000) / 1000,\n    confidence: Math.round(clamp(correlationConfidence, 0.2, 0.98) * 100) / 100,\n    source: "audio",\n    waveform: buildWaveformSamples(buffer),\n    downbeatIndex,\n  };''')

              rep('''  const [beatStep, setBeatStep] = useState<BeatStep>(2);\n  const [showBeatMarkers, setShowBeatMarkers] = useState(true);''', '''  const [beatStep, setBeatStep] = useState<BeatStep>(2);\n  const [showBeatMarkers, setShowBeatMarkers] = useState(true);\n  const [beatSyncStrength, setBeatSyncStrength] = useState<BeatSyncStrength>("balanced");\n  const [manualBeatMarkers, setManualBeatMarkers] = useState<number[]>([]);\n  const [syncVisualAccents, setSyncVisualAccents] = useState(true);''')

              # Replace beatTimes memo with raw/downbeat/preview infrastructure.
              old = '''  const beatTimes = useMemo(() => {\n    if (!activeBeatAnalysis || musicMode === "none") return [];\n    const sourceDuration = Math.max(0.1, musicEnd - musicStart, realProjectDuration - musicStart);\n    return buildBeatTimes(activeBeatAnalysis.bpm, activeBeatAnalysis.offset, sourceDuration)\n      .filter((_, index) => index % beatStep === 0)\n      .map((time) => musicStart + time)\n      .filter((time) => time >= 0 && time <= realProjectDuration + 0.001 && time <= musicEnd + 0.001);\n  }, [activeBeatAnalysis, beatStep, musicEnd, musicMode, musicStart, realProjectDuration]);'''
              new = '''  const rawBeatTimes = useMemo(() => {\n    if (!activeBeatAnalysis || musicMode === "none") return [];\n    const sourceDuration = Math.max(0.1, musicEnd - musicStart, realProjectDuration - musicStart);\n    return buildBeatTimes(activeBeatAnalysis.bpm, activeBeatAnalysis.offset, sourceDuration)\n      .map((time) => musicStart + time)\n      .filter((time) => time >= 0 && time <= realProjectDuration + 0.001 && time <= musicEnd + 0.001);\n  }, [activeBeatAnalysis, musicEnd, musicMode, musicStart, realProjectDuration]);\n  const beatTimes = useMemo(() => rawBeatTimes.filter((_, index) => index % beatStep === 0), [beatStep, rawBeatTimes]);\n  const downbeatTimes = useMemo(() => activeBeatAnalysis\n    ? rawBeatTimes.filter((_, index) => index % 4 === activeBeatAnalysis.downbeatIndex)\n    : [], [activeBeatAnalysis, rawBeatTimes]);\n  const effectiveBeatCandidates = useMemo(() => {\n    const values = [...beatTimes, ...downbeatTimes, ...manualBeatMarkers]\n      .filter((time) => time >= 0 && time <= realProjectDuration)\n      .sort((a, b) => a - b);\n    return values.filter((time, index) => index === 0 || Math.abs(time - values[index - 1]!) > 0.012);\n  }, [beatTimes, downbeatTimes, manualBeatMarkers, realProjectDuration]);\n  const beatCutPreview = useMemo<BeatCutPreview[]>(() => {\n    if (!activeBeatAnalysis || effectiveBeatCandidates.length === 0 || clips.length < 2) return [];\n    const working = clips.map((clip) => ({ ...clip }));\n    const period = 60 / activeBeatAnalysis.bpm;\n    const config = beatSyncStrength === "light"\n      ? { cap: 0.18, factor: 0.24 }\n      : beatSyncStrength === "aggressive"\n        ? { cap: 0.5, factor: 0.62 }\n        : { cap: 0.34, factor: 0.42 };\n    const tolerance = Math.min(config.cap, period * beatStep * config.factor);\n    const preview: BeatCutPreview[] = [];\n    for (let index = 0; index < working.length - 1; index += 1) {\n      const previous = working[index];\n      const nextClip = working[index + 1];\n      if (!previous || !nextClip || previous.beatLocked || nextClip.beatLocked) continue;\n      const boundary = clipStartAt(index + 1, working);\n      let target = effectiveBeatCandidates[0] ?? boundary;\n      let distance = Math.abs(target - boundary);\n      for (const candidate of effectiveBeatCandidates) {\n        const candidateDistance = Math.abs(candidate - boundary);\n        if (candidateDistance < distance) { target = candidate; distance = candidateDistance; }\n      }\n      if (distance > tolerance) continue;\n      const proposedTrimOut = clamp(previous.trimOut + (target - boundary), previous.trimIn + 0.25, previous.sourceDuration);\n      const delta = proposedTrimOut - previous.trimOut;\n      if (Math.abs(delta) < 0.015) continue;\n      const appliedTarget = boundary + delta;\n      preview.push({\n        clipId: previous.id,\n        nextClipId: nextClip.id,\n        index,\n        boundary,\n        target: appliedTarget,\n        delta,\n        downbeat: downbeatTimes.some((time) => Math.abs(time - target) < 0.025),\n        manual: manualBeatMarkers.some((time) => Math.abs(time - target) < 0.025),\n      });\n      working[index] = { ...previous, trimOut: proposedTrimOut };\n    }\n    return preview;\n  }, [activeBeatAnalysis, beatStep, beatSyncStrength, clips, downbeatTimes, effectiveBeatCandidates, manualBeatMarkers]);'''
              rep(old, new)

              # Add manual marker helpers before syncCutsToBeats.
              rep('''  const syncCutsToBeats = useCallback(() => {''', '''  const addManualBeatMarker = useCallback(() => {\n    const marker = Math.round(clamp(timelineTime, 0, realProjectDuration) * 1000) / 1000;\n    setManualBeatMarkers((current) => [...current.filter((time) => Math.abs(time - marker) > 0.04), marker].sort((a, b) => a - b));\n  }, [realProjectDuration, timelineTime]);\n\n  const syncCutsToBeats = useCallback(() => {''')

              # Replace syncCuts body function wholesale until deps line.
              start = text.index('  const syncCutsToBeats = useCallback(() => {')
              end_marker = '  }, [activeBeatAnalysis, beatStep, beatTimes, commitEditor, toast]);'
              end = text.index(end_marker, start) + len(end_marker)
              new_sync = '''  const syncCutsToBeats = useCallback(() => {\n    if (!activeBeatAnalysis || effectiveBeatCandidates.length === 0) {\n      toast({ title: "Analise a trilha primeiro", description: "Detecte as batidas antes de sincronizar os cortes." });\n      return;\n    }\n    if (clipsRef.current.length < 2) {\n      toast({ title: "Adicione mais clipes", description: "O Beat Sync precisa de pelo menos dois clipes para alinhar cortes." });\n      return;\n    }\n    if (!beatCutPreview.length) {\n      toast({ title: "Nenhum ajuste necessário", description: "Os cortes já estão no ritmo, estão bloqueados ou ficaram fora da tolerância escolhida." });\n      return;\n    }\n\n    const nextClips = clipsRef.current.map((clip) => ({ ...clip }));\n    for (const item of beatCutPreview) {\n      const clip = nextClips[item.index];\n      if (!clip || clip.id !== item.clipId || clip.beatLocked) continue;\n      const boundary = clipStartAt(item.index + 1, nextClips);\n      const nextTrimOut = clamp(clip.trimOut + (item.target - boundary), clip.trimIn + 0.25, clip.sourceDuration);\n      const accent: Partial<VideoClip> = {};\n      if (syncVisualAccents && item.downbeat) {\n        if (beatSyncStrength === "light") { accent.transitionOut = "fade"; accent.transitionDuration = 0.2; }\n        else if (beatSyncStrength === "aggressive") { accent.transitionOut = "zoom"; accent.transitionDuration = 0.34; }\n        else { accent.transitionOut = "crossfade"; accent.transitionDuration = 0.28; }\n      }\n      nextClips[item.index] = { ...clip, trimOut: nextTrimOut, ...accent };\n      if (syncVisualAccents && item.downbeat && beatSyncStrength === "aggressive") {\n        const following = nextClips[item.index + 1];\n        if (following && !following.beatLocked && (following.motion ?? "none") === "none") {\n          nextClips[item.index + 1] = { ...following, motion: item.index % 2 === 0 ? "zoom-in" : "zoom-out" };\n        }\n      }\n    }\n\n    const visualTolerance = beatSyncStrength === "light" ? 0.12 : beatSyncStrength === "aggressive" ? 0.34 : 0.22;\n    let visualAccents = 0;\n    const nextLayers = layersRef.current.map((layer) => {\n      if (!syncVisualAccents) return layer;\n      let nearest = effectiveBeatCandidates[0] ?? layer.start;\n      let distance = Math.abs(nearest - layer.start);\n      for (const candidate of effectiveBeatCandidates) {\n        const nextDistance = Math.abs(candidate - layer.start);\n        if (nextDistance < distance) { nearest = candidate; distance = nextDistance; }\n      }\n      if (distance > visualTolerance) return layer;\n      const isStrong = downbeatTimes.some((time) => Math.abs(time - nearest) < 0.03);\n      if (layer.contentKind === "caption") {\n        if (!isStrong) return layer;\n        visualAccents += 1;\n        return { ...layer, enterAnimation: "pop" as LayerAnimation, animationDuration: Math.min(layer.animationDuration ?? 0.35, 0.22) };\n      }\n      const duration = Math.max(0.1, layer.end - layer.start);\n      const shiftedStart = clamp(nearest, 0, Math.max(0, projectDurationFor(nextClips) - duration));\n      if (Math.abs(shiftedStart - layer.start) < 0.01 && !isStrong) return layer;\n      visualAccents += 1;\n      return {\n        ...layer,\n        start: shiftedStart,\n        end: shiftedStart + duration,\n        enterAnimation: isStrong ? (beatSyncStrength === "aggressive" ? "zoom" : "pop") as LayerAnimation : layer.enterAnimation,\n        animationDuration: isStrong ? Math.min(layer.animationDuration ?? 0.35, 0.24) : layer.animationDuration,\n      };\n    });\n\n    commitEditor(nextClips, nextLayers);\n    const nextDuration = projectDurationFor(nextClips);\n    setTimelineTime((time) => clamp(time, 0, Math.max(0, nextDuration)));\n    setMusicEnd((current) => Math.min(current, Math.max(0.1, nextDuration)));\n    toast({ title: "Beat Sync avançado aplicado", description: `${beatCutPreview.length} corte${beatCutPreview.length === 1 ? "" : "s"} alinhado${beatCutPreview.length === 1 ? "" : "s"}${visualAccents ? ` · ${visualAccents} acento${visualAccents === 1 ? "" : "s"} visual${visualAccents === 1 ? "" : "is"}` : ""}.` });\n  }, [activeBeatAnalysis, beatCutPreview, beatSyncStrength, commitEditor, downbeatTimes, effectiveBeatCandidates, syncVisualAccents, toast]);'''
              text = text[:start] + new_sync + text[end:]

              # Save advanced state; bump version.
              rep('''    editorVersion: 12,''', '''    editorVersion: 13,''')
              rep('''        step: beatStep,\n        showMarkers: showBeatMarkers,\n        waveform: activeBeatAnalysis.waveform,''', '''        step: beatStep,\n        showMarkers: showBeatMarkers,\n        waveform: activeBeatAnalysis.waveform,\n        downbeatIndex: activeBeatAnalysis.downbeatIndex,\n        strength: beatSyncStrength,\n        manualMarkers: manualBeatMarkers,\n        syncVisualAccents,''')
              # Dependencies serialized context ending.
              rep('''activeBeatAnalysis, beatStep, showBeatMarkers]);''', '''activeBeatAnalysis, beatStep, showBeatMarkers, beatSyncStrength, manualBeatMarkers, syncVisualAccents]);''')

              # Metadata fallback downbeatIndex.
              rep('''source: "metadata", waveform: [] });''', '''source: "metadata", waveform: [], downbeatIndex: 0 });''')

              # Restore clip beat lock.
              rep('''              motion: (["none", "zoom-in", "zoom-out", "pan-left", "pan-right"] as string[]).includes(String(raw.motion)) ? raw.motion as ClipMotion : "none",\n            };''', '''              motion: (["none", "zoom-in", "zoom-out", "pan-left", "pan-right"] as string[]).includes(String(raw.motion)) ? raw.motion as ClipMotion : "none",\n              beatLocked: raw.beatLocked === true,\n            };''')
              # Restore analysis + advanced settings.
              rep('''            waveform: Array.isArray(savedBeatSync.waveform) ? savedBeatSync.waveform.map((value: unknown) => clamp(Number(value) || 0, 0, 1)).slice(0, 160) : [],\n          });\n          if ([1, 2, 4].includes(Number(savedBeatSync.step))) setBeatStep(Number(savedBeatSync.step) as BeatStep);\n          if (typeof savedBeatSync.showMarkers === "boolean") setShowBeatMarkers(savedBeatSync.showMarkers);''', '''            waveform: Array.isArray(savedBeatSync.waveform) ? savedBeatSync.waveform.map((value: unknown) => clamp(Number(value) || 0, 0, 1)).slice(0, 160) : [],\n            downbeatIndex: [0, 1, 2, 3].includes(Number(savedBeatSync.downbeatIndex)) ? Number(savedBeatSync.downbeatIndex) : 0,\n          });\n          if ([1, 2, 4].includes(Number(savedBeatSync.step))) setBeatStep(Number(savedBeatSync.step) as BeatStep);\n          if (typeof savedBeatSync.showMarkers === "boolean") setShowBeatMarkers(savedBeatSync.showMarkers);\n          if (["light", "balanced", "aggressive"].includes(String(savedBeatSync.strength))) setBeatSyncStrength(savedBeatSync.strength as BeatSyncStrength);\n          if (Array.isArray(savedBeatSync.manualMarkers)) setManualBeatMarkers(savedBeatSync.manualMarkers.map((time: unknown) => Math.max(0, Number(time) || 0)).slice(0, 80).sort((a: number, b: number) => a - b));\n          if (typeof savedBeatSync.syncVisualAccents === "boolean") setSyncVisualAccents(savedBeatSync.syncVisualAccents);''')

              # Clip lock UI.
              rep('''      <div className="rounded-xl border bg-muted/30 p-3 text-xs text-muted-foreground"><p className="font-medium text-foreground">Corte individual</p><p className="mt-1">O arquivo original não é alterado. O editor usa apenas o trecho definido abaixo.</p></div>\n      <RangeField label="Entrada"''', '''      <div className="rounded-xl border bg-muted/30 p-3 text-xs text-muted-foreground"><p className="font-medium text-foreground">Corte individual</p><p className="mt-1">O arquivo original não é alterado. O editor usa apenas o trecho definido abaixo.</p></div>\n      <label className="flex items-center justify-between gap-3 rounded-xl border bg-background p-3 text-xs"><span><strong className="block">Bloquear no Beat Sync</strong><span className="text-[10px] text-muted-foreground">Mantém este clipe e suas bordas exatamente onde estão.</span></span><input type="checkbox" checked={selectedClip.beatLocked === true} onChange={(event) => updateClip({ beatLocked: event.target.checked })} className="accent-primary" /></label>\n      <RangeField label="Entrada"''')

              # Append lock marker in timeline label.
              rep('''{index + 1}. {clip.name}{(clip.transitionOut ?? "cut") !== "cut" ? ` · ${transitionLabel(clip.transitionOut)}` : ""}</span>''', '''{index + 1}. {clip.name}{clip.beatLocked ? " · 🔒" : ""}{(clip.transitionOut ?? "cut") !== "cut" ? ` · ${transitionLabel(clip.transitionOut)}` : ""}</span>''')

              # Advanced UI before current sync button. Exact anchor from audio block.
              anchor = '''<button type="button" onClick={syncCutsToBeats} disabled={clips.length < 2} className="w-full rounded-lg bg-amber-600 px-3 py-2.5 text-xs font-semibold text-white disabled:opacity-40"><Scissors className="mr-1.5 inline h-3.5 w-3.5" />Sincronizar cortes com batidas</button>'''
              replacement = '''<label className="block space-y-1"><span className="text-[10px] text-muted-foreground">Intensidade do Beat Sync</span><select value={beatSyncStrength} onChange={(event) => setBeatSyncStrength(event.target.value as BeatSyncStrength)} className="h-8 w-full rounded-lg border bg-background px-2 text-[11px]"><option value="light">Leve · ajustes discretos</option><option value="balanced">Equilibrado · recomendado</option><option value="aggressive">Agressivo · ritmo forte</option></select></label><label className="flex items-center justify-between gap-3 rounded-lg border bg-background px-2.5 py-2 text-[10px]"><span>Acentuar transições e elementos nos downbeats</span><input type="checkbox" checked={syncVisualAccents} onChange={(event) => setSyncVisualAccents(event.target.checked)} className="accent-primary" /></label><div className="space-y-2 rounded-lg border bg-background p-2.5"><div className="flex items-center justify-between gap-2"><div><p className="text-[10px] font-semibold">Marcadores manuais</p><p className="text-[9px] text-muted-foreground">Fixe momentos importantes que o Beat Sync deve considerar.</p></div><button type="button" onClick={addManualBeatMarker} className="rounded-md border px-2 py-1 text-[9px] font-medium">+ No cursor</button></div>{manualBeatMarkers.length > 0 && <div className="flex flex-wrap gap-1">{manualBeatMarkers.map((marker) => <button key={marker} type="button" onClick={() => setManualBeatMarkers((current) => current.filter((time) => time !== marker))} className="rounded-full border px-1.5 py-0.5 text-[9px] tabular-nums" title="Remover marcador">{timeLabel(marker)} ×</button>)}<button type="button" onClick={() => setManualBeatMarkers([])} className="rounded-full px-1.5 py-0.5 text-[9px] text-muted-foreground underline">limpar</button></div>}</div><div className="rounded-lg border bg-background p-2.5"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-semibold">Prévia antes de aplicar</span><span className="rounded-full bg-amber-500/10 px-2 py-0.5 text-[9px] font-semibold text-amber-700 dark:text-amber-300">{beatCutPreview.length} corte{beatCutPreview.length === 1 ? "" : "s"}</span></div>{beatCutPreview.length > 0 ? <div className="mt-2 space-y-1">{beatCutPreview.slice(0, 5).map((item) => <div key={`${item.clipId}-${item.target}`} className="flex items-center justify-between gap-2 text-[9px]"><span className="truncate">Corte {item.index + 1} → {item.index + 2}{item.manual ? " · manual" : item.downbeat ? " · downbeat" : ""}</span><span className="shrink-0 tabular-nums text-muted-foreground">{item.delta >= 0 ? "+" : ""}{Math.round(item.delta * 1000)} ms</span></div>)}{beatCutPreview.length > 5 && <p className="text-[9px] text-muted-foreground">+ {beatCutPreview.length - 5} ajustes adicionais</p>}</div> : <p className="mt-1 text-[9px] text-muted-foreground">Nenhum corte será movido com a configuração atual. Clipes bloqueados são ignorados.</p>}</div><button type="button" onClick={syncCutsToBeats} disabled={clips.length < 2 || beatCutPreview.length === 0} className="w-full rounded-lg bg-amber-600 px-3 py-2.5 text-xs font-semibold text-white disabled:opacity-40"><Scissors className="mr-1.5 inline h-3.5 w-3.5" />Aplicar Beat Sync{beatCutPreview.length ? ` · ${beatCutPreview.length}` : ""}</button>'''
              rep(anchor, replacement)

              # Make strong beat styling actually use downbeats instead of index modulo 4, and render manual markers.
              rep('''index % 4 === 0 ? "w-[2px]" : "w-px"''', '''downbeatTimes.some((time) => Math.abs(time - beat) < 0.025) ? "w-[2px] opacity-100" : "w-px opacity-70"''', 2)
              # Inject manual marker spans in video/audio tracks before beat markers.
              rep('''>{showBeatMarkers && activeBeatAnalysis && beatTimes.map((beat, index) => <span key={`video-beat-${beat.toFixed(3)}-${index}`}''', '''>{showBeatMarkers && manualBeatMarkers.map((marker) => <span key={`video-manual-${marker}`} className="pointer-events-none absolute inset-y-0 z-10 w-[2px] border-l border-dashed border-cyan-400" style={{ left: `${clamp(marker / projectDuration * 100, 0, 100)}%` }} />)}{showBeatMarkers && activeBeatAnalysis && beatTimes.map((beat, index) => <span key={`video-beat-${beat.toFixed(3)}-${index}`}''')
              rep('''>{showBeatMarkers && activeBeatAnalysis && beatTimes.map((beat, index) => <span key={`audio-beat-${beat.toFixed(3)}-${index}`}''', '''>{showBeatMarkers && manualBeatMarkers.map((marker) => <span key={`audio-manual-${marker}`} className="pointer-events-none absolute inset-y-0 z-10 w-[2px] border-l border-dashed border-cyan-300" style={{ left: `${clamp(marker / projectDuration * 100, 0, 100)}%` }} />)}{showBeatMarkers && activeBeatAnalysis && beatTimes.map((beat, index) => <span key={`audio-beat-${beat.toFixed(3)}-${index}`}''')

              p.write_text(text)

          git config user.name "vendorai-automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat(video): add advanced beat sync controls"
          git push origin HEAD:feat/video-beat-sync-advanced
