name: tmp-sfx-climax
on:
  push:
    branches: [feat/video-sfx-climax]
    paths: [.tmp-sfx-run]
permissions:
  contents: write
jobs:
  patch-and-validate:
    if: github.actor != 'vendorai-automation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-sfx-climax
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: python .tmp-sfx-climax.py
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/frontend run build
      - run: |
          git config user.name vendorai-automation
          git config user.email vendorai-automation@users.noreply.github.com
          git add artifacts/frontend/src/components/video/VideoTimelineEditor.tsx
          git diff --cached --quiet || (git commit -m "feat(video): add SFX cues and climax intelligence" && git push origin HEAD:feat/video-sfx-climax)
