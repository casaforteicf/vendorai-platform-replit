name: Cloudflare API Container
# Manual alternate production deploy marker: 2026-09-29-1805

# Production API is deployed on Cloudflare Containers from main.
# Pull requests validate the container build; pushes to main deploy automatically.
on:
  push:
    branches: [main]
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "lib/vendor-brain/**"
      - "lib/integrations-anthropic-ai/**"
      - "cloudflare/api-worker/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/cloudflare-api-container.yml"
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "lib/vendor-brain/**"
      - "lib/integrations-anthropic-ai/**"
      - "cloudflare/api-worker/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/cloudflare-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  statuses: write

concurrency:
  group: cloudflare-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate VendorAI Cloudflare container
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API container image
        run: docker build -f cloudflare/api-worker/Dockerfile -t vendorai-api:validation .

  deploy:
    name: Deploy VendorAI API on Cloudflare
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Worker and Container
        id: deploy
        continue-on-error: true
        working-directory: cloudflare/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)
          if [ -z "$worker_url" ]; then
            echo "Could not determine Worker URL from Wrangler output."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare API health
        id: verify_cloudflare
        if: steps.deploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$WORKER_URL/api/healthz" || true)
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Cloudflare health attempt $attempt returned HTTP ${status:-000}"
            sleep 10
          done
          echo "Cloudflare API did not become healthy in time."
          cat /tmp/health.json 2>/dev/null || true
          exit 1

      - name: Automatic provider failover — verify Railway primary
        id: railway_fallback
        if: steps.deploy.outcome != 'success' || steps.verify_cloudflare.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
          API_HEALTH_URL: https://vendorai-platform-replit-production.up.railway.app/api/auth/healthz
        run: |
          set -euo pipefail
          for attempt in {1..24}; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 5 --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$API_HEALTH_URL" || true)"
            health="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
            rev="$(awk 'BEGIN{IGNORECASE=1} /^X-VendorAI-Revision:/ {gsub("\\r","",$2); print $2}' "$headers" | tail -1)"
            rm -f "$headers" "$body"
            echo "Railway fallback attempt=$attempt http=$code health=$health revision=$rev expected=$EXPECTED"
            if [ "$code" = 200 ] && [ "$health" = ok ] && { [ "$rev" = "$EXPECTED" ] || [[ "$EXPECTED" == "$rev"* ]] || [[ "$rev" == "$EXPECTED"* ]]; }; then
              echo "provider=railway" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Automatic provider failover — redeploy Railway
        id: railway_redeploy
        if: (steps.deploy.outcome != 'success' || steps.verify_cloudflare.outcome != 'success') && steps.railway_fallback.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ] || [ -z "${RAILWAY_PROJECT_ID:-}" ] || [ -z "${RAILWAY_SERVICE_ID:-}" ] || [ -z "${RAILWAY_ENVIRONMENT_ID:-}" ]; then
            echo "Railway redeploy credentials/IDs are not configured in GitHub secrets; skipping active redeploy."
            exit 1
          fi
          npm install -g @railway/cli
          railway redeploy --yes --project "$RAILWAY_PROJECT_ID" --service "$RAILWAY_SERVICE_ID" --environment "$RAILWAY_ENVIRONMENT_ID"

      - name: Automatic provider failover — recheck Railway after redeploy
        id: railway_recheck
        if: steps.railway_redeploy.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED: ${{ github.sha }}
          API_HEALTH_URL: https://vendorai-platform-replit-production.up.railway.app/api/auth/healthz
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            headers="$(mktemp)"
            body="$(mktemp)"
            code="$(curl -sS --connect-timeout 5 --max-time 15 -D "$headers" -o "$body" -w '%{http_code}' "$API_HEALTH_URL" || true)"
            health="$(jq -r '.status // empty' "$body" 2>/dev/null || true)"
            rev="$(awk 'BEGIN{IGNORECASE=1} /^X-VendorAI-Revision:/ {gsub("\\r","",$2); print $2}' "$headers" | tail -1)"
            rm -f "$headers" "$body"
            echo "Railway recheck attempt=$attempt http=$code health=$health revision=$rev"
            if [ "$code" = 200 ] && [ "$health" = ok ] && { [ "$rev" = "$EXPECTED" ] || [[ "$EXPECTED" == "$rev"* ]] || [[ "$rev" == "$EXPECTED"* ]]; }; then
              echo "provider=railway-redeploy" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Automatic provider failover — dispatch fullstack alternative
        id: fullstack_alt
        if: (steps.deploy.outcome != 'success' || steps.verify_cloudflare.outcome != 'success') && steps.railway_fallback.outcome != 'success' && steps.railway_recheck.outcome != 'success'
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EXPECTED: ${{ github.sha }}
        run: |
          set -euo pipefail
          before="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run cloudflare-fullstack-alt.yml --repo "$REPO" --ref main
          run_id=""
          for attempt in {1..24}; do
            runs="$(gh api "repos/$REPO/actions/workflows/cloudflare-fullstack-alt.yml/runs?event=workflow_dispatch&branch=main&per_page=10")"
            run_id="$(jq -r --arg before "$before" '.workflow_runs | map(select(.created_at >= $before)) | .[0].id // empty' <<<"$runs")"
            [ -n "$run_id" ] && break
            sleep 5
          done
          test -n "$run_id"
          for attempt in {1..120}; do
            run="$(gh api "repos/$REPO/actions/runs/$run_id")"
            status="$(jq -r .status <<<"$run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$run")"
            echo "fullstack-alt run=$run_id status=$status conclusion=$conclusion"
            if [ "$status" = completed ]; then
              test "$conclusion" = success
              echo "provider=cloudflare-fullstack-alt" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Resolve production provider
        shell: bash
        env:
          CF_DEPLOY: ${{ steps.deploy.outcome }}
          CF_VERIFY: ${{ steps.verify_cloudflare.outcome }}
          RAILWAY: ${{ steps.railway_fallback.outcome }}
          RAILWAY_RECHECK: ${{ steps.railway_recheck.outcome }}
          ALT: ${{ steps.fullstack_alt.outcome }}
        run: |
          set -euo pipefail
          if [ "$CF_DEPLOY" = success ] && [ "$CF_VERIFY" = success ]; then
            echo "✅ Provider ativo: Cloudflare API Container"
            exit 0
          fi
          if [ "$RAILWAY" = success ]; then
            echo "✅ Cloudflare falhou, mas Railway já está saudável na revisão correta. Failover automático concluído."
            exit 0
          fi
          if [ "$RAILWAY_RECHECK" = success ]; then
            echo "✅ Railway foi reimplantado automaticamente e assumiu a revisão correta."
            exit 0
          fi
          if [ "$ALT" = success ]; then
            echo "✅ Provider alternativo Cloudflare Fullstack assumiu após falhas anteriores."
            exit 0
          fi
          echo "::error::Todos os caminhos automáticos de publicação falharam: Cloudflare API, Railway e Cloudflare Fullstack alternativo."
          exit 1
