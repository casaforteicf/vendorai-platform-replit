name: Cloudflare API Container

# Production backend remains on Railway while Cloudflare Containers deployment is blocked.
# Pull requests still validate the container build. Cloudflare deploy is manual only.
on:
  pull_request:
    paths:
      - "artifacts/api-server/**"
      - "lib/db/**"
      - "lib/api-zod/**"
      - "lib/vendor-brain/**"
      - "lib/integrations-anthropic-ai/**"
      - "cloudflare/api-worker/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - ".node-version"
      - ".github/workflows/cloudflare-api-container.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate VendorAI Cloudflare container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build API container image
        run: docker build -f cloudflare/api-worker/Dockerfile -t vendorai-api:validation .

  deploy:
    name: Deploy VendorAI API on Cloudflare
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Validate Cloudflare deploy secrets
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy Worker and Container
        id: deploy
        working-directory: cloudflare/api-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          pnpm dlx wrangler@4 deploy 2>&1 | tee /tmp/wrangler-deploy.log
          worker_url=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -n 1 || true)
          if [ -z "$worker_url" ]; then
            echo "Could not determine Worker URL from Wrangler output."
            exit 1
          fi
          echo "worker_url=$worker_url" >> "$GITHUB_OUTPUT"

      - name: Verify Cloudflare API health
        shell: bash
        env:
          WORKER_URL: ${{ steps.deploy.outputs.worker_url }}
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            status=$(curl -sS -o /tmp/health.json -w '%{http_code}' "$WORKER_URL/api/healthz" || true)
            if [ "$status" = "200" ]; then
              cat /tmp/health.json
              exit 0
            fi
            echo "Health attempt $attempt returned HTTP ${status:-000}"
            sleep 10
          done
          echo "Cloudflare API did not become healthy in time."
          cat /tmp/health.json 2>/dev/null || true
          exit 1
