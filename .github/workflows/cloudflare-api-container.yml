# INF-04/INF-12/INF-15: disabled historical backend deployment path.
# Official backend: Contabo Docker. Frontend: Cloudflare Pages.
# This workflow intentionally performs no deployments and is manual-only.
# Preserve history in Git; never fall back to Railway or Cloudflare API Containers.
name: Legacy Cloudflare API deployment disabled

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  legacy-disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Explain archival state
        run: |
          echo "Legacy Cloudflare API Container deployment is disabled."
          echo "Backend releases must use the existing Contabo homologation and approved release operator."
          echo "No changes were made to Contabo or Cloudflare."
