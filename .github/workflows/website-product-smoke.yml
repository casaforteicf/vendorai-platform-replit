name: Website Product Routes Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "artifacts/website/**"
      - ".github/workflows/website-product-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Validate public routes and SEO in production
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for exact commit on edge when website changed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          changed=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}" \
            | jq -r '.files[]?.filename')

          if ! grep -q '^artifacts/website/' <<<"$changed"; then
            echo "No website artifact changed in this commit; validating current production edge."
            exit 0
          fi

          for attempt in $(seq 1 48); do
            deployed=$(curl -fsS -H 'Cache-Control: no-cache' "https://appvendorai.com/deployment-version.txt?sha=${GITHUB_SHA}&attempt=${attempt}" 2>/dev/null | tr -d '\r\n' || true)
            echo "Edge version: ${deployed:-pending} (expected ${GITHUB_SHA})"
            if [ "$deployed" = "$GITHUB_SHA" ]; then
              echo "Exact commit is live on Cloudflare edge."
              exit 0
            fi
            sleep 5
          done
          echo "Timed out waiting for ${GITHUB_SHA} on Cloudflare edge."
          exit 1

      - name: Validate public routes and edge SEO
        shell: bash
        run: |
          set -euo pipefail

          check_page() {
            path="$1"
            canonical="$2"
            url="https://appvendorai.com${path}?smoke=${GITHUB_SHA}"
            status=$(curl -sS -H 'Accept: text/html' -D /tmp/headers.txt -o /tmp/page.html -w '%{http_code}' "$url")
            echo "$path -> HTTP $status"
            test "$status" = "200"
            grep -q 'id="root"' /tmp/page.html
            grep -q 'data-vendorai-prerender="edge"' /tmp/page.html
            grep -q '<h1' /tmp/page.html
            grep -q 'href="/' /tmp/page.html
            grep -q "rel=\"canonical\" href=\"${canonical}\"" /tmp/page.html
            grep -q 'name="description"' /tmp/page.html
            grep -q 'application/ld+json' /tmp/page.html
            grep -q 'hreflang="pt-BR"' /tmp/page.html
            grep -q 'hreflang="es-AR"' /tmp/page.html
            grep -qi '^X-Robots-Tag: index, follow' /tmp/headers.txt
          }

          check_page "/" "https://appvendorai.com/"
          check_page "/produtos" "https://appvendorai.com/produtos"
          check_page "/produtos/crm" "https://appvendorai.com/produtos/crm"
          grep -q 'Como se encaixa na operação' /tmp/page.html
          check_page "/produtos/revenue-scout" "https://appvendorai.com/produtos/revenue-scout"
          check_page "/imprensa" "https://appvendorai.com/imprensa"
          grep -q 'Informações oficiais para citar o VendorAI' /tmp/page.html
          grep -q '59.623.589/0001-27' /tmp/page.html
          check_page "/lp/moda" "https://appvendorai.com/lp/moda"
          grep -q '"@type":"FAQPage"' /tmp/page.html
          grep -q 'Operação comercial conectada' /tmp/page.html
          check_page "/lp/distribuidora-materiais-construcao" "https://appvendorai.com/lp/distribuidora-materiais-construcao"
          grep -q '<title>CRM com IA para Distribuidoras de materiais de construção | VendorAI</title>' /tmp/page.html
          grep -q 'Prever recompra, identificar queda e expandir mix' /tmp/page.html
          grep -q '"@type":"FAQPage"' /tmp/page.html
          grep -q '"keywords":"CRM distribuidora construção' /tmp/page.html
          check_page "/solucoes" "https://appvendorai.com/solucoes"
          grep -q '"@type":"ItemList"' /tmp/page.html
          check_page "/comparar" "https://appvendorai.com/comparar"
          grep -q '"@type":"ItemList"' /tmp/page.html
          check_page "/solucoes/crm-whatsapp" "https://appvendorai.com/solucoes/crm-whatsapp"
          grep -q '"@type":"FAQPage"' /tmp/page.html
          grep -q '"relatedLink"' /tmp/page.html
          grep -q 'Transforme conversas do WhatsApp em uma operação comercial acompanhada até a venda' /tmp/page.html
          check_page "/comparar/crm-com-ia-vs-crm-tradicional" "https://appvendorai.com/comparar/crm-com-ia-vs-crm-tradicional"
          grep -q '"@type":"FAQPage"' /tmp/page.html
          check_page "/solucoes/propostas-sem-resposta" "https://appvendorai.com/solucoes/propostas-sem-resposta"
          check_page "/solucoes/pipeline-vendas-com-ia" "https://appvendorai.com/solucoes/pipeline-vendas-com-ia"
          check_page "/comparar/crm-whatsapp-vs-planilha" "https://appvendorai.com/comparar/crm-whatsapp-vs-planilha"
          check_page "/comparar/revenue-intelligence-vs-bi" "https://appvendorai.com/comparar/revenue-intelligence-vs-bi"

          curl -sS -H 'Accept: text/html' 'https://appvendorai.com/solucoes/propostas-sem-resposta?country=AR' -o /tmp/ar.html
          grep -q 'lang="es-AR"' /tmp/ar.html
          grep -q 'rel="canonical" href="https://appvendorai.com/solucoes/propostas-sem-resposta?country=AR"' /tmp/ar.html
          grep -q '<title>Propuesta Sin Respuesta: Seguimiento con CRM e IA | VendorAI</title>' /tmp/ar.html
          grep -q '"@type":"FAQPage"' /tmp/ar.html
          grep -q 'data-vendorai-prerender="edge"' /tmp/ar.html
          grep -q '<h1' /tmp/ar.html

          curl -sS -H 'Accept: text/html' 'https://appvendorai.com/lp/distribuidora-materiais-construcao?country=AR' -o /tmp/ar-vertical.html
          grep -q 'lang="es-AR"' /tmp/ar-vertical.html
          grep -q '<title>Distribuidoras de materiales de construcción — CRM e IA | VendorAI</title>' /tmp/ar-vertical.html
          grep -q 'Prever recompra, identificar caída y ampliar mix' /tmp/ar-vertical.html
          grep -q 'data-vendorai-prerender="edge"' /tmp/ar-vertical.html
          grep -q 'Operación comercial conectada' /tmp/ar-vertical.html
          ! grep -q '"@type":"FAQPage"' /tmp/ar-vertical.html

      - name: Validate sitemap coverage
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' "https://appvendorai.com/sitemap.xml?smoke=${GITHUB_SHA}" -o /tmp/sitemap.xml
          grep -q '<sitemapindex' /tmp/sitemap.xml

          : > /tmp/sitemap-all.xml
          for child in core products solutions segments content; do
            child_url="https://appvendorai.com/sitemap-${child}.xml?smoke=${GITHUB_SHA}"
            curl -fsS -H 'Cache-Control: no-cache' "$child_url" -o "/tmp/sitemap-${child}.xml"
            grep -q '<urlset' "/tmp/sitemap-${child}.xml"
            cat "/tmp/sitemap-${child}.xml" >> /tmp/sitemap-all.xml
          done

          grep -q '<loc>https://appvendorai.com/imprensa</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/produtos/crm</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/produtos/jarvis</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/produtos/revenue-scout</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/lp/moda</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/lp/distribuidora-materiais-construcao</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/solucoes</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/comparar</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/solucoes/crm-whatsapp</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/solucoes/automatizar-follow-up</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/solucoes/propostas-sem-resposta</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/solucoes/qualificar-leads-com-ia</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/solucoes/reduzir-churn</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/solucoes/previsao-de-vendas</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/comparar/crm-com-ia-vs-crm-tradicional</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/comparar/prospeccao-com-ia-vs-manual</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/comparar/crm-whatsapp-vs-planilha</loc>' /tmp/sitemap-all.xml
          grep -q '<loc>https://appvendorai.com/comparar/revenue-intelligence-vs-bi</loc>' /tmp/sitemap-all.xml
          grep -q 'hreflang="es-PY"' /tmp/sitemap-all.xml
          grep -q 'hreflang="x-default"' /tmp/sitemap-all.xml
          count=$(grep -o '<url>' /tmp/sitemap-all.xml | wc -l | tr -d ' ')
          echo "Sitemap URLs across children: $count"
          test "$count" -eq 143

      - name: Validate noindex and true 404 behavior
        shell: bash
        run: |
          set -euo pipefail
          status=$(curl -sS -H 'Accept: text/html' -D /tmp/demo-headers.txt -o /tmp/demo.html -w '%{http_code}' 'https://appvendorai.com/demo')
          test "$status" = "200"
          grep -qi '^X-Robots-Tag: noindex, follow' /tmp/demo-headers.txt
          grep -q 'name="robots" content="noindex, follow"' /tmp/demo.html

          status=$(curl -sS -H 'Accept: text/html' -D /tmp/404-headers.txt -o /tmp/404.html -w '%{http_code}' "https://appvendorai.com/seo-smoke-missing-${GITHUB_SHA}")
          echo "Unknown route -> HTTP $status"
          test "$status" = "404"
          grep -qi '^X-Robots-Tag: noindex, follow' /tmp/404-headers.txt
          grep -q 'name="robots" content="noindex, follow"' /tmp/404.html

      - name: Validate canonical redirects
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' 'https://www.appvendorai.com/produtos/crm')
          test "$code" = "301"
          location=$(curl -sSI 'https://www.appvendorai.com/produtos/crm' | tr -d '\r' | awk 'tolower($1)=="location:" {print $2}' | tail -1)
          test "$location" = 'https://appvendorai.com/produtos/crm'

          code=$(curl -sS -o /dev/null -w '%{http_code}' 'https://appvendorai.com/produtos/crm/')
          test "$code" = "301"
