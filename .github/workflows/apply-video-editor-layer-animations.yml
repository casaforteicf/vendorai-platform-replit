name: Apply video editor layer animations

on:
  push:
    branches:
      - feat/video-editor-layer-animations-captions

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-editor-layer-animations-captions
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted editor patch
        run: python .github/scripts/patch_video_editor_layer_animations.py
      - name: Remove temporary patch files
        run: |
          rm .github/scripts/patch_video_editor_layer_animations.py
          rm .github/workflows/apply-video-editor-layer-animations.yml
      - name: Commit result
        run: |
          git config user.name "vendorai-automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add artifacts/frontend/src/components/video/VideoTimelineEditor.tsx .github/scripts/patch_video_editor_layer_animations.py .github/workflows/apply-video-editor-layer-animations.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat(video): animações de camadas e legendas modernas"
            git push origin HEAD:feat/video-editor-layer-animations-captions
          fi
