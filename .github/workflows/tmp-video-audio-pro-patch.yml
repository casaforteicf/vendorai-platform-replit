name: tmp-video-audio-pro-patch
on:
  push:
    branches: [feat/video-audio-pro]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/video-audio-pro
          fetch-depth: 0
      - name: Apply Audio Pro patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          front = Path('artifacts/frontend/src/components/video/VideoTimelineEditor.tsx')
          text = front.read_text()
          if 'type AudioMixPreset =' in text:
              print('Audio Pro already applied')
          else:
              def rep(old, new, count=1):
                  global text
                  if old not in text:
                      raise SystemExit('Missing anchor:\n' + old[:240])
                  text = text.replace(old, new, count)

              rep('''type BeatStep = 1 | 2 | 4;\n\ntype BeatAnalysis = {\n  trackKey: string;\n  bpm: number;\n  offset: number;\n  confidence: number;\n  source: "audio" | "metadata";\n};''', '''type BeatStep = 1 | 2 | 4;\ntype AudioMixPreset = "voice" | "balanced" | "institutional" | "music";\n\ntype MusicVolumePoint = {\n  id: string;\n  time: number;\n  value: number;\n};\n\ntype BeatAnalysis = {\n  trackKey: string;\n  bpm: number;\n  offset: number;\n  confidence: number;\n  source: "audio" | "metadata";\n  waveform: number[];\n};''')

              rep('''const MUSIC_BPM_BY_CHANNEL: Record<string, [number, number]> = {\n  reels: [100, 135],\n  shorts: [100, 135],\n  stories: [95, 130],\n  feed: [90, 125],\n  whatsapp: [90, 125],\n  youtube: [80, 120],\n  site: [80, 115],\n};''', '''const MUSIC_BPM_BY_CHANNEL: Record<string, [number, number]> = {\n  reels: [100, 135],\n  shorts: [100, 135],\n  stories: [95, 130],\n  feed: [90, 125],\n  whatsapp: [90, 125],\n  youtube: [80, 120],\n  site: [80, 115],\n};\n\nconst AUDIO_MIX_PRESETS: Array<{ id: AudioMixPreset; label: string; hint: string; original: number; music: number; duck: number; fadeIn: number; fadeOut: number; lufs: number }> = [\n  { id: "voice", label: "Voz em foco", hint: "Locução sempre à frente", original: 1, music: 0.16, duck: 72, fadeIn: 0.6, fadeOut: 1.2, lufs: -16 },\n  { id: "balanced", label: "Social", hint: "Reels e anúncios equilibrados", original: 0.95, music: 0.24, duck: 58, fadeIn: 0.35, fadeOut: 0.8, lufs: -14 },\n  { id: "institutional", label: "Institucional", hint: "Trilha discreta e suave", original: 1, music: 0.14, duck: 66, fadeIn: 1, fadeOut: 1.8, lufs: -16 },\n  { id: "music", label: "Música forte", hint: "Conteúdo visual sem muita fala", original: 0.72, music: 0.42, duck: 35, fadeIn: 0.25, fadeOut: 0.7, lufs: -14 },\n];''')

              rep('''function analyzeAudioBufferBeats(buffer: AudioBuffer, bpmHint?: number | null): Omit<BeatAnalysis, "trackKey"> {''', '''function buildWaveformSamples(buffer: AudioBuffer, bins = 96): number[] {\n  const channel = buffer.getChannelData(0);\n  if (!channel.length) return [];\n  const samples: number[] = [];\n  const span = Math.max(1, Math.floor(channel.length / bins));\n  let maxPeak = 0;\n  for (let bin = 0; bin < bins; bin += 1) {\n    const start = bin * span;\n    const end = bin === bins - 1 ? channel.length : Math.min(channel.length, start + span);\n    let peak = 0;\n    for (let index = start; index < end; index += Math.max(1, Math.floor((end - start) / 180))) {\n      peak = Math.max(peak, Math.abs(channel[index] ?? 0));\n    }\n    samples.push(peak);\n    maxPeak = Math.max(maxPeak, peak);\n  }\n  return samples.map((peak) => Math.round((maxPeak > 0 ? peak / maxPeak : 0) * 1000) / 1000);\n}\n\nfunction smartLoopBounds(buffer: AudioBuffer): { start: number; end: number } {\n  const channel = buffer.getChannelData(0);\n  if (!channel.length || buffer.duration < 1.5) return { start: 0, end: buffer.duration };\n  const sampleRate = buffer.sampleRate;\n  const findCrossing = (target: number, radiusSeconds: number) => {\n    const center = clamp(Math.round(target * sampleRate), 1, channel.length - 2);\n    const radius = Math.max(1, Math.round(radiusSeconds * sampleRate));\n    let best = center;\n    let bestScore = Number.POSITIVE_INFINITY;\n    for (let index = Math.max(1, center - radius); index <= Math.min(channel.length - 2, center + radius); index += 1) {\n      const current = channel[index] ?? 0;\n      const previous = channel[index - 1] ?? 0;\n      const crossing = (previous <= 0 && current >= 0) || (previous >= 0 && current <= 0);\n      const score = Math.abs(current) + (crossing ? 0 : 0.4);\n      if (score < bestScore) { best = index; bestScore = score; }\n    }\n    return best / sampleRate;\n  };\n  const start = findCrossing(Math.min(0.35, buffer.duration * 0.05), 0.2);\n  const end = findCrossing(Math.max(start + 1, buffer.duration - 0.15), 0.25);\n  return end > start + 0.75 ? { start, end } : { start: 0, end: buffer.duration };\n}\n\nfunction volumeAtTime(points: MusicVolumePoint[], time: number, fallback: number): number {\n  if (!points.length) return fallback;\n  const sorted = [...points].sort((a, b) => a.time - b.time);\n  const first = sorted[0]!;\n  const last = sorted[sorted.length - 1]!;\n  if (time <= first.time) return first.value;\n  if (time >= last.time) return last.value;\n  for (let index = 0; index < sorted.length - 1; index += 1) {\n    const left = sorted[index]!;\n    const right = sorted[index + 1]!;\n    if (time < left.time || time > right.time) continue;\n    const progress = (time - left.time) / Math.max(0.001, right.time - left.time);\n    return left.value + (right.value - left.value) * progress;\n  }\n  return fallback;\n}\n\nfunction fadeMultiplier(time: number, start: number, end: number, fadeIn: number, fadeOut: number): number {\n  if (time < start || time > end) return 0;\n  const inMultiplier = fadeIn > 0 ? clamp((time - start) / fadeIn, 0, 1) : 1;\n  const outMultiplier = fadeOut > 0 ? clamp((end - time) / fadeOut, 0, 1) : 1;\n  return Math.min(inMultiplier, outMultiplier);\n}\n\nfunction analyzeAudioBufferBeats(buffer: AudioBuffer, bpmHint?: number | null): Omit<BeatAnalysis, "trackKey"> {''')

              rep('''    source: "audio",\n  };\n}\n\nfunction layerIsVisible''', '''    source: "audio",\n    waveform: buildWaveformSamples(buffer),\n  };\n}\n\nfunction layerIsVisible''')

              rep('''  const [beatStep, setBeatStep] = useState<BeatStep>(2);\n  const [showBeatMarkers, setShowBeatMarkers] = useState(true);\n\n  const [normalizeAudio, setNormalizeAudio] = useState(false);''', '''  const [beatStep, setBeatStep] = useState<BeatStep>(2);\n  const [showBeatMarkers, setShowBeatMarkers] = useState(true);\n  const [duckingEnabled, setDuckingEnabled] = useState(true);\n  const [duckingReduction, setDuckingReduction] = useState(62);\n  const [duckingThresholdPct, setDuckingThresholdPct] = useState(5);\n  const [duckingAttackMs, setDuckingAttackMs] = useState(120);\n  const [duckingReleaseMs, setDuckingReleaseMs] = useState(480);\n  const [musicFadeIn, setMusicFadeIn] = useState(0.5);\n  const [musicFadeOut, setMusicFadeOut] = useState(1);\n  const [smartMusicLoop, setSmartMusicLoop] = useState(true);\n  const [musicVolumePoints, setMusicVolumePoints] = useState<MusicVolumePoint[]>([]);\n  const [loudnessTarget, setLoudnessTarget] = useState(-14);\n\n  const [normalizeAudio, setNormalizeAudio] = useState(true);''')

              rep('''  const beatTimes = useMemo(() => {\n    if (!activeBeatAnalysis || musicMode === "none") return [];''', '''  const applyAudioMixPreset = useCallback((presetId: AudioMixPreset) => {\n    const preset = AUDIO_MIX_PRESETS.find((item) => item.id === presetId);\n    if (!preset) return;\n    setOriginalVolume(preset.original);\n    setMusicVolume(preset.music);\n    setDuckingReduction(preset.duck);\n    setMusicFadeIn(preset.fadeIn);\n    setMusicFadeOut(preset.fadeOut);\n    setLoudnessTarget(preset.lufs);\n    setDuckingEnabled(true);\n    setNormalizeAudio(true);\n    toast({ title: `Mix ${preset.label} aplicado`, description: "Volumes, ducking, fades e loudness foram ajustados." });\n  }, [toast]);\n\n  const addMusicVolumePoint = useCallback(() => {\n    const time = clamp(timelineTime, musicStart, Math.max(musicStart, musicEnd));\n    setMusicVolumePoints((current) => [...current.filter((point) => Math.abs(point.time - time) > 0.08), { id: uid("music-volume"), time, value: musicVolume }].sort((a, b) => a.time - b.time));\n  }, [musicEnd, musicStart, musicVolume, timelineTime]);\n\n  const beatTimes = useMemo(() => {\n    if (!activeBeatAnalysis || musicMode === "none") return [];''')

              rep('''    editorVersion: 11,''', '''    editorVersion: 12,''')
              rep('''      end: musicEnd,\n      beatSync: activeBeatAnalysis ? {''', '''      end: musicEnd,\n      ducking: { enabled: duckingEnabled, reduction: duckingReduction, thresholdPct: duckingThresholdPct, attackMs: duckingAttackMs, releaseMs: duckingReleaseMs },\n      fadeIn: musicFadeIn,\n      fadeOut: musicFadeOut,\n      smartLoop: smartMusicLoop,\n      volumePoints: musicVolumePoints,\n      loudnessTarget,\n      beatSync: activeBeatAnalysis ? {''')
              rep('''        showMarkers: showBeatMarkers,\n      } : null,''', '''        showMarkers: showBeatMarkers,\n        waveform: activeBeatAnalysis.waveform,\n      } : null,''')
              rep('''  }), [channel, ratio, quality, clips, layers, aiPlan, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd, activeBeatAnalysis, beatStep, showBeatMarkers]);''', '''  }), [channel, ratio, quality, clips, layers, aiPlan, musicMode, musicAssetId, musicVolume, originalVolume, musicStart, musicEnd, duckingEnabled, duckingReduction, duckingThresholdPct, duckingAttackMs, duckingReleaseMs, musicFadeIn, musicFadeOut, smartMusicLoop, musicVolumePoints, loudnessTarget, activeBeatAnalysis, beatStep, showBeatMarkers]);''')

              rep('''        setBeatAnalysis({ trackKey: currentMusicKey, bpm: bpmHint, offset: 0, confidence: 0.35, source: "metadata" });''', '''        setBeatAnalysis({ trackKey: currentMusicKey, bpm: bpmHint, offset: 0, confidence: 0.35, source: "metadata", waveform: [] });''')

              rep('''        if (Number.isFinite(Number(audio.end))) setMusicEnd(Number(audio.end));\n        const savedBeatSync''', '''        if (Number.isFinite(Number(audio.end))) setMusicEnd(Number(audio.end));\n        const savedDucking = audio.ducking && typeof audio.ducking === "object" ? audio.ducking : null;\n        if (savedDucking) {\n          if (typeof savedDucking.enabled === "boolean") setDuckingEnabled(savedDucking.enabled);\n          if (Number.isFinite(Number(savedDucking.reduction))) setDuckingReduction(clamp(Number(savedDucking.reduction), 0, 90));\n          if (Number.isFinite(Number(savedDucking.thresholdPct))) setDuckingThresholdPct(clamp(Number(savedDucking.thresholdPct), 1, 30));\n          if (Number.isFinite(Number(savedDucking.attackMs))) setDuckingAttackMs(clamp(Number(savedDucking.attackMs), 20, 600));\n          if (Number.isFinite(Number(savedDucking.releaseMs))) setDuckingReleaseMs(clamp(Number(savedDucking.releaseMs), 80, 1800));\n        }\n        if (Number.isFinite(Number(audio.fadeIn))) setMusicFadeIn(clamp(Number(audio.fadeIn), 0, 5));\n        if (Number.isFinite(Number(audio.fadeOut))) setMusicFadeOut(clamp(Number(audio.fadeOut), 0, 8));\n        if (typeof audio.smartLoop === "boolean") setSmartMusicLoop(audio.smartLoop);\n        if (Array.isArray(audio.volumePoints)) setMusicVolumePoints(audio.volumePoints.map((point: Partial<MusicVolumePoint>) => ({ id: String(point.id || uid("music-volume")), time: Math.max(0, Number(point.time) || 0), value: clamp(Number(point.value) || 0, 0, 1) })).sort((a: MusicVolumePoint, b: MusicVolumePoint) => a.time - b.time));\n        if (Number.isFinite(Number(audio.loudnessTarget))) setLoudnessTarget(clamp(Number(audio.loudnessTarget), -24, -8));\n        const savedBeatSync''')
              rep('''            source: savedBeatSync.source === "audio" ? "audio" : "metadata",\n          });''', '''            source: savedBeatSync.source === "audio" ? "audio" : "metadata",\n            waveform: Array.isArray(savedBeatSync.waveform) ? savedBeatSync.waveform.map((value: unknown) => clamp(Number(value) || 0, 0, 1)).slice(0, 160) : [],\n          });''')

              rep('''    form.append("normalize", String(normalizeAudio));\n    form.append("speed", speed);''', '''    form.append("normalize", String(normalizeAudio));\n    form.append("loudnessTarget", String(loudnessTarget));\n    form.append("speed", speed);''')

              rep('''      let musicSourceNode: AudioBufferSourceNode | null = null;\n      let originalGain: GainNode | null = null;\n      let overlapGain: GainNode | null = null;''', '''      let musicSourceNode: AudioBufferSourceNode | null = null;\n      let musicGainNode: GainNode | null = null;\n      let originalGain: GainNode | null = null;\n      let overlapGain: GainNode | null = null;\n      let originalAnalyser: AnalyserNode | null = null;\n      let analyserSamples: Float32Array<ArrayBuffer> | null = null;\n      let duckingLevel = 0;''')

              rep('''        originalGain.gain.value = originalVolume;\n        overlapGain.gain.value = 0;\n        source.connect(originalGain).connect(destination);\n        overlapSource.connect(overlapGain).connect(destination);''', '''        originalGain.gain.value = originalVolume;\n        overlapGain.gain.value = 0;\n        originalAnalyser = audioContext.createAnalyser();\n        originalAnalyser.fftSize = 512;\n        originalAnalyser.smoothingTimeConstant = 0.35;\n        analyserSamples = new Float32Array(originalAnalyser.fftSize);\n        source.connect(originalGain).connect(originalAnalyser);\n        overlapSource.connect(overlapGain).connect(originalAnalyser);\n        originalAnalyser.connect(destination);''')

              rep('''          musicSourceNode.buffer = buffer;\n          musicSourceNode.loop = true;\n          const musicGain = audioContext.createGain();\n          musicGain.gain.value = musicVolume;\n          musicSourceNode.connect(musicGain).connect(destination);''', '''          musicSourceNode.buffer = buffer;\n          musicSourceNode.loop = true;\n          if (smartMusicLoop) {\n            const loop = smartLoopBounds(buffer);\n            musicSourceNode.loopStart = loop.start;\n            musicSourceNode.loopEnd = loop.end;\n          }\n          musicGainNode = audioContext.createGain();\n          musicGainNode.gain.value = 0;\n          musicSourceNode.connect(musicGainNode).connect(destination);''')

              rep('''      const prepareRenderVideo = async (videoElement: HTMLVideoElement, clip: VideoClip, sourceTime: number) => {''', '''      const updateAudioMix = (globalTime: number) => {\n        if (!audioContext || !musicGainNode) return;\n        if (duckingEnabled && originalAnalyser && analyserSamples) {\n          originalAnalyser.getFloatTimeDomainData(analyserSamples);\n          let sum = 0;\n          for (const sample of analyserSamples) sum += sample * sample;\n          const rms = Math.sqrt(sum / Math.max(1, analyserSamples.length));\n          const target = rms >= duckingThresholdPct / 100 ? 1 : 0;\n          const seconds = target > duckingLevel ? duckingAttackMs / 1000 : duckingReleaseMs / 1000;\n          const alpha = 1 - Math.exp(-(1 / 30) / Math.max(0.01, seconds));\n          duckingLevel += (target - duckingLevel) * alpha;\n        } else {\n          duckingLevel = 0;\n        }\n        const automated = volumeAtTime(musicVolumePoints, globalTime, musicVolume);\n        const faded = fadeMultiplier(globalTime, musicStart, musicEnd, musicFadeIn, musicFadeOut);\n        const duckMultiplier = 1 - (duckingReduction / 100) * duckingLevel;\n        const targetGain = clamp(automated * faded * duckMultiplier, 0, 1.2);\n        musicGainNode.gain.setTargetAtTime(targetGain, audioContext.currentTime, 0.025);\n      };\n\n      const prepareRenderVideo = async (videoElement: HTMLVideoElement, clip: VideoClip, sourceTime: number) => {''')

              rep('''              drawFrame(globalTime, clipIndex, clipIndex + 1);\n            } else {''', '''              drawFrame(globalTime, clipIndex, clipIndex + 1);\n              updateAudioMix(globalTime);\n            } else {''')
              rep('''              drawFrame(globalTime, clipIndex);\n            }\n            setJobMessage''', '''              drawFrame(globalTime, clipIndex);\n              updateAudioMix(globalTime);\n            }\n            setJobMessage''')

              # Waveform preview inside Beat Sync analysis card.
              rep('''<p className="text-[9px] text-muted-foreground">{activeBeatAnalysis.source === "audio" ? "Forma de onda analisada" : "BPM do Music Hub"} · fase {activeBeatAnalysis.offset.toFixed(2)}s</p></div><button type="button" onClick={() => void analyzeMusicBeats()}''', '''<p className="text-[9px] text-muted-foreground">{activeBeatAnalysis.source === "audio" ? "Forma de onda analisada" : "BPM do Music Hub"} · fase {activeBeatAnalysis.offset.toFixed(2)}s</p></div><button type="button" onClick={() => void analyzeMusicBeats()}''')
              # Add waveform after analysis summary container, before controls.
              rep('''</button></div></div> : <button type="button" onClick={() => void analyzeMusicBeats()} disabled={beatAnalyzing}''', '''</button></div>{activeBeatAnalysis.waveform.length > 0 && <div className="mt-2 flex h-10 items-center gap-px overflow-hidden rounded-md bg-muted/40 px-1">{activeBeatAnalysis.waveform.map((level, index) => <span key={index} className="min-w-[1px] flex-1 rounded-full bg-amber-500/70" style={{ height: `${Math.max(8, Math.round(level * 100))}%` }} />)}</div>}</div> : <button type="button" onClick={() => void analyzeMusicBeats()} disabled={beatAnalyzing}''')

              # Insert Audio Pro controls before existing original-volume field.
              rep('''</div>}<RangeField label="Áudio original" value={originalVolume} min={0} max={1.5} step={0.05} onChange={setOriginalVolume} />''', '''</div>}<div className="space-y-3 rounded-xl border bg-muted/15 p-3"><div><p className="text-xs font-semibold">Mixer inteligente</p><p className="text-[10px] text-muted-foreground">Presets ajustam voz, trilha, ducking, fades e loudness juntos.</p></div><div className="grid grid-cols-2 gap-1.5">{AUDIO_MIX_PRESETS.map((preset) => <button key={preset.id} type="button" onClick={() => applyAudioMixPreset(preset.id)} title={preset.hint} className="rounded-lg border bg-background px-2 py-1.5 text-[10px] font-medium hover:border-primary/40">{preset.label}</button>)}</div><label className="flex items-center justify-between gap-3 rounded-lg border bg-background px-2.5 py-2 text-[10px]"><span><strong className="block text-foreground">Ducking automático</strong><span className="text-muted-foreground">Baixa a música quando o áudio original entra.</span></span><input type="checkbox" checked={duckingEnabled} onChange={(event) => setDuckingEnabled(event.target.checked)} className="accent-primary" /></label>{duckingEnabled && <div className="space-y-2"><RangeField label="Redução da música" value={duckingReduction} min={0} max={90} step={1} suffix="%" onChange={setDuckingReduction} /><RangeField label="Sensibilidade à voz/áudio" value={duckingThresholdPct} min={1} max={20} step={1} suffix="%" onChange={setDuckingThresholdPct} /><div className="grid grid-cols-2 gap-2"><label className="space-y-1"><span className="text-[10px] text-muted-foreground">Ataque (ms)</span><input type="number" min={20} max={600} step={10} value={duckingAttackMs} onChange={(event) => setDuckingAttackMs(clamp(Number(event.target.value), 20, 600))} className="h-8 w-full rounded-lg border bg-background px-2 text-[11px]" /></label><label className="space-y-1"><span className="text-[10px] text-muted-foreground">Retorno (ms)</span><input type="number" min={80} max={1800} step={20} value={duckingReleaseMs} onChange={(event) => setDuckingReleaseMs(clamp(Number(event.target.value), 80, 1800))} className="h-8 w-full rounded-lg border bg-background px-2 text-[11px]" /></label></div></div>}<div className="grid grid-cols-2 gap-2"><RangeField label="Fade-in" value={musicFadeIn} min={0} max={5} step={0.1} suffix="s" onChange={setMusicFadeIn} /><RangeField label="Fade-out" value={musicFadeOut} min={0} max={8} step={0.1} suffix="s" onChange={setMusicFadeOut} /></div><label className="flex items-center justify-between gap-3 rounded-lg border bg-background px-2.5 py-2 text-[10px]"><span>Loop inteligente sem emenda</span><input type="checkbox" checked={smartMusicLoop} onChange={(event) => setSmartMusicLoop(event.target.checked)} className="accent-primary" /></label><div className="space-y-2"><div className="flex items-center justify-between gap-2"><span className="text-[10px] font-medium">Automação de volume</span><button type="button" onClick={addMusicVolumePoint} className="rounded-lg border bg-background px-2 py-1 text-[9px]">+ Ponto no playhead</button></div>{musicVolumePoints.length > 0 ? <div className="flex flex-wrap gap-1">{musicVolumePoints.map((point) => <button key={point.id} type="button" onClick={() => setMusicVolumePoints((current) => current.filter((item) => item.id !== point.id))} title="Remover ponto" className="rounded-full border bg-background px-2 py-1 text-[9px] tabular-nums">{timeLabel(point.time)} · {Math.round(point.value * 100)}% ×</button>)}</div> : <p className="text-[9px] text-muted-foreground">Adicione pontos para aumentar ou reduzir a trilha ao longo do vídeo.</p>}</div><label className="block space-y-1"><span className="text-[10px] text-muted-foreground">Loudness final (LUFS)</span><select value={loudnessTarget} onChange={(event) => { setLoudnessTarget(Number(event.target.value)); setNormalizeAudio(true); }} className="h-8 w-full rounded-lg border bg-background px-2 text-[11px]"><option value={-12}>-12 LUFS · anúncio forte</option><option value={-14}>-14 LUFS · social / YouTube</option><option value={-16}>-16 LUFS · voz / institucional</option><option value={-18}>-18 LUFS · conteúdo suave</option></select></label></div><RangeField label="Áudio original" value={originalVolume} min={0} max={1.5} step={0.05} onChange={setOriginalVolume} />''')

              front.write_text(text)

          backend = Path('artifacts/api-server/src/routes/video_processing.ts')
          api = backend.read_text()
          if 'loudnessTarget = "-14"' not in api:
              def arep(old, new, count=1):
                  global api
                  if old not in api:
                      raise SystemExit('Missing backend anchor:\n' + old[:240])
                  api = api.replace(old, new, count)
              arep('''const { removeSilence = "true", speed = "1.0", normalize = "false" } = req.body as Record<string, string>;''', '''const { removeSilence = "true", speed = "1.0", normalize = "false", loudnessTarget = "-14" } = req.body as Record<string, string>;''')
              arep('''        normalize,\n      },''', '''        normalize,\n        loudnessTarget,\n      },''')
              arep('''      input: { removeSilence, speed, normalize },''', '''      input: { removeSilence, speed, normalize, loudnessTarget },''')
              arep('''        const vFilters: string[] = [];\n        const aFilters: string[] = [...filters];\n        if (normalize === "true") aFilters.push("loudnorm");''', '''        const vFilters: string[] = [];\n        const aFilters: string[] = [...filters];\n        const parsedLoudnessTarget = parseFloat(loudnessTarget);\n        const safeLoudnessTarget = Number.isFinite(parsedLoudnessTarget) ? Math.max(-24, Math.min(-8, parsedLoudnessTarget)) : -14;\n        if (normalize === "true") aFilters.push(`loudnorm=I=${safeLoudnessTarget}:TP=-1.5:LRA=11`);''')
              arep('''          metadata: { jobId, removeSilence, speed, normalize },''', '''          metadata: { jobId, removeSilence, speed, normalize, loudnessTarget },''')
              backend.write_text(api)

          PY
          git config user.name "vendorai-automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add artifacts/frontend/src/components/video/VideoTimelineEditor.tsx artifacts/api-server/src/routes/video_processing.ts
          if git diff --cached --quiet; then
            echo "No product changes"
            exit 0
          fi
          git commit -m "feat(video): add professional audio mixer"
          git push origin HEAD:feat/video-audio-pro
