name: VendorAI Media Worker CI

on:
  pull_request:
    paths:
      - "artifacts/media-worker/**"
      - ".github/workflows/media-worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "artifacts/media-worker/**"
      - ".github/workflows/media-worker-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Python syntax
        run: python -m py_compile artifacts/media-worker/app/main.py
      - name: Validate worker contract and no HeyGen dependency
        run: |
          python - <<'PY'
          from pathlib import Path
          src = Path("artifacts/media-worker/app/main.py").read_text()
          required = [
              '@app.get("/health")',
              '@app.post("/v1/voice/synthesize")',
              'x_vendorai_worker_secret',
              'reference_audio',
              'audio/wav',
              'ChatterboxMultilingualTTS',
          ]
          missing = [value for value in required if value not in src]
          if missing:
              raise SystemExit(f"worker contract missing: {missing}")
          tree = "\n".join(
              p.read_text(errors="ignore")
              for p in Path("artifacts/media-worker").rglob("*")
              if p.is_file()
          ).lower()
          forbidden = "hey" + "gen"
          if forbidden in tree:
              raise SystemExit("external avatar provider reference found in official media worker")
          PY
      - name: Validate container files
        run: |
          test -s artifacts/media-worker/Dockerfile
          test -s artifacts/media-worker/requirements.txt
          grep -q "chatterbox-tts==0.1.7" artifacts/media-worker/requirements.txt
          grep -q "nvidia/cuda" artifacts/media-worker/Dockerfile
