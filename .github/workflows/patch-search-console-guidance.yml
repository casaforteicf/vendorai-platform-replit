name: Patch Search Console tenant guidance

on:
  push:
    branches:
      - fix/search-console-tenant-guidance

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[search-console-guidance-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/search-console-tenant-guidance
          fetch-depth: 0

      - name: Clarify Search Console verification guidance
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('artifacts/frontend/src/pages/ConfiguracoesLegacy.tsx')
          text = page.read_text(encoding='utf-8')

          replacements = [
              (
                  '{searchConsoleConnection.verified ? "Verificado" : "Aguardando verificação"}',
                  '{searchConsoleConnection.verified ? "Verificado" : "Autorizado — verificando propriedade"}',
              ),
              (
                  '''                ) : (\n                  <p className="text-sm text-muted-foreground">\n                    A verificação leva alguns minutos pra propagar no site. Clique abaixo pra confirmar.\n                  </p>\n                )}''',
                  '''                ) : (\n                  <div className="rounded-lg border border-amber-200 bg-amber-50/70 p-3 text-sm dark:border-amber-900/50 dark:bg-amber-950/20">\n                    <p className="font-medium text-foreground">Conta Google autorizada. Agora falta confirmar a propriedade do site.</p>\n                    <ol className="mt-2 space-y-1 text-muted-foreground">\n                      <li><span className="font-medium text-foreground">1.</span> Aguarde cerca de 2 a 5 minutos para o Google processar a verificação.</li>\n                      <li><span className="font-medium text-foreground">2.</span> Depois, clique em <span className="font-medium text-foreground">Verificar agora</span>.</li>\n                      <li><span className="font-medium text-foreground">3.</span> Quando o Google confirmar, o status mudará para <span className="font-medium text-foreground">Verificado</span> e o sitemap será enviado automaticamente.</li>\n                    </ol>\n                    <p className="mt-2 text-xs text-muted-foreground">Você não precisa conectar a conta novamente. Se ainda estiver processando, aguarde mais alguns minutos e tente de novo. Não desconecte a integração.</p>\n                  </div>\n                )}''',
              ),
              (
                  '{searchConsoleVerifying ? "Verificando..." : "Verificar propriedade"}',
                  '{searchConsoleVerifying ? "Verificando..." : "Verificar agora"}',
              ),
              (
                  '''        toast({\n          title: "Ainda não verificado — aguarde alguns minutos após conectar e tente de novo.",\n          variant: "destructive",\n        });''',
                  '''        toast({\n          title: "O Google ainda está processando a verificação.",\n          description: "Sua conta já está autorizada. Aguarde alguns minutos e clique novamente em “Verificar agora”. Não desconecte a integração.",\n        });''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Trecho esperado não encontrado em {page}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          page.write_text(text, encoding='utf-8')

          validation = Path('artifacts/frontend/src/components/ConfigurationPostChangeValidation.tsx')
          if validation.exists():
              vtext = validation.read_text(encoding='utf-8')
              old = 'message: "A conexão existe, porém a propriedade ainda não está verificada. Conclua a verificação antes de considerar o fluxo operacional.",'
              new = 'message: "A conta Google já está autorizada. Aguarde de 2 a 5 minutos e clique em “Verificar agora”. Não é necessário reconectar a conta.",'
              if old in vtext:
                  validation.write_text(vtext.replace(old, new, 1), encoding='utf-8')

          workflow = Path('.github/workflows/patch-search-console-guidance.yml')
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "VendorAI Automation"
          git config user.email "vendorai-automation@users.noreply.github.com"
          git add -A
          git commit -m "fix(search-console): orientar tenant durante verificação [search-console-guidance-applied]"
          git push origin HEAD:fix/search-console-tenant-guidance
