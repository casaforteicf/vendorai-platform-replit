name: Fix FAQ integration links
on:
  push:
    branches:
      - fix/faq-updated-next-to-news
    paths:
      - '.github/workflows/fix-faq-links.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/faq-updated-next-to-news
          fetch-depth: 0
      - name: Point FAQ actions to current integration screen
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('artifacts/frontend/src/pages/faq/index.tsx')
          text = path.read_text(encoding='utf-8')
          changes = {
            '4, "/onboarding/integracoes", "Conectar canais", "instagram facebook whatsapp google"': '4, "/configuracoes", "Abrir integrações", "instagram facebook whatsapp google"',
            '4, "/onboarding/integracoes", "Conectar Instagram", "meta página profissional"': '4, "/configuracoes", "Abrir Central Meta", "meta página profissional"',
            '6, "/onboarding/integracoes", "Conectar WhatsApp", "cloud api número coexistência"': '6, "/configuracoes", "Abrir Central Meta", "cloud api número coexistência"',
            '3, "/onboarding/integracoes", "Ver situação", "business app coexistence"': '3, "/configuracoes", "Abrir Central Meta", "business app coexistence"',
            '5, "/onboarding/integracoes", "Conectar Google", "ads calendar oauth"': '5, "/configuracoes", "Abrir integrações", "ads calendar oauth"',
            '3, "/onboarding/integracoes", "Revisar conexões", "token expirado reconectar"': '3, "/configuracoes", "Revisar conexões", "token expirado reconectar"',
          }
          for old, new in changes.items():
              if old not in text:
                  raise SystemExit(f'Missing route pattern: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/fix-faq-links.yml
          git config user.name 'VendorAI Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: point FAQ actions to current integration screen'
          git push origin fix/faq-updated-next-to-news
