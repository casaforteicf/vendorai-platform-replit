name: Finalize VendorAI Official Media

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finalize-official-media.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile
      - name: Install Chromium
        run: pnpm --filter @workspace/e2e exec playwright install --with-deps chromium
      - name: Generate remaining official media
        run: node scripts/finalize-official-media.mjs
      - name: Publish remaining official media
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          TARGET="artifacts/website/public/media/vendorai-official"
          mkdir -p "$TARGET/videos" "$TARGET/jarvis"
          cp e2e/final-media/videos/*.webm "$TARGET/videos/"
          cp e2e/final-media/jarvis/desktop-aberto.png "$TARGET/jarvis/desktop-aberto.png"
          git config user.name "VendorAI Media Bot"
          git config user.email "media-bot@appvendorai.com"
          git add "$TARGET/videos" "$TARGET/jarvis"
          git commit -m "chore(media): finalize CRM finance and JARVIS official media"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
      - name: Upload final media artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendorai-official-media-final
          path: e2e/final-media
          retention-days: 30
