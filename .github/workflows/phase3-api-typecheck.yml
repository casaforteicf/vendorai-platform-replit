name: Phase 3 API typecheck

on:
  push:
    branches:
      - fix-especificacao-fase3

jobs:
  typecheck-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @workspace/api-server typecheck
