name: Apply Prospector Meta Revenue Unified

on:
  push:
    branches:
      - feat/prospector-meta-revenue-unified

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[prospector-meta-unified-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply focused changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected block not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Backend: keep every discovery source inside the canonical Prospector flow.
          route = "artifacts/api-server/src/routes/prospector.ts"

          replace_once(
              route,
              '        inArray(leadsTable.source, ["prospector_auto", "prospector"]),',
              '        inArray(leadsTable.source, ["prospector_auto", "prospector", "cnpj", "recem_aberta", "ad_library"]),',
          )

          replace_once(
              route,
              '''    } catch (err) {
      req.log.error({ err }, "prospector: criação de deal falhou (não-fatal)");
    }
  }

  // 7. Persiste o enriquecimento''',
              '''    } catch (err) {
      req.log.error({ err }, "prospector: criação de deal falhou (não-fatal)");
    }
  }

  // Todo lead novo de Google Places entra no mesmo motor preditivo/fila do Prospector.
  if (resolvedLeadId && !isDuplicate) {
    enrichLead({ leadId: resolvedLeadId, tenantId, log: req.log }).catch(() => undefined);
  }

  // 7. Persiste o enriquecimento''',
          )

          replace_once(
              route,
              '''  // Create deal
  if (firstFunil) {
    await db.insert(dealsTable).values({
      tenantId,
      leadId: lead.id,
      funilId: firstFunil.id,
      titulo: `${d.nomeFantasia || d.razaoSocial} — Prospector CNPJ`,
      etapa: "novo",
    });
  }

  // Activity
  await db.insert(activitiesTable).values({
    tenantId,
    leadId: lead.id,
    tipo: "tarefa",
    titulo: "Lead importado via Busca CNPJ",
    descricao: `Lead importado via Busca CNPJ (CNAE ${d.cnaeCode ?? "?"}) — ${d.municipio ?? ""}`,
    status: "concluida",
  });''',
              '''  // Create deal in the same CRM funnel used by the canonical Prospector.
  let cnpjDealId: string | null = null;
  if (firstFunil) {
    const [createdDeal] = await db.insert(dealsTable).values({
      tenantId,
      leadId: lead.id,
      funilId: firstFunil.id,
      titulo: `${d.nomeFantasia || d.razaoSocial} — Prospector CNPJ`,
      etapa: "novo",
    }).returning({ id: dealsTable.id });
    cnpjDealId = createdDeal?.id ?? null;
  }

  // Activity
  await db.insert(activitiesTable).values({
    tenantId,
    leadId: lead.id,
    dealId: cnpjDealId,
    tipo: "tarefa",
    titulo: "Lead importado via Busca CNPJ",
    descricao: `Lead importado via Busca CNPJ (CNAE ${d.cnaeCode ?? "?"}) — ${d.municipio ?? ""}`,
    status: "concluida",
  });

  if (cnpjDealId) {
    gerarBriefingDeal(
      tenantId,
      cnpjDealId,
      d.nomeFantasia || d.razaoSocial,
      d.endereco ?? null,
      d.telefone ?? null,
      null,
      null,
      null,
      [],
      [],
      req.log,
    ).catch(() => undefined);
  }''',
          )

          marker = '''/** POST /prospector/cnpj/recem-abertas — manual trigger of new-company scan */'''
          meta_endpoint = r'''/** POST /prospector/ads/prospectar — ingest a Meta/Instagram advertiser into the canonical Prospector */
router.post("/prospector/ads/prospectar", async (req, res) => {
  const schema = z.object({
    pageId: z.string().min(1),
    pageName: z.string().min(2),
    snapshotUrl: z.string().url().nullish(),
    startDate: z.string().nullish(),
    searchTerms: z.string().optional(),
    tenantId: z.string().optional(),
  });

  const parsed = schema.safeParse(req.body);
  if (!parsed.success) return res.status(400).json({ error: parsed.error.issues[0]?.message });

  const tenantId = resolveTenantId(req, parsed.data.tenantId);
  const d = parsed.data;

  // Cross-enrich Meta discovery with Google Places when quota/provider are available.
  let place: PlacesResult | null = null;
  try {
    await checkApiQuota(tenantId, "google_places", req.log);
    place = await searchPlace(d.pageName, req.log);
  } catch (err) {
    req.log.warn({ err, pageId: d.pageId }, "prospector/meta: Google cross-enrichment unavailable (non-fatal)");
  }

  const telefone = place?.telefone ?? null;
  const whatsapp = deriveWhatsapp(telefone);
  const now = new Date().toISOString();
  const metaSignal = {
    origem: "ad_library",
    meta_page_id: d.pageId,
    meta_page_name: d.pageName,
    meta_ad_snapshot_url: d.snapshotUrl ?? null,
    meta_ad_start_date: d.startDate ?? null,
    meta_search_terms: d.searchTerms ?? null,
    meta_anunciante_ativo: true,
    rating: place?.rating ?? null,
    total_ratings: place?.reviewCount ?? null,
    prospectado_em: now,
  };

  // Deduplicate inside the tenant by Meta page id, phone or exact business name.
  const [existing] = await db
    .select({ id: leadsTable.id, nome: leadsTable.nome, metadata: leadsTable.metadata })
    .from(leadsTable)
    .where(and(
      eq(leadsTable.tenantId, tenantId),
      or(
        sql`${leadsTable.metadata}->>'meta_page_id' = ${d.pageId}`,
        telefone ? eq(leadsTable.telefone, telefone) : sql`FALSE`,
        sql`lower(${leadsTable.nome}) = lower(${d.pageName})`,
      ),
    ))
    .limit(1);

  if (existing) {
    await db.update(leadsTable)
      .set({
        telefone: telefone ?? undefined,
        websiteUrl: place?.siteOficial ?? undefined,
        endereco: place?.endereco ?? undefined,
        metadata: {
          ...((existing.metadata ?? {}) as Record<string, unknown>),
          ...metaSignal,
        },
        priorityReason: "Anunciante Meta/Instagram ativo — sinal comercial atualizado",
        updatedAt: new Date(),
      })
      .where(eq(leadsTable.id, existing.id));

    return res.status(200).json({
      leadId: existing.id,
      dealId: null,
      merged: true,
      message: `Lead "${existing.nome}" já existe — sinal Meta atualizado`,
    });
  }

  const [lead] = await db.insert(leadsTable).values({
    tenantId,
    nome: d.pageName,
    empresa: d.pageName,
    telefone: telefone ?? undefined,
    endereco: place?.endereco ?? undefined,
    websiteUrl: place?.siteOficial ?? undefined,
    source: "ad_library",
    tipoPessoa: "juridica",
    enrichmentStatus: "pending",
    mercadoSegmento: d.searchTerms ?? undefined,
    priorityReason: "Investindo em anúncios Meta/Instagram — sinal de intenção comercial",
    metadata: metaSignal,
  }).returning({ id: leadsTable.id });

  if (!lead) return res.status(500).json({ error: "Falha ao criar lead Meta" });

  const [firstFunil] = await db
    .select({ id: funisTable.id })
    .from(funisTable)
    .where(eq(funisTable.tenantId, tenantId))
    .orderBy(asc(funisTable.createdAt))
    .limit(1);

  let dealId: string | null = null;
  if (firstFunil) {
    const [deal] = await db.insert(dealsTable).values({
      tenantId,
      leadId: lead.id,
      funilId: firstFunil.id,
      titulo: `${d.pageName} — Prospector Meta`,
      etapa: "novo",
    }).returning({ id: dealsTable.id });
    dealId = deal?.id ?? null;
  }

  await db.insert(activitiesTable).values({
    tenantId,
    leadId: lead.id,
    dealId,
    tipo: "tarefa",
    titulo: "Lead importado via Prospector Meta/Instagram",
    descricao: `Anunciante ativo identificado na Meta Ad Library${d.searchTerms ? ` para "${d.searchTerms}"` : ""}.`,
    status: "concluida",
  });

  if (dealId) {
    gerarBriefingDeal(
      tenantId,
      dealId,
      d.pageName,
      place?.endereco ?? null,
      telefone,
      place?.siteOficial ?? null,
      place?.rating ?? null,
      place?.reviewCount ?? null,
      ["Investe ativamente em mídia paga"],
      ["Risco de perda de leads entre anúncio e atendimento"],
      req.log,
    ).catch(() => undefined);
  }

  enrichLead({
    leadId: lead.id,
    tenantId,
    log: req.log,
    scoreBoost: 5,
    boostReason: "meta_advertiser",
  }).catch(() => undefined);

  return res.status(201).json({ leadId: lead.id, dealId, merged: false, whatsapp });
});

'''
          replace_once(route, marker, meta_endpoint + marker)

          # Predictive enrichment: recognize Meta-origin leads as first-class commercial signals.
          enrich = "artifacts/api-server/src/jobs/leadEnrichment.ts"
          replace_once(
              enrich,
              '''    // Phase 2C: Meta Ads check + Google presence cross-reference
    const [metaAds, googlePresence] = await Promise.allSettled([
      checkHasMetaAds(lead.empresa ?? lead.nome),
      lead.source === "cnpj" || lead.source === "recem_aberta"
        ? checkGooglePresence(lead.empresa ?? lead.nome, (lead.metadata as Record<string, unknown>)?.["cidade"] as string ?? "")
        : Promise.resolve(true), // for Google Places leads, presence is assumed
    ]);

    growth.anuncios_ativos = metaAds.status === "fulfilled" ? metaAds.value : false;
    const temPresencaGoogle = googlePresence.status === "fulfilled" ? googlePresence.value : true;
    digital.presenca_google = temPresencaGoogle;

    // If company from CNPJ with no Google presence → flag as "digital invisible"
    if ((lead.source === "cnpj" || lead.source === "recem_aberta") && !temPresencaGoogle) {''',
              '''    // Phase 2C: Meta Ads check + Google presence cross-reference.
    // A lead discovered in Ad Library already carries a verified ad signal, so it does not
    // depend on a global token being available again during enrichment.
    const leadMetadata = (lead.metadata ?? {}) as Record<string, unknown>;
    const metaAdvertiserSignal =
      lead.source === "ad_library" ||
      leadMetadata["origem"] === "ad_library" ||
      leadMetadata["meta_anunciante_ativo"] === true ||
      Boolean(leadMetadata["meta_page_id"]);
    const mustCheckGooglePresence = ["cnpj", "recem_aberta", "ad_library"].includes(lead.source ?? "");

    const [metaAds, googlePresence] = await Promise.allSettled([
      metaAdvertiserSignal ? Promise.resolve(true) : checkHasMetaAds(lead.empresa ?? lead.nome),
      mustCheckGooglePresence
        ? checkGooglePresence(lead.empresa ?? lead.nome, leadMetadata["cidade"] as string ?? "")
        : Promise.resolve(true), // Google Places-origin leads are already verified there
    ]);

    growth.anuncios_ativos = metaAds.status === "fulfilled" ? metaAds.value : metaAdvertiserSignal;
    const temPresencaGoogle = googlePresence.status === "fulfilled" ? googlePresence.value : true;
    digital.presenca_google = temPresencaGoogle;

    // Non-Google discovery with no Places presence → flag as digitally invisible.
    if (mustCheckGooglePresence && !temPresencaGoogle) {''',
          )

          replace_once(
              enrich,
              '''        enrichmentData: { digital, growth, enriquecido_em: new Date().toISOString() },''',
              '''        enrichmentData: {
          digital,
          growth,
          signals: { origem: lead.source, meta_anunciante: metaAdvertiserSignal },
          enriquecido_em: new Date().toISOString(),
        },''',
          )

          replace_once(
              enrich,
              '''      if (boostReason === "empresa_recem_aberta") {
        scoreResult.priority_reason = scoreResult.priority_reason
          ? `${scoreResult.priority_reason} (+${scoreBoost} pts: empresa recém-aberta)`
          : `Empresa recém-aberta — oportunidade de primeiro sistema`;
      }''',
              '''      if (boostReason === "empresa_recem_aberta") {
        scoreResult.priority_reason = scoreResult.priority_reason
          ? `${scoreResult.priority_reason} (+${scoreBoost} pts: empresa recém-aberta)`
          : `Empresa recém-aberta — oportunidade de primeiro sistema`;
      } else if (boostReason === "meta_advertiser") {
        scoreResult.priority_reason = scoreResult.priority_reason
          ? `${scoreResult.priority_reason} (+${scoreBoost} pts: anunciante Meta/Instagram)`
          : `Anunciante Meta/Instagram ativo (+${scoreBoost} pts)`;
      }''',
          )

          replace_once(
              enrich,
              '''    if (!digital.presenca_google && (lead.source === "cnpj" || lead.source === "recem_aberta")) {''',
              '''    if (!digital.presenca_google && mustCheckGooglePresence) {''',
          )

          replace_once(
              enrich,
              '''        enrichmentData: {
          digital,
          growth,
          score_breakdown: scoreResult.score_breakdown,
          enriquecido_em: new Date().toISOString(),
        },''',
              '''        enrichmentData: {
          digital,
          growth,
          signals: { origem: lead.source, meta_anunciante: metaAdvertiserSignal },
          score_breakdown: scoreResult.score_breakdown,
          enriquecido_em: new Date().toISOString(),
        },''',
          )

          # Frontend: let each Meta advertiser enter the same CRM/score/briefing/fila flow.
          frontend = "artifacts/frontend/src/pages/Prospector.tsx"
          replace_once(
              frontend,
              '''  const [adsResultados, setAdsResultados] = useState<AdResult[]>([]);
  const [adsSearched, setAdsSearched] = useState(false);
  const [adsSearching, setAdsSearching] = useState(false);''',
              '''  const [adsResultados, setAdsResultados] = useState<AdResult[]>([]);
  const [adsSearched, setAdsSearched] = useState(false);
  const [adsSearching, setAdsSearching] = useState(false);
  const [adsProspectandoPageId, setAdsProspectandoPageId] = useState<string | null>(null);
  const [adsProspectadosPageIds, setAdsProspectadosPageIds] = useState<Set<string>>(new Set());
  const [adsDuplicadosPageIds, setAdsDuplicadosPageIds] = useState<Set<string>>(new Set());''',
          )

          replace_once(
              frontend,
              '''  const filaQuery = useQuery({''',
              '''  const adsProspectMutation = useMutation({
    mutationFn: async (ad: AdResult) => {
      const res = await fetch("/api/prospector/ads/prospectar", {
        method: "POST",
        headers: getAuthHeaders(),
        body: JSON.stringify({
          ...ad,
          searchTerms: adsSearchTerms,
          tenantId,
        }),
      });
      const data = await res.json() as { leadId?: string; dealId?: string | null; merged?: boolean; message?: string; error?: string };
      if (!res.ok) throw new Error(data.error ?? "Falha ao prospectar anunciante");
      return data;
    },
    onSuccess: (data, ad) => {
      if (data.merged) {
        setAdsDuplicadosPageIds((prev) => new Set(prev).add(ad.pageId));
        toast({ title: "Lead já estava no CRM", description: data.message ?? "Sinal Meta atualizado no lead existente." });
      } else {
        setAdsProspectadosPageIds((prev) => new Set(prev).add(ad.pageId));
        toast({ title: "Lead Meta criado", description: "Enriquecimento, score, briefing e fila foram acionados." });
      }
      queryClient.invalidateQueries({ queryKey: ["prospector-fila"] });
    },
    onError: (err) => toast({
      title: "Falha ao prospectar anunciante",
      description: err instanceof Error ? err.message : undefined,
      variant: "destructive",
    }),
  });

  const filaQuery = useQuery({''',
          )

          replace_once(
              frontend,
              '''                            {ad.snapshotUrl && (
                              <Button size="sm" variant="outline" asChild>
                                <a href={ad.snapshotUrl} target="_blank" rel="noopener noreferrer">
                                  <ExternalLink className="h-3.5 w-3.5 mr-1" /> Ver anúncio
                                </a>
                              </Button>
                            )}''',
              '''                            {ad.snapshotUrl && (
                              <Button size="sm" variant="outline" asChild>
                                <a href={ad.snapshotUrl} target="_blank" rel="noopener noreferrer">
                                  <ExternalLink className="h-3.5 w-3.5 mr-1" /> Ver anúncio
                                </a>
                              </Button>
                            )}
                            <Button
                              size="sm"
                              variant={adsProspectadosPageIds.has(ad.pageId) || adsDuplicadosPageIds.has(ad.pageId) ? "outline" : "default"}
                              disabled={adsProspectMutation.isPending || adsProspectadosPageIds.has(ad.pageId) || adsDuplicadosPageIds.has(ad.pageId)}
                              onClick={() => {
                                setAdsProspectandoPageId(ad.pageId);
                                adsProspectMutation.mutate(ad, { onSettled: () => setAdsProspectandoPageId(null) });
                              }}
                            >
                              {adsProspectandoPageId === ad.pageId && adsProspectMutation.isPending ? (
                                <><Spinner className="h-3.5 w-3.5 mr-1" /> Prospectando...</>
                              ) : adsDuplicadosPageIds.has(ad.pageId) ? (
                                <><CheckCircle2 className="h-3.5 w-3.5 mr-1 text-amber-600" /> Já no CRM</>
                              ) : adsProspectadosPageIds.has(ad.pageId) ? (
                                <><CheckCircle2 className="h-3.5 w-3.5 mr-1 text-emerald-600" /> Prospectado</>
                              ) : (
                                <><UserPlus className="h-3.5 w-3.5 mr-1" /> Prospectar</>
                              )}
                            </Button>''',
          )

          PY

      - name: Commit implementation and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-prospector-meta-revenue-unified.yml
          git add artifacts/api-server/src/routes/prospector.ts artifacts/api-server/src/jobs/leadEnrichment.ts artifacts/frontend/src/pages/Prospector.tsx
          git commit -m "feat(prospector): unificar Meta e Revenue Scout no fluxo existente [prospector-meta-unified-applied]"
          git push origin HEAD:feat/prospector-meta-revenue-unified
