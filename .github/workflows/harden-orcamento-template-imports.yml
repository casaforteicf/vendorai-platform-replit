name: Harden proposal template imports

on:
  push:
    branches: [feat-orcamento-modelos-linha]
    paths:
      - '.github/workflows/harden-orcamento-template-imports.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat-orcamento-modelos-linha
      - name: Reuse proven PDF/DOCX import pattern
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('artifacts/api-server/src/routes/lead_proposals.ts')
          s=p.read_text()
          anchor='import { buildProposalPrompt, callProposalAI, renderProposalHtml, generateTheme, AI_PROVIDER, generateProposalPDF, learnFromProposalEdit, type ProposalStyleMemory } from "../lib/proposal-engine.js";\n'
          assert anchor in s
          s=s.replace(anchor, anchor+'import pdfParse from "pdf-parse";\nimport mammoth from "mammoth";\n',1)
          s=s.replace('      const pdfParse = (await import("pdf-parse")).default;\n      text = (await pdfParse(buffer)).text ?? "";','      text = (await pdfParse(buffer)).text ?? "";',1)
          s=s.replace('      const mammoth = await import("mammoth");\n      text = (await mammoth.extractRawText({ buffer })).value ?? "";','      text = (await mammoth.extractRawText({ buffer })).value ?? "";',1)
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add artifacts/api-server/src/routes/lead_proposals.ts
          git commit -m 'fix: usar imports validados para PDF e DOCX'
          git push origin HEAD:feat-orcamento-modelos-linha
