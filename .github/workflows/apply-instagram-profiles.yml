name: Apply Instagram Profiles Prospecting

on:
  push:
    branches:
      - feat/prospector-instagram-profiles

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[instagram-profiles-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/vendorai_ci
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Apply focused patch
        run: python .github/scripts/apply_instagram_profiles.py
      - name: Instagram prospecting tests
        run: pnpm --filter @workspace/api-server exec vitest run src/services/instagramProspecting.test.ts
      - name: API focused typecheck
        run: pnpm --filter @workspace/api-server exec tsc -p tsconfig.launch-ci.json --noEmit
      - name: Frontend typecheck diagnostic
        run: pnpm --filter @workspace/frontend typecheck
      - name: Commit implementation and remove temporary applicator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-instagram-profiles.yml .github/scripts/apply_instagram_profiles.py
          git add artifacts/api-server/src/routes/prospector.ts artifacts/api-server/src/services/meta-ads-oauth.ts artifacts/frontend/src/pages/Prospector.tsx artifacts/api-server/src/services/instagramProspecting.ts artifacts/api-server/src/services/instagramProspecting.test.ts
          git commit -m "feat(prospector): pesquisar perfis profissionais do Instagram [instagram-profiles-applied]"
          git push origin HEAD:feat/prospector-instagram-profiles
