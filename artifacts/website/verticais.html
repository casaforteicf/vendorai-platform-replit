<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vendor.ai — Vertical</title>
<meta name="description" content="Conheça como a Vendor.ai atende o seu segmento com IA nativa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #050714;
  --bg-2: #0c0f24;
  --bg-card: rgba(255,255,255,0.04);
  --bg-card-hover: rgba(255,255,255,0.07);
  --border: rgba(255,255,255,0.08);
  --border-light: rgba(255,255,255,0.12);
  --text: #f0eeff;
  --text-muted: #8880a8;
  --text-dim: #4e4870;
  --violet: #7c3aed;
  --violet-light: #a78bfa;
  --cyan: #06b6d4;
  --cyan-light: #67e8f9;
  --green: #10b981;
  --grad: linear-gradient(135deg, #7c3aed, #06b6d4);
  --grad-text: linear-gradient(90deg, #a78bfa, #67e8f9);
  --grad-btn: linear-gradient(135deg, #7c3aed 0%, #2563eb 50%, #06b6d4 100%);
  --radius: 16px;
  --radius-sm: 10px;
  --shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
  --glow: 0 0 40px rgba(124,58,237,0.25);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
  line-height: 1.6;
  overflow-x: hidden;
  min-height: 100vh;
}
a { text-decoration: none; color: inherit; }
::selection { background: rgba(124,58,237,0.35); color: #fff; }

/* noise */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.035'/%3E%3C/svg%3E");
  pointer-events: none;
  z-index: 999;
  opacity: 0.4;
}

.container { max-width: 1100px; margin: 0 auto; padding: 0 24px; }

h1, h2, h3 {
  font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
  line-height: 1.1;
  letter-spacing: -0.02em;
}

.grad-text {
  background: var(--grad-text);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* ── Nav ── */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  padding: 0 6vw;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(5,7,20,0.85);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.logo { display: flex; align-items: center; gap: 10px; }
.logo-mark {
  width: 36px; height: 36px;
  border-radius: 10px;
  background: var(--grad);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 800;
  font-size: 1rem;
  color: #fff;
  box-shadow: var(--glow);
}
.logo-text {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-weight: 700;
  font-size: 1.1rem;
  letter-spacing: -0.02em;
}
.logo-text span { background: var(--grad-text); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nav-vertical-name {
  font-size: 0.8rem;
  color: var(--text-muted);
  margin-left: 4px;
  display: none;
}
@media(min-width: 600px) { .nav-vertical-name { display: inline; } }

.btn-back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-muted);
  padding: 8px 16px;
  border-radius: 100px;
  border: 1px solid var(--border-light);
  background: transparent;
  cursor: pointer;
  transition: all 0.2s;
  text-decoration: none;
}
.btn-back:hover { color: var(--text); border-color: rgba(255,255,255,0.2); background: var(--bg-card); }

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  padding: 14px 28px;
  border-radius: 100px;
  border: none;
  cursor: pointer;
  transition: all 0.2s ease;
  white-space: nowrap;
  text-decoration: none;
}
.btn-primary {
  background: var(--grad-btn);
  background-size: 200% auto;
  color: #fff;
  box-shadow: 0 4px 24px rgba(124,58,237,0.4);
}
.btn-primary:hover { background-position: right center; transform: translateY(-2px); box-shadow: 0 8px 32px rgba(124,58,237,0.5); }
.btn-outline {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border-light);
}
.btn-outline:hover { background: var(--bg-card); border-color: rgba(255,255,255,0.2); transform: translateY(-1px); }
.btn-lg { padding: 16px 36px; font-size: 1rem; }

/* ── Hero ── */
.hero {
  position: relative;
  padding: 96px 0 112px;
  overflow: hidden;
  text-align: center;
}
.hero-blob-1 {
  position: absolute;
  width: 600px; height: 600px;
  border-radius: 50%;
  background: rgba(124,58,237,0.12);
  filter: blur(100px);
  top: -100px; left: -100px;
  pointer-events: none;
}
.hero-blob-2 {
  position: absolute;
  width: 400px; height: 400px;
  border-radius: 50%;
  background: rgba(6,182,212,0.08);
  filter: blur(80px);
  bottom: -50px; right: -50px;
  pointer-events: none;
}
.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--violet-light);
  background: rgba(124,58,237,0.12);
  border: 1px solid rgba(124,58,237,0.25);
  padding: 6px 16px;
  border-radius: 100px;
  margin-bottom: 28px;
}
.hero-eyebrow::before {
  content: '';
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--violet-light);
}
.hero h1 {
  font-size: clamp(2.2rem, 5vw, 4rem);
  font-weight: 800;
  color: var(--text);
  max-width: 820px;
  margin: 0 auto 24px;
}
.hero p {
  font-size: 1.1rem;
  color: var(--text-muted);
  max-width: 600px;
  margin: 0 auto 40px;
  line-height: 1.75;
}
.hero-ctas { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }

/* ── Section: Resultado ── */
.resultado {
  padding: 88px 0;
  background: var(--bg-2);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.overline {
  font-size: 0.72rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--violet-light);
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 16px;
}
.overline::before {
  content: '';
  display: block;
  width: 20px; height: 2px;
  background: var(--grad);
  border-radius: 2px;
}
.resultado-header { text-align: center; max-width: 700px; margin: 0 auto 64px; }
.resultado-header h2 {
  font-size: clamp(1.8rem, 3vw, 2.8rem);
  font-weight: 800;
  margin-bottom: 16px;
}
.resultado-header p {
  font-size: 1.05rem;
  color: var(--text-muted);
  line-height: 1.75;
}
.beneficios-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media(max-width: 700px) { .beneficios-grid { grid-template-columns: 1fr; } }
.beneficio-card {
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 20px 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all 0.2s;
}
.beneficio-card:hover {
  background: var(--bg-card-hover);
  border-color: rgba(124,58,237,0.25);
  transform: translateY(-2px);
}
.beneficio-icon { font-size: 1.4rem; line-height: 1; flex-shrink: 0; margin-top: 2px; }
.beneficio-check {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: rgba(16,185,129,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 3px;
}
.beneficio-check svg { width: 10px; height: 10px; }
.beneficio-text { font-size: 0.92rem; font-weight: 500; color: var(--text); line-height: 1.5; }

/* ── CTA Final ── */
.cta-final {
  padding: 96px 0;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.cta-final::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, rgba(124,58,237,0.12) 0%, transparent 70%);
  pointer-events: none;
}
.cta-final h2 {
  font-size: clamp(1.8rem, 3.5vw, 2.8rem);
  font-weight: 800;
  margin-bottom: 16px;
}
.cta-final p {
  font-size: 1.05rem;
  color: var(--text-muted);
  max-width: 520px;
  margin: 0 auto 40px;
  line-height: 1.7;
}
.cta-buttons { display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }

/* ── States ── */
.state-loading, .state-error {
  min-height: 60vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  text-align: center;
}
.spinner {
  width: 40px; height: 40px;
  border: 3px solid var(--border);
  border-top-color: var(--violet-light);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.state-error .emoji { font-size: 3.5rem; margin-bottom: 8px; }
.state-error h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 8px; }
.state-error p { color: var(--text-muted); max-width: 400px; margin-bottom: 24px; }

/* ── Modal ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(6px);
  z-index: 500;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal-overlay.open { display: flex; }
.modal {
  background: #0f1229;
  border: 1px solid var(--border-light);
  border-radius: 20px;
  width: 100%;
  max-width: 520px;
  padding: 36px;
  position: relative;
  box-shadow: var(--shadow);
  max-height: 90vh;
  overflow-y: auto;
}
.modal-close {
  position: absolute;
  top: 16px; right: 16px;
  width: 32px; height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.1rem;
  transition: all 0.15s;
}
.modal-close:hover { background: var(--bg-card); color: var(--text); }
.modal h3 {
  font-size: 1.3rem;
  font-weight: 700;
  margin-bottom: 8px;
}
.modal-sub {
  font-size: 0.88rem;
  color: var(--text-muted);
  margin-bottom: 28px;
}
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media(max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
.form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.form-label {
  font-size: 0.8rem;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}
.form-input, .form-textarea {
  background: rgba(255,255,255,0.05);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  font-family: 'Inter', sans-serif;
  font-size: 0.9rem;
  padding: 11px 14px;
  transition: border-color 0.15s;
  width: 100%;
  outline: none;
}
.form-input:focus, .form-textarea:focus {
  border-color: rgba(124,58,237,0.5);
  background: rgba(124,58,237,0.06);
}
.form-input::placeholder, .form-textarea::placeholder { color: var(--text-dim); }
.form-textarea { resize: vertical; min-height: 90px; }
.form-submit {
  width: 100%;
  padding: 14px;
  background: var(--grad-btn);
  background-size: 200% auto;
  color: #fff;
  border: none;
  border-radius: 100px;
  font-family: 'Inter', sans-serif;
  font-weight: 600;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 6px;
}
.form-submit:hover:not(:disabled) { background-position: right center; transform: translateY(-1px); }
.form-submit:disabled { opacity: 0.6; cursor: not-allowed; }

.success-state {
  text-align: center;
  padding: 16px 0;
}
.success-icon {
  width: 64px; height: 64px;
  border-radius: 50%;
  background: rgba(16,185,129,0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 20px;
  font-size: 1.8rem;
}
.success-state h3 { font-size: 1.3rem; font-weight: 700; margin-bottom: 8px; }
.success-state p { color: var(--text-muted); font-size: 0.92rem; line-height: 1.65; margin-bottom: 24px; }
</style>
</head>
<body>

<!-- ── Nav ── -->
<nav class="nav">
  <a href="/website/" class="logo">
    <div class="logo-mark">V</div>
    <span class="logo-text">Vendor<span>.ai</span></span>
    <span class="nav-vertical-name" id="nav-vertical-name"></span>
  </a>
  <a href="/website/" class="btn-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Voltar ao site
  </a>
</nav>

<!-- ── Main content (filled by JS) ── -->
<div id="app">
  <div class="state-loading">
    <div class="spinner"></div>
    <p style="color:var(--text-muted)">Carregando...</p>
  </div>
</div>

<!-- ── Contact Modal ── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <button class="modal-close" id="modal-close" aria-label="Fechar">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
(function() {
  // ── Helpers ──────────────────────────────────────────────────────────────
  const API_BASE = '/api';
  const app = document.getElementById('app');
  const overlay = document.getElementById('modal-overlay');
  const modalContent = document.getElementById('modal-content');

  // Extract slug from URL: /website/verticais/:slug
  function getSlug() {
    const path = window.location.pathname;
    const match = path.match(/\/verticais\/([^/?#]+)/);
    return match ? match[1] : null;
  }

  // ── Fetch & render ────────────────────────────────────────────────────────
  const slug = getSlug();
  if (!slug) { renderError('not_found'); }
  else {
    fetch(`${API_BASE}/site/verticais/${encodeURIComponent(slug)}`)
      .then(async res => {
        if (res.status === 404) { renderError('not_found'); return; }
        if (!res.ok) throw new Error();
        const data = await res.json();
        renderVertical(data);
      })
      .catch(() => renderError('error'));
  }

  // ── Render: error ─────────────────────────────────────────────────────────
  function renderError(type) {
    const msg = type === 'not_found'
      ? 'O endereço acessado não corresponde a nenhuma vertical da VendorAI.'
      : 'Não foi possível carregar esta página. Tente novamente em breve.';
    app.innerHTML = `
      <div class="state-error">
        <div class="emoji">🔍</div>
        <h2>Vertical não encontrada</h2>
        <p>${msg}</p>
        <a href="/website/" class="btn btn-primary">← Voltar ao site</a>
      </div>`;
  }

  // ── Render: vertical ──────────────────────────────────────────────────────
  function renderVertical(v) {
    // Update page title & nav
    document.title = `${v.nome} — Vendor.ai`;
    const navName = document.getElementById('nav-vertical-name');
    if (navName) navName.textContent = `/ ${v.nome}`;

    // Build benefício rows
    function beneficioHTML(list) {
      if (!list || !list.length) return '';
      return list.map(b => `
        <div class="beneficio-card">
          <span class="beneficio-icon">${b.icone}</span>
          <div style="display:flex;align-items:flex-start;gap:10px">
            <div class="beneficio-check">
              <svg viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
            </div>
            <span class="beneficio-text">${b.texto}</span>
          </div>
        </div>`).join('');
    }

    const hasResultado = v.resultadoTitulo || v.resultadoDescricao;
    const hasEsq = v.beneficiosEsquerda && v.beneficiosEsquerda.length;
    const hasDir = v.beneficiosDireita && v.beneficiosDireita.length;
    const hasBeneficios = hasEsq || hasDir;

    app.innerHTML = `
      <!-- Hero -->
      <section class="hero">
        <div class="hero-blob-1"></div>
        <div class="hero-blob-2"></div>
        <div class="container" style="position:relative;z-index:1">
          ${v.tagCategoria ? `<div class="hero-eyebrow">${v.tagCategoria}</div>` : ''}
          <h1>${v.titulo || v.nome}</h1>
          ${v.descricao ? `<p>${v.descricao}</p>` : ''}
          <div class="hero-ctas">
            <button class="btn btn-primary btn-lg" onclick="openModal()">
              Falar sobre ${v.nome}
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
            </button>
          </div>
        </div>
      </section>

      ${hasResultado || hasBeneficios ? `
      <!-- Resultado -->
      <section class="resultado">
        <div class="container">
          ${hasResultado ? `
          <div class="resultado-header">
            <div class="overline">Resultado esperado</div>
            ${v.resultadoTitulo ? `<h2 class="grad-text">${v.resultadoTitulo}</h2>` : ''}
            ${v.resultadoDescricao ? `<p>${v.resultadoDescricao}</p>` : ''}
          </div>` : ''}

          ${hasBeneficios ? `
          <div class="beneficios-grid">
            <div>${beneficioHTML(v.beneficiosEsquerda)}</div>
            <div>${beneficioHTML(v.beneficiosDireita)}</div>
          </div>` : ''}
        </div>
      </section>` : ''}

      <!-- CTA Final -->
      <section class="cta-final">
        <div class="container">
          <h2>Pronto para transformar seu negócio de <span class="grad-text">${v.nome.toLowerCase()}</span>?</h2>
          <p>Veja nossos planos e escolha o que melhor se encaixa na sua operação.</p>
          <div class="cta-buttons">
            <button class="btn btn-primary btn-lg" onclick="openModal()">Falar com especialista</button>
            <a href="/website/#planos" class="btn btn-outline btn-lg">Ver planos →</a>
          </div>
        </div>
      </section>
    `;

    // Store vertical info for modal
    window._currentVertical = { nome: v.nome, slug: v.slug };
    renderModalForm();
  }

  // ── Modal ─────────────────────────────────────────────────────────────────
  function renderModalForm() {
    const v = window._currentVertical || { nome: 'esta vertical', slug: '' };
    modalContent.innerHTML = `
      <h3>Falar sobre ${v.nome}</h3>
      <p class="modal-sub">Preencha abaixo e nossa equipe especializada retorna em breve.</p>
      <form id="contato-form">
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="f-nome">Nome *</label>
            <input class="form-input" id="f-nome" name="nome" required placeholder="João Silva">
          </div>
          <div class="form-group">
            <label class="form-label" for="f-empresa">Empresa</label>
            <input class="form-input" id="f-empresa" name="empresa" placeholder="Sua Empresa">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="f-email">E-mail *</label>
            <input class="form-input" id="f-email" name="email" type="email" required placeholder="joao@empresa.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="f-telefone">Telefone</label>
            <input class="form-input" id="f-telefone" name="telefone" placeholder="(11) 99999-9999">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="f-mensagem">Mensagem *</label>
          <textarea class="form-textarea" id="f-mensagem" name="mensagem" required>Tenho interesse na vertical ${v.nome}</textarea>
        </div>
        <button class="form-submit" type="submit" id="form-submit-btn">Enviar mensagem</button>
      </form>
    `;

    document.getElementById('contato-form').addEventListener('submit', submitForm);
  }

  async function submitForm(e) {
    e.preventDefault();
    const btn = document.getElementById('form-submit-btn');
    btn.disabled = true;
    btn.textContent = 'Enviando...';

    const v = window._currentVertical || { nome: '', slug: '' };
    const data = {
      nome: document.getElementById('f-nome').value,
      email: document.getElementById('f-email').value,
      empresa: document.getElementById('f-empresa').value,
      telefone: document.getElementById('f-telefone').value,
      mensagem: document.getElementById('f-mensagem').value,
      origem: `vertical_${v.slug}`,
    };

    try {
      const res = await fetch(`${API_BASE}/site/contato`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data),
      });
      if (!res.ok) {
        const body = await res.json().catch(() => ({}));
        throw new Error(body.details?.join(', ') || body.error || 'Erro ao enviar');
      }
      // Success state
      modalContent.innerHTML = `
        <div class="success-state">
          <div class="success-icon">✅</div>
          <h3>Mensagem enviada!</h3>
          <p>Recebemos seu contato.<br>Nossa equipe especializada em <strong>${v.nome}</strong> retornará em breve.</p>
          <button class="btn btn-primary" onclick="closeModal()">Fechar</button>
        </div>
      `;
    } catch (err) {
      btn.disabled = false;
      btn.textContent = 'Enviar mensagem';
      alert('Erro ao enviar: ' + (err.message || 'Tente novamente.'));
    }
  }

  // ── Modal open/close ──────────────────────────────────────────────────────
  window.openModal = function() {
    renderModalForm();
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
  };
  window.closeModal = function() {
    overlay.classList.remove('open');
    document.body.style.overflow = '';
  };

  document.getElementById('modal-close').addEventListener('click', closeModal);
  overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
})();
</script>
</body>
</html>
