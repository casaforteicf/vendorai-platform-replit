kind = "web"
previewPath = "/website/"
title = "VendorAI \u2014 Site Institucional"
version = "1.0.0"
id = "artifacts/website"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/website/" ]
localPort = 19161

[services.development]
run = "pnpm --filter @workspace/website run serve"

[services.production]
build = [ "sh", "-c", "rm -rf artifacts/website/dist/public && mkdir -p artifacts/website/dist/public/website && cp artifacts/website/index.html artifacts/website/dist/public/website/index.html && cp artifacts/website/index.html artifacts/website/dist/public/index.html" ]
publicDir = "artifacts/website/dist/public"
serve = "static"

[services.env]
PORT = "19161"
