<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900"><rect width="1400" height="900" rx="40" fill="#07101b"/><rect x="70" y="70" width="1260" height="760" rx="30" fill="#0f172a" stroke="#263244"/><text x="115" y="140" font-family="Arial" font-size="34" font-weight="700" fill="#fff">VendorAI • Orçamentos de esquadrias em risco</text><text x="115" y="183" font-family="Arial" font-size="21" fill="#94a3b8">Projeto, medida, orçamento, responsável e próxima ação no mesmo fluxo</text><rect x="115" y="235" width="400" height="510" rx="26" fill="#111827" stroke="#334155"/><text x="150" y="285" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Fila comercial</text><rect x="150" y="330" width="330" height="82" rx="18" fill="#1f2937"/><circle cx="185" cy="371" r="14" fill="#f97316"/><text x="215" y="360" font-family="Arial" font-size="19" fill="#fff">Orçamento sem retorno</text><text x="215" y="390" font-family="Arial" font-size="15" fill="#94a3b8">Casa alto padrão • 3 dias</text><rect x="150" y="435" width="330" height="82" rx="18" fill="#1f2937"/><circle cx="185" cy="476" r="14" fill="#f59e0b"/><text x="215" y="465" font-family="Arial" font-size="19" fill="#fff">Medição pendente</text><text x="215" y="495" font-family="Arial" font-size="15" fill="#94a3b8">Próxima ação: confirmar visita</text><rect x="150" y="540" width="330" height="82" rx="18" fill="#1f2937"/><circle cx="185" cy="581" r="14" fill="#22c55e"/><text x="215" y="570" font-family="Arial" font-size="19" fill="#fff">Projeto quente</text><text x="215" y="600" font-family="Arial" font-size="15" fill="#94a3b8">Arquiteto + cliente envolvidos</text><rect x="555" y="235" width="730" height="230" rx="26" fill="#111827" stroke="#334155"/><text x="595" y="285" font-family="Arial" font-size="21" font-weight="700" fill="#fff">Onde a venda está vazando</text><text x="595" y="345" font-family="Arial" font-size="18" fill="#94a3b8">Lead → Projeto → Medição → Orçamento → Follow-up → Fechamento</text><rect x="595" y="385" width="600" height="22" rx="11" fill="#334155"/><rect x="595" y="385" width="420" height="22" rx="11" fill="#f97316"/><rect x="555" y="500" width="350" height="245" rx="26" fill="#111827" stroke="#334155"/><text x="595" y="550" font-family="Arial" font-size="20" font-weight="700" fill="#fff">Sinais detectados</text><text x="595" y="610" font-family="Arial" font-size="18" fill="#f97316">• Proposta sem resposta</text><text x="595" y="650" font-family="Arial" font-size="18" fill="#f59e0b">• Medição sem agenda</text><text x="595" y="690" font-family="Arial" font-size="18" fill="#22c55e">• Obra com alta intenção</text><rect x="940" y="500" width="345" height="245" rx="26" fill="#111827" stroke="#334155"/><text x="980" y="550" font-family="Arial" font-size="20" font-weight="700" fill="#fff">Próxima melhor ação</text><rect x="980" y="610" width="250" height="54" rx="27" fill="#f97316"/><text x="1020" y="644" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Retomar agora</text></svg>