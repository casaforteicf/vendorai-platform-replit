<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900"><rect width="1400" height="900" rx="40" fill="#07101b"/><rect x="60" y="60" width="1280" height="780" rx="32" fill="#0f172a" stroke="#263244"/><text x="105" y="130" font-family="Arial" font-size="34" font-weight="700" fill="#fff">VendorAI • Oportunidades de piscinas em risco</text><text x="105" y="176" font-family="Arial" font-size="21" fill="#94a3b8">Visita, orçamento, próxima ação e pós-venda no mesmo fluxo</text><rect x="105" y="235" width="400" height="500" rx="26" fill="#111827" stroke="#334155"/><text x="145" y="285" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Fila inteligente</text><rect x="145" y="325" width="320" height="78" rx="18" fill="#1f2937"/><circle cx="180" cy="364" r="14" fill="#f97316"/><text x="210" y="355" font-family="Arial" font-size="18" fill="#fff">Visita realizada</text><text x="210" y="383" font-family="Arial" font-size="15" fill="#94a3b8">Sem próxima ação • 1 dia</text><rect x="145" y="425" width="320" height="78" rx="18" fill="#1f2937"/><circle cx="180" cy="464" r="14" fill="#f59e0b"/><text x="210" y="455" font-family="Arial" font-size="18" fill="#fff">Orçamento aberto</text><text x="210" y="483" font-family="Arial" font-size="15" fill="#94a3b8">Follow-up hoje 15:00</text><rect x="145" y="525" width="320" height="78" rx="18" fill="#1f2937"/><circle cx="180" cy="564" r="14" fill="#22c55e"/><text x="210" y="555" font-family="Arial" font-size="18" fill="#fff">Cliente antigo</text><text x="210" y="583" font-family="Arial" font-size="15" fill="#94a3b8">Reativação: manutenção</text><rect x="550" y="235" width="735" height="220" rx="28" fill="#111827" stroke="#334155"/><text x="590" y="285" font-family="Arial" font-size="22" font-weight="700" fill="#fff">Onde a venda está vazando</text><text x="590" y="340" font-family="Arial" font-size="18" fill="#94a3b8">Lead → Visita → Projeto → Orçamento → Follow-up → Fechamento</text><rect x="590" y="385" width="610" height="18" rx="9" fill="#334155"/><rect x="590" y="385" width="455" height="18" rx="9" fill="#f97316"/><rect x="550" y="505" width="350" height="230" rx="28" fill="#111827" stroke="#334155"/><text x="590" y="555" font-family="Arial" font-size="20" font-weight="700" fill="#fff">Sinais detectados</text><text x="590" y="610" font-family="Arial" font-size="17" fill="#f97316">• Orçamento sem retorno</text><text x="590" y="650" font-family="Arial" font-size="17" fill="#f59e0b">• Visita sem prazo</text><text x="590" y="690" font-family="Arial" font-size="17" fill="#22c55e">• Cliente para reativar</text><rect x="935" y="505" width="350" height="230" rx="28" fill="#111827" stroke="#334155"/><text x="975" y="555" font-family="Arial" font-size="20" font-weight="700" fill="#fff">Próxima melhor ação</text><rect x="975" y="615" width="245" height="52" rx="26" fill="#f97316"/><text x="1014" y="648" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Retomar agora</text></svg>