  <body>
    <div id="root"></div>

    <!--
      Fallback de sessão: se uma rota autenticada permanecer apenas no spinner
      por tempo demais, reconstruímos somente a identidade mínima a partir das
      claims do JWT já assinado pelo backend e recarregamos uma única vez.
      Isso evita loading infinito quando /auth/me sofre falha transitória, sem
      substituir as autorizações do backend nem sobrescrever um cache válido.
    -->
    <script>
      (() => {
        const TOKEN_KEY = "vendorai_token";
        const USER_CACHE_KEY = "vendorai_user_cache";
        const RECOVERY_KEY = "vendorai_session_bootstrap_recovery_at";
        const RECOVERY_DELAY_MS = 12_000;
        const RECOVERY_WINDOW_MS = 60_000;

        function decodeClaims(token) {
          try {
            const part = token.split(".")[1];
            if (!part) return null;
            const base64 = part.replace(/-/g, "+").replace(/_/g, "/");
            const padded = base64.padEnd(base64.length + ((4 - (base64.length % 4)) % 4), "=");
            return JSON.parse(atob(padded));
          } catch (_) {
            return null;
          }
        }

        function seedTrustedUserCache() {
          try {
            const token = localStorage.getItem(TOKEN_KEY);
            if (!token) return false;
            const claims = decodeClaims(token);
            if (!claims) return false;
            if (
              typeof claims.sub !== "string" ||
              typeof claims.tenantId !== "string" ||
              typeof claims.platformRole !== "string" ||
              typeof claims.email !== "string"
            ) {
              return false;
            }
            if (typeof claims.exp === "number" && claims.exp * 1000 <= Date.now()) return false;

            try {
              const currentRaw = localStorage.getItem(USER_CACHE_KEY);
              const current = currentRaw ? JSON.parse(currentRaw) : null;
              if (
                current?.id === claims.sub &&
                current?.tenantId === claims.tenantId &&
                current?.platformRole === claims.platformRole &&
                current?.email === claims.email
              ) {
                return true;
              }
            } catch (_) {
              // Cache inválido será substituído apenas pelas claims assinadas do JWT.
            }

            localStorage.setItem(
              USER_CACHE_KEY,
              JSON.stringify({
                id: claims.sub,
                tenantId: claims.tenantId,
                platformRole: claims.platformRole,
                email: claims.email,
                name:
                  typeof claims.name === "string" && claims.name.trim()
                    ? claims.name.trim()
                    : claims.email.split("@")[0],
              }),
            );
            return true;
          } catch (_) {
            return false;
          }
        }

        window.setTimeout(() => {
          try {
            if (!localStorage.getItem(TOKEN_KEY)) return;
            const root = document.getElementById("root");
            if (!root) return;
            const spinner = root.querySelector(".animate-spin");
            const hasVisibleText = Boolean(root.textContent?.trim());
            if (!spinner || hasVisibleText) return;

            const now = Date.now();
            const lastRecoveryAt = Number(sessionStorage.getItem(RECOVERY_KEY) || "0");
            if (now - lastRecoveryAt < RECOVERY_WINDOW_MS) return;
            if (!seedTrustedUserCache()) return;

            sessionStorage.setItem(RECOVERY_KEY, String(now));
            const url = new URL(window.location.href);
            url.searchParams.set("__session_recovery", String(now));
            window.location.replace(url.toString());
          } catch (_) {
            // Recuperação é best-effort e nunca pode impedir o carregamento normal.
          }
        }, RECOVERY_DELAY_MS);
      })();
    </script>

    <!--
      Watchdog: presa na tela de login mesmo com token já gravado.
      O fallback de sessão acima só cobre o caso "preso no spinner sem
      texto nenhum". Existe um outro estado travado real, visto em
      produção: o login termina (POST /auth/login 200), o token já foi
      escrito no localStorage, mas a troca de tela pro dashboard nunca
      chega a pintar — o formulário de login continua visível e o botão
      fica preso em "Entrando...". Isso acontece com JS ainda "vivo" o
      bastante pra escrever no localStorage, mas o processo trava logo
      depois (main thread ocupado ou preso) antes do próximo paint. Esse
      watchdog detecta esse estado específico e força um reload completo,
      que começa a execução do zero e quebra qualquer travamento do lado
      do JS antigo.
    -->
    <script>
      (() => {
        const TOKEN_KEY = "vendorai_token";
        const STUCK_RECOVERY_KEY = "vendorai_stuck_login_recovery_at";
        const STUCK_RECOVERY_WINDOW_MS = 60_000;
        const STUCK_CHECK_DELAY_MS = 6_000;

        window.setTimeout(() => {
          try {
            if (!localStorage.getItem(TOKEN_KEY)) return;

            const submitButtons = Array.from(document.querySelectorAll("button[type='submit']"));
            const stillOnLoginForm = submitButtons.some((button) => {
              const text = button.textContent || "";
              return /entrando/i.test(text) || /entering/i.test(text);
            });
            if (!stillOnLoginForm) return;

            const now = Date.now();
            const lastRecoveryAt = Number(sessionStorage.getItem(STUCK_RECOVERY_KEY) || "0");
            if (now - lastRecoveryAt < STUCK_RECOVERY_WINDOW_MS) return;

            sessionStorage.setItem(STUCK_RECOVERY_KEY, String(now));
            const url = new URL(window.location.href);
            url.searchParams.set("__stuck_login_recovery", String(now));
            window.location.replace(url.toString());
          } catch (_) {
            // Recuperação é best-effort e nunca pode impedir o carregamento normal.
          }
        }, STUCK_CHECK_DELAY_MS);
      })();
    </script>

    <!--
      Este guard precisa existir ANTES do entry module do Vite. Usuários podem
      manter o VendorAI aberto enquanto um deploy troca os hashes em /assets.
      Nesse intervalo o HTML/JS antigo pode tentar buscar chunks que já não
      existem. O guard detecta a falha ainda no bootstrap, limpa estado web
      obsoleto e busca uma única vez o HTML atual com cache-busting.
    -->
    <script>
      (() => {
        const RECOVERY_AT_KEY = "vendorai_stale_asset_recovery_at";
        const RECOVERY_WINDOW_MS = 30_000;
        const CHUNK_ERROR_PATTERN = /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|ChunkLoadError|Loading chunk|Unable to preload CSS|Expected a JavaScript-or-Wasm module script|module script.*MIME|MIME type.*text\/html|disallowed MIME type|server responded with a MIME type of ["']?text\/html/i;

        async function clearObsoleteFrontendState() {
          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(registrations.map((registration) => registration.unregister()));
            }
          } catch (_) {
            // Best effort: falha na limpeza nunca pode impedir o CRM de abrir.
          }

          try {
            if ("caches" in window) {
              const cacheNames = await caches.keys();
              await Promise.allSettled(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }
          } catch (_) {
            // Mesmo princípio para Cache Storage.
          }
        }

        async function recoverLatestVersion(reason) {
          const now = Date.now();
          const lastRecoveryAt = Number(sessionStorage.getItem(RECOVERY_AT_KEY) || "0");
          if (now - lastRecoveryAt < RECOVERY_WINDOW_MS) return;

          sessionStorage.setItem(RECOVERY_AT_KEY, String(now));
          console.warn(`[VendorAI] Asset desatualizado (${reason}); carregando versão atual.`);
          await clearObsoleteFrontendState();

          const url = new URL(window.location.href);
          url.searchParams.set("__vendorai_refresh", String(now));
          window.location.replace(url.toString());
        }

        window.addEventListener("vite:preloadError", (event) => {
          event.preventDefault();
          void recoverLatestVersion("falha de preload");
        });

        // Captura 404 de script/link antes que o React e o guard pós-bootstrap
        // tenham sequer conseguido montar.
        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            const assetUrl =
              target instanceof HTMLScriptElement
                ? target.src
                : target instanceof HTMLLinkElement
                  ? target.href
                  : "";
            if (!assetUrl.includes("/assets/")) return;
            void recoverLatestVersion("asset não encontrado");
          },
          true,
        );

        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          const message = reason instanceof Error ? reason.message : String(reason ?? "");
          if (!CHUNK_ERROR_PATTERN.test(message)) return;
          event.preventDefault();
          void recoverLatestVersion("import dinâmico");
        });
      })();
    </script>

    <!-- Diagnóstico temporário de tela removido de produção.
         Erros de runtime continuam sendo coletados pelos bridges/telemetria sem bloquear a interface. -->

    <script type="module" src="/src/main.tsx"></script>
  </body>
