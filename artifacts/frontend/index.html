    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>

    <!--
      Este guard precisa existir ANTES do entry module do Vite. Usuários podem
      manter o VendorAI aberto enquanto um deploy troca os hashes em /assets.
      Nesse intervalo o HTML/JS antigo pode tentar buscar chunks que já não
      existem. O guard detecta a falha ainda no bootstrap, limpa estado web
      obsoleto e busca uma única vez o HTML atual com cache-busting.
    -->
    <script>
      (() => {
        const RECOVERY_AT_KEY = "vendorai_stale_asset_recovery_at";
        const RECOVERY_WINDOW_MS = 30_000;
        const CHUNK_ERROR_PATTERN = /Failed to fetch dynamically imported module|Importing a module script failed|error loading dynamically imported module|ChunkLoadError|Loading chunk|Unable to preload CSS|Expected a JavaScript-or-Wasm module script|module script.*MIME|MIME type.*text\/html|disallowed MIME type|server responded with a MIME type of ["']?text\/html/i;

        async function clearObsoleteFrontendState() {
          try {
            if ("serviceWorker" in navigator) {
              const registrations = await navigator.serviceWorker.getRegistrations();
              await Promise.allSettled(registrations.map((registration) => registration.unregister()));
            }
          } catch (_) {
            // Best effort: falha na limpeza nunca pode impedir o CRM de abrir.
          }

          try {
            if ("caches" in window) {
              const cacheNames = await caches.keys();
              await Promise.allSettled(cacheNames.map((cacheName) => caches.delete(cacheName)));
            }
          } catch (_) {
            // Mesmo princípio para Cache Storage.
          }
        }

        async function recoverLatestVersion(reason) {
          const now = Date.now();
          const lastRecoveryAt = Number(sessionStorage.getItem(RECOVERY_AT_KEY) || "0");
          if (now - lastRecoveryAt < RECOVERY_WINDOW_MS) return;

          sessionStorage.setItem(RECOVERY_AT_KEY, String(now));
          console.warn(`[VendorAI] Asset desatualizado (${reason}); carregando versão atual.`);
          await clearObsoleteFrontendState();

          const url = new URL(window.location.href);
          url.searchParams.set("__vendorai_refresh", String(now));
          window.location.replace(url.toString());
        }

        window.addEventListener("vite:preloadError", (event) => {
          event.preventDefault();
          void recoverLatestVersion("falha de preload");
        });

        // Captura 404 de script/link antes que o React e o guard pós-bootstrap
        // tenham sequer conseguido montar.
        window.addEventListener(
          "error",
          (event) => {
            const target = event.target;
            const assetUrl =
              target instanceof HTMLScriptElement
                ? target.src
                : target instanceof HTMLLinkElement
                  ? target.href
                  : "";
            if (!assetUrl.includes("/assets/")) return;
            void recoverLatestVersion("asset não encontrado");
          },
          true,
        );

        window.addEventListener("unhandledrejection", (event) => {
          const reason = event.reason;
          const message = reason instanceof Error ? reason.message : String(reason ?? "");
          if (!CHUNK_ERROR_PATTERN.test(message)) return;
          event.preventDefault();
          void recoverLatestVersion("import dinâmico");
        });
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
