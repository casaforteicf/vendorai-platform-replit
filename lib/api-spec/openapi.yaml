          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent action log found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateAgentActionLog
      tags: [agent-action-logs]
      summary: Update agent action log (e.g. change status)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
