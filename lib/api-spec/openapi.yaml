          type: string
        leadId:
          type: string
          nullable: true
        leadNome:
          type: string
          nullable: true
      required: [dealId, titulo, etapa]

    TenantDashboard:
      type: object
      properties:
        leads:
          type: object
          properties:
            total:
              type: integer
            novosUltimos30Dias:
              type: integer
          required: [total, novosUltimos30Dias]
        deals:
          type: object
          properties:
            porEtapa:
              type: object
              additionalProperties:
                type: integer
              description: Map of etapa → count (only stages with at least one deal present)
            totalEmNegociacao:
              type: string
              description: Sum of valor for open deals (não ganho/perdido) as decimal string
            totalDeals:
              type: integer
            taxaConversao:
              type: number
              description: ganho / totalDeals (0–1 range, 4 decimal places)
          required: [porEtapa, totalEmNegociacao, totalDeals, taxaConversao]
        atividadesAtrasadas:
          type: integer
          description: Activities with status=pendente and dataVencimento in the past
        churnRiskDistribuicao:
          type: object
          properties:
            baixo:
              type: integer
              description: churnRisk < 30
            medio:
              type: integer
              description: 30 <= churnRisk <= 70
            alto:
              type: integer
              description: churnRisk > 70
          required: [baixo, medio, alto]
        top5ChurnRisk:
          type: array
          description: Top 5 leads ordered by churnRisk descending
          items:
            $ref: "#/components/schemas/DashboardLeadEntry"
        ganhosMes:
          type: object
          properties:
            count:
              type: integer
            somaValor:
              type: string
          required: [count, somaValor]
        ticketMedio:
          type: string
          nullable: true
          description: Average valor of ganho deals as decimal string, or null if none
        propostas:
          type: object
          properties:
            ativas:
              type: object
              properties:
                count:
                  type: integer
                somaValor:
                  type: string
              required: [count, somaValor]
          required: [ativas]
        dealsPorTipoFechamento:
          type: object
          additionalProperties:
            type: integer
          description: Map of tipoFechamento → count for all deals
        topOportunidades:
          type: array
          description: Top 8 open deals ordered by probabilidade desc
          items:
            $ref: "#/components/schemas/DashboardOportunidade"
        faixaEtaria:
          type: object
          properties:
            naoInformado:
              type: integer
            ate25:
              type: integer
            de26a35:
              type: integer
            de36a45:
              type: integer
            de46a55:
              type: integer
            acima55:
              type: integer
          required: [naoInformado, ate25, de26a35, de36a45, de46a55, acima55]
        diasSemanaGanhos:
          type: object
          additionalProperties:
            type: integer
          description: Map of dayOfWeek (0=Sun..6=Sat) to count of ganho deals in last 6 months
        negocioPerfil:
          type: object
          nullable: true
          properties:
            razaoSocial:
              type: string
            nomeFantasia:
              type: string
              nullable: true
            endereco:
              type: string
              nullable: true
            telefone:
              type: string
              nullable: true
            email:
              type: string
              nullable: true
            publicoAlvo:
              type: string
              nullable: true
            vertical:
              type: string
              nullable: true
            canaisVenda:
              type: array
              nullable: true
              items:
                type: string
            diferenciais:
              type: string
              nullable: true
            concorrentes:
              type: array
              nullable: true
              items:
                type: string
            produtos:
              type: array
              nullable: true
              items:
                type: object
                properties:
                  nome:
                    type: string
                  descricao:
                    type: string
                    nullable: true
                  preco:
                    type: number
                    nullable: true
                required: [nome]
        perfilCompra:
          type: object
          description: Aggregated purchase profile metrics for AI analysis
          properties:
            doresPrincipais:
              type: array
              items:
                type: object
                properties:
                  valor:
                    type: string
                  count:
                    type: integer
                required: [valor, count]
            urgenciaDistribuicao:
              type: object
              additionalProperties:
                type: integer
            orcamentoDistribuicao:
              type: object
              additionalProperties:
                type: integer
            b2bVsB2c:
              type: object
              properties:
                b2b:
                  type: integer
                b2c:
                  type: integer
              required: [b2b, b2c]
            tempoMedioFechamentoDias:
              type: number
              nullable: true
            motivosPerda:
              type: array
              items:
                type: object
                properties:
                  valor:
                    type: string
                  count:
                    type: integer
                required: [valor, count]
            planosRecomendados:
              type: object
              additionalProperties:
                type: integer
          required:
            - doresPrincipais
            - urgenciaDistribuicao
            - orcamentoDistribuicao
            - b2bVsB2c
            - motivosPerda
            - planosRecomendados
      required:
