          nullable: true
        asaasInvoiceId:
          type: string
          nullable: true
        linkPagamento:
          type: string
          nullable: true
        dataVencimento:
          type: string
          format: date-time
        dataPagamento:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, subscriptionId, valor, status, dataVencimento, createdAt, updatedAt]

    CreateInvoiceBody:
      type: object
      properties:
        tenantId:
          type: string
        subscriptionId:
          type: string
        valor:
          oneOf:
            - type: string
            - type: number
        status:
          $ref: "#/components/schemas/InvoiceStatus"
        formaPagamento:
          $ref: "#/components/schemas/InvoiceFormaPagamento"
        asaasInvoiceId:
          type: string
        linkPagamento:
          type: string
        dataVencimento:
          type: string
          format: date-time
        dataPagamento:
          type: string
          format: date-time
      required: [tenantId, subscriptionId, valor, dataVencimento]

    UpdateInvoiceBody:
