          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentActionLogBody"
      responses:
        "200":
          description: Updated agent action log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentActionLog"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
