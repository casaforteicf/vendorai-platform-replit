components:
  schemas:
    CreateInviteBody:
      type: object
      properties:
        tenantId:
          type: string
        email:
          type: string
          format: email
      required:
        - tenantId
        - email

    CreateSellerInviteBody:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
      required:
        - email

    CreateTenantInviteBody:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
        - email

    AcceptInviteBody:
      type: object
      properties:
        token:
          type: string
        name:
          type: string
        password:
          type: string
          minLength: 8
      required:
        - token
        - name
        - password

    InviteCreatedResponse:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
        role:
          type: string
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        inviteUrl:
          type: string
      required:
        - id
        - tenantId
        - email
        - role
        - token
        - expiresAt
        - inviteUrl

    InviteDetails:
      type: object
      properties:
        tenantId:
          type: string
        tenantName:
          type: string
        email:
          type: string
        role:
          type: string
        expiresAt:
          type: string
          format: date-time
      required:
        - tenantId
        - tenantName
        - email
        - role
        - expiresAt

    InviteItem:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        email:
          type: string
        role:
          type: string
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        inviteUrl:
          type: string
      required:
        - id
        - tenantId
        - email
        - token
        - expiresAt
        - createdAt
        - inviteUrl

    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

