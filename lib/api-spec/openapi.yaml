        telefone:
          type: string
          nullable: true
        churnRisk:
          type: integer
          nullable: true
      required: [leadId, churnRisk]

    DashboardOportunidade:
      type: object
      properties:
        dealId:
          type: string
        titulo:
          type: string
        valor:
          type: string
          nullable: true
        probabilidade:
          type: integer
          nullable: true
