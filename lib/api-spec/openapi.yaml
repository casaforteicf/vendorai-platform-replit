    get:
      operationId: checkAgendamentoDisponibilidade
      tags: [schedule-hub]
      summary: Check schedule availability for a responsavel
      description: |
        Returns whether a given responsavel has no scheduling conflicts in the
        requested time window. Conflict detection uses interval overlap:
        agendamento.dataHoraInicio < to AND agendamento.dataHoraFim > from.
        Only active (non-cancelled, non-concluido) records are counted.
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
        - name: responsavelId
          in: query
          required: true
          schema:
            type: string
        - name: from
          in: query
          required: true
          description: Start of the window to check (ISO 8601)
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          description: End of the window to check (ISO 8601)
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Availability result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgendamentoDisponibilidade"
        "422":
          description: Missing or invalid query params
          content:
