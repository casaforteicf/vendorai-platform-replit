components:
  schemas:
    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RegisterBody:
      type: object
      properties:
        tenantName:
          type: string
        tenantSlug:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - tenantName
        - tenantSlug
        - name
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TenantStatus:
      type: string
      enum: [active, suspended, cancelled]

    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        vertical:
          type: string
          nullable: true
        agentsEnabled:
          type: object
          additionalProperties: true
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        tokensUsedCurrentMonth:
          type: integer
        dailyMessageLimit:
          type: integer
          nullable: true
        messagesSentToday:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - tokensUsedCurrentMonth
        - messagesSentToday
        - createdAt
        - updatedAt

    CreateTenantBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        vertical:
          type: string
          nullable: true
        agentsEnabled:
          type: object
          additionalProperties: true
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        dailyMessageLimit:
          type: integer
          nullable: true
      required:
        - name
        - slug

    UpdateTenantBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        vertical:
          type: string
          nullable: true
        agentsEnabled:
          type: object
          additionalProperties: true
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        tokensUsedCurrentMonth:
          type: integer
        dailyMessageLimit:
          type: integer
          nullable: true
        messagesSentToday:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UserRole:
