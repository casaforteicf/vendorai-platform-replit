          nullable: true
          description: Logo URL for co-branding in the dashboard header
        agentsEnabled:
          type: object
          additionalProperties: true
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        tokensUsedCurrentMonth:
          type: integer
        dailyMessageLimit:
          type: integer
          nullable: true
        messagesSentToday:
          type: integer
        analysisStalenessHours:
          type: ["integer", "null"]
          description: >
            Per-tenant override for how many hours must pass before a lead is considered
            stale and auto-reanalyzed. Null means fall back to the global ANALYSIS_STALENESS_HOURS env var.
        analysisMessageThreshold:
          type: ["integer", "null"]
          description: >
            Per-tenant override for how many new messages since the last analysis trigger
            an automatic re-analysis. Null means fall back to the global ANALYSIS_MESSAGE_THRESHOLD env var.
        maxAnalysesPerHour:
          type: ["integer", "null"]
          description: >
            Per-tenant override for the maximum number of AI analyses allowed per rolling
            hour window. Null means fall back to the global MAX_ANALYSES_PER_TENANT_PER_HOUR env var.
        subdomainSlug:
          type: string
          nullable: true
          description: Subdomain slug for *.vendor.ai automatic assignment.
        tipoFechamentoDefault:
          $ref: "#/components/schemas/TipoFechamento"
          nullable: true
          description: Tipo de fechamento padrão para novos deals deste tenant. Null significa 'pedido'.
        mensalidadeValor:
          type: number
          nullable: true
          description: Valor da mensalidade recorrente (copiado do deal ao ganhar). Usado para cobrança mensal no dia 5.
        provisioningMethod:
          type: string
          nullable: true
          enum: [self_service, manual, trial]
          description: How this tenant was created.
        createdByAdminId:
          type: string
          nullable: true
        accessSentAt:
          type: string
          format: date-time
          nullable: true
          description: When the welcome/access email was last sent by a super admin.
        firstLoginAt:
          type: string
          format: date-time
          nullable: true
          description: Timestamp of the first login by this tenant's admin user.
        internalNotes:
          type: string
          nullable: true
          description: Internal notes visible only to super admins.
        onboardingConcluido:
          type: boolean
          default: false
          description: Whether the main onboarding wizard (steps 1-4) has been completed.
        integracoesConcluido:
          type: boolean
          default: false
          description: Whether the integrations onboarding has been completed.
        googleReviewLink:
          type: string
          nullable: true
          description: >
            Link para avaliação do Google configurado pelo tenant. Usado pelo agente
            Pós-Venda para solicitar avaliações apenas quando o cliente relata uma
            experiência positiva na pesquisa de satisfação pós-entrega. Vazio por padrão.
        googleAdsConversionId:
          type: string
          nullable: true
          description: >
            ID de conversão do Google Ads da conta do próprio tenant, usado nos sites
            gerados pelo Vendor.ai para esse tenant. Independente da tag do site
            institucional appvendorai.com.
        metaPixelId:
          type: string
          nullable: true
          description: >
            ID do Meta Pixel da conta do próprio tenant, usado nos sites gerados pelo
            Vendor.ai para esse tenant.
        linkedinInsightTagId:
          type: string
          nullable: true
          description: Partner ID do LinkedIn Insight Tag da conta do tenant.
        tiktokPixelId:
          type: string
          nullable: true
          description: ID do TikTok Pixel da conta do tenant.
        confirmarEstoqueAntesFinanceiro:
          type: boolean
          default: false
          description: >
            Quando true, o fechamento de negócios pausa em uma etapa de conferência de
            estoque antes de gerar contrato/cobrança, aguardando aprovação do usuário
            responsável.
        usuarioConferenciaEstoqueId:
          type: string
          nullable: true
          description: >
            ID do usuário responsável por confirmar a disponibilidade em estoque antes
            do fechamento financeiro (sem FK formal para evitar import circular).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - tokensUsedCurrentMonth
        - messagesSentToday
        - createdAt
        - updatedAt

