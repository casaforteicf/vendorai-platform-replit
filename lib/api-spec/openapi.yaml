components:
  schemas:
    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RegisterBody:
      type: object
      properties:
        tenantName:
          type: string
        tenantSlug:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - tenantName
        - tenantSlug
        - name
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TenantStatus:
      type: string
      enum: [active, suspended, cancelled]

    UsageSummary:
      type: object
      properties:
        messages:
          type: object
          properties:
            sent:
              type: integer
            limit:
              type: integer
            percentUsed:
              type: integer
            nearLimit:
              type: boolean
            overLimit:
              type: boolean
          required: [sent, limit, percentUsed, nearLimit, overLimit]
        tokens:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
            percentUsed:
              type: integer
            nearLimit:
              type: boolean
            overLimit:
              type: boolean
          required: [used, limit, percentUsed, nearLimit, overLimit]
      required: [messages, tokens]

    DealEtapa:
      type: string
      enum: [novo, qualificado, proposta, negociacao, ganho, perdido]

    Funil:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        nome:
          type: string
        etapas:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, nome, etapas, createdAt, updatedAt]

    CreateFunilBody:
      type: object
      properties:
        tenantId:
          type: string
        nome:
          type: string
        etapas:
          type: array
          items:
            type: string
      required: [tenantId, nome]

    UpdateFunilBody:
      type: object
      properties:
        nome:
          type: string
        etapas:
          type: array
          items:
            type: string

    Deal:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        leadId:
          type: string
          nullable: true
        titulo:
          type: string
        valor:
          type: string
          nullable: true
          description: Decimal stored as string (Postgres numeric)
        etapa:
          $ref: "#/components/schemas/DealEtapa"
        funilId:
          type: string
          nullable: true
        probabilidade:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        dataFechamentoPrevista:
          type: string
          format: date-time
          nullable: true
        motivoPerda:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, titulo, etapa, createdAt, updatedAt]

    CreateDealBody:
      type: object
      properties:
        tenantId:
          type: string
        leadId:
          type: string
        titulo:
          type: string
        valor:
          type: number
        etapa:
          $ref: "#/components/schemas/DealEtapa"
        funilId:
          type: string
        probabilidade:
          type: integer
          minimum: 0
          maximum: 100
        dataFechamentoPrevista:
          type: string
          format: date-time
        motivoPerda:
          type: string
      required: [tenantId, titulo]

    UpdateDealBody:
      type: object
      properties:
        leadId:
          type: string
        titulo:
          type: string
        valor:
          type: number
        etapa:
          $ref: "#/components/schemas/DealEtapa"
        funilId:
          type: string
        probabilidade:
          type: integer
          minimum: 0
          maximum: 100
        dataFechamentoPrevista:
          type: string
          format: date-time
        motivoPerda:
          type: string

    IncrementBody:
      type: object
      properties:
        count:
          type: integer
          minimum: 1
          default: 1
      required:
        - count

    AgentEntry:
      type: object
      properties:
        enabled:
          type: boolean
          default: false
        prompt:
          type: string
          nullable: true

    AgentsMap:
      type: object
      properties:
        sdr:
          $ref: "#/components/schemas/AgentEntry"
        closer:
          $ref: "#/components/schemas/AgentEntry"
        followup:
          $ref: "#/components/schemas/AgentEntry"
        reactivation:
          $ref: "#/components/schemas/AgentEntry"
        scheduler:
          $ref: "#/components/schemas/AgentEntry"
        service:
          $ref: "#/components/schemas/AgentEntry"
        onboarding:
          $ref: "#/components/schemas/AgentEntry"

    AgentConfig:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        agents:
          $ref: "#/components/schemas/AgentsMap"
        dailyMessageLimit:
          type: integer
          default: 100
        messagesSentToday:
          type: integer
          default: 0
        monthlyTokenLimit:
          type: integer
          default: 100000
        tokensUsedCurrentMonth:
          type: integer
          default: 0
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
          description: Computed as setupCompletedAt + 5 days. Before this timestamp, agent actions require manual approval.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - agents
        - dailyMessageLimit
        - messagesSentToday
        - monthlyTokenLimit
        - tokensUsedCurrentMonth
        - createdAt
        - updatedAt

    CreateAgentConfigBody:
      type: object
      properties:
        tenantId:
          type: string
        agents:
          $ref: "#/components/schemas/AgentsMap"
        dailyMessageLimit:
          type: integer
        messagesSentToday:
          type: integer
        monthlyTokenLimit:
          type: integer
        tokensUsedCurrentMonth:
          type: integer
        setupCompletedAt:
          type: string
          format: date-time
        autonomyEnabledAt:
          type: string
          format: date-time
      required:
        - tenantId

    UpdateAgentConfigBody:
      type: object
      properties:
        agents:
          $ref: "#/components/schemas/AgentsMap"
        dailyMessageLimit:
          type: integer
        messagesSentToday:
          type: integer
        monthlyTokenLimit:
          type: integer
        tokensUsedCurrentMonth:
          type: integer
        setupCompletedAt:
          type: string
          format: date-time
        autonomyEnabledAt:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        nome:
          type: string
        descricao:
          type: string
          nullable: true
        preco:
          type: number
          nullable: true
      required:
        - nome

    BusinessProfile:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        razaoSocial:
          type: string
        nomeFantasia:
          type: string
          nullable: true
        cnpj:
          type: string
          nullable: true
        endereco:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        vertical:
