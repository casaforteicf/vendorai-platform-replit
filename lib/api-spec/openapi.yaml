components:
  schemas:
    ChangePasswordBody:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - currentPassword
        - newPassword

    LoginBody:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RegisterBody:
      type: object
      properties:
        tenantName:
          type: string
        tenantSlug:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required:
        - tenantName
        - tenantSlug
        - name
        - email
        - password

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"
      required:
        - token
        - user

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TenantStatus:
      type: string
      enum: [active, suspended, cancelled]

    UsageSummary:
      type: object
      properties:
        messages:
          type: object
          properties:
            sent:
              type: integer
            limit:
              type: integer
            percentUsed:
              type: integer
            nearLimit:
              type: boolean
            overLimit:
              type: boolean
          required: [sent, limit, percentUsed, nearLimit, overLimit]
        tokens:
          type: object
          properties:
            used:
              type: integer
            limit:
              type: integer
            percentUsed:
              type: integer
            nearLimit:
              type: boolean
            overLimit:
              type: boolean
          required: [used, limit, percentUsed, nearLimit, overLimit]
      required: [messages, tokens]

    DashboardLeadEntry:
      type: object
      properties:
        leadId:
          type: string
        nome:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        telefone:
          type: string
          nullable: true
        churnRisk:
          type: integer
          nullable: true
      required: [leadId, churnRisk]

    TenantDashboard:
      type: object
      properties:
        leads:
          type: object
          properties:
            total:
              type: integer
            novosUltimos30Dias:
              type: integer
          required: [total, novosUltimos30Dias]
        deals:
          type: object
          properties:
            porEtapa:
              type: object
              additionalProperties:
                type: integer
              description: Map of etapa → count (only stages with at least one deal present)
            totalEmNegociacao:
              type: string
              description: Sum of valor for open deals (não ganho/perdido) as decimal string
            totalDeals:
              type: integer
            taxaConversao:
              type: number
              description: ganho / totalDeals (0–1 range, 4 decimal places)
          required: [porEtapa, totalEmNegociacao, totalDeals, taxaConversao]
        faturas:
          type: object
          properties:
            pendente:
              type: object
              properties:
                count:
                  type: integer
                somaValor:
                  type: string
              required: [count, somaValor]
            atrasada:
              type: object
              properties:
                count:
                  type: integer
                somaValor:
                  type: string
              required: [count, somaValor]
          required: [pendente, atrasada]
        atividadesAtrasadas:
          type: integer
          description: Activities with status=pendente and dataVencimento in the past
        churnRiskDistribuicao:
          type: object
          properties:
            baixo:
              type: integer
              description: churnRisk < 30
            medio:
              type: integer
              description: 30 <= churnRisk <= 70
            alto:
              type: integer
              description: churnRisk > 70
          required: [baixo, medio, alto]
        top5ChurnRisk:
          type: array
          description: Top 5 leads ordered by churnRisk descending
          items:
            $ref: "#/components/schemas/DashboardLeadEntry"
      required:
        - leads
        - deals
        - faturas
        - atividadesAtrasadas
        - churnRiskDistribuicao
        - top5ChurnRisk

    SubscriptionPlano:
      type: string
      enum: [starter, growth, enterprise]

    SubscriptionStatus:
      type: string
      enum: [trial, ativa, inadimplente, cancelada]

    Subscription:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        plano:
          $ref: "#/components/schemas/SubscriptionPlano"
        valorMensal:
          type: string
          description: Monthly value as decimal string (e.g. "299.90")
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        asaasCustomerId:
          type: string
          nullable: true
        asaasSubscriptionId:
          type: string
          nullable: true
        dataInicio:
          type: string
          format: date-time
        proximaCobranca:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [id, tenantId, plano, valorMensal, status, dataInicio, createdAt, updatedAt]

    CreateSubscriptionBody:
      type: object
      properties:
        tenantId:
          type: string
        plano:
          $ref: "#/components/schemas/SubscriptionPlano"
        valorMensal:
          oneOf:
            - type: string
            - type: number
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        asaasCustomerId:
          type: string
        asaasSubscriptionId:
          type: string
        dataInicio:
          type: string
          format: date-time
        proximaCobranca:
          type: string
          format: date-time
      required: [tenantId, plano, valorMensal, dataInicio]

    UpdateSubscriptionBody:
      type: object
      properties:
        plano:
