          description: Job criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"

  /arq/render-jobs/{jobId}:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getRenderJob
      tags: [arq-renders]
      summary: Buscar status do render job
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Status do job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderJob"

  /arq/render-jobs/{jobId}/reviews:
    parameters:
      - name: jobId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createRenderReview
      tags: [arq-renders]
      summary: Registrar revisão de render
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRenderReviewBody"
      responses:
        "201":
          description: Revisão registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenderReview"


