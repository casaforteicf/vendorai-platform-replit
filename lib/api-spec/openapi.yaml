        valorMensal:
          oneOf:
            - type: string
            - type: number
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        asaasCustomerId:
          type: string
        asaasSubscriptionId:
          type: string
        proximaCobranca:
          type: string
          format: date-time

    InvoiceStatus:
