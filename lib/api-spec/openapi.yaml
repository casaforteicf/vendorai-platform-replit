          type: array
          items:
            type: object
            properties:
              sku:
                type: string
              error:
                type: string
            required:
              - sku
              - error
      required:
        - upserted
        - skipped
        - errors

    GenerateContentBody:
      type: object
      properties:
        type:
          type: string
          enum: [feed, stories, reels]
        theme:
          type: string
        productId:
          type: string
          nullable: true
        variations:
          type: integer
          minimum: 1
          maximum: 3
          default: 2
      required:
        - type
        - theme

    ContentVariation:
      type: object
      properties:
        caption:
          type: string
        hashtags:
          type: array
          items:
            type: string
        text:
          type: string
        cta:
          type: string
        title:
          type: string
        scenes:
          type: array
          items:
            type: object
            properties:
              visual:
                type: string
              fala:
                type: string
              duracao:
                type: string
            required: [visual, fala, duracao]
        audioSuggestion:
          type: string

    ContentGenerationResult:
      type: object
      properties:
        variations:
          type: array
          items:
            $ref: "#/components/schemas/ContentVariation"
      required:
        - variations

    ContentGeneration:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        type:
          type: string
          enum: [feed, stories, reels]
        productId:
          type: string
          nullable: true
        productName:
          type: string
          nullable: true
        theme:
          type: string
        result:
          $ref: "#/components/schemas/ContentGenerationResult"
        tokensUsed:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - type
        - theme
        - result
        - tokensUsed
        - createdAt

    ListContentResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ContentGeneration"
        monthlyUsed:
          type: integer
        monthlyLimit:
          type: integer
      required:
        - items
        - monthlyUsed
        - monthlyLimit

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. image/jpeg).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. /objects/uploads/uuid). Store in DB.
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
