openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: tenants
    description: Tenant management
  - name: users
    description: User management
  - name: leads
    description: Lead management
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users
      description: Returns all users (password excluded)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserBody"
      responses:
        "201":
          description: Created user (password excluded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Tenant not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User found (password excluded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserBody"
      responses:
        "200":
          description: Updated user (password excluded)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List tenants
      description: Returns all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenantBody"
      responses:
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get tenant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Tenant found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenantBody"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenants/{tenantId}/users:
    get:
      operationId: listTenantUsers
      tags: [users]
      summary: List users of a tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of users for the tenant (password excluded)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /leads:
    get:
      operationId: listLeads
      tags: [leads]
      summary: List all leads
      responses:
        "200":
          description: List of leads
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"
    post:
      operationId: createLead
      tags: [leads]
      summary: Create lead
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLeadBody"
      responses:
        "201":
          description: Created lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tenants/{tenantId}/leads:
    get:
      operationId: listTenantLeads
      tags: [leads]
      summary: List leads of a tenant
      parameters:
        - name: tenantId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of leads for the tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Lead"

  /leads/{id}:
    get:
      operationId: getLead
      tags: [leads]
      summary: Get lead by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateLead
      tags: [leads]
      summary: Update lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLeadBody"
      responses:
        "200":
          description: Updated lead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Lead"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteLead
      tags: [leads]
      summary: Delete lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    TenantStatus:
      type: string
      enum: [active, suspended, cancelled]

    Tenant:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        tokensUsedCurrentMonth:
          type: integer
        dailyMessageLimit:
          type: integer
          nullable: true
        messagesSentToday:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - tokensUsedCurrentMonth
        - messagesSentToday
        - createdAt
        - updatedAt

    CreateTenantBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        dailyMessageLimit:
          type: integer
          nullable: true
      required:
        - name
        - slug

    UpdateTenantBody:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        tokensUsedCurrentMonth:
          type: integer
        dailyMessageLimit:
          type: integer
          nullable: true
        messagesSentToday:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    UserRole:
      type: string
      enum: [admin, member]

    PlatformRole:
      type: string
      enum: [super_admin, tenant_admin, member]

    User:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        name:
          type: string
        email:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - name
        - email
        - role
        - platformRole
        - active
        - createdAt
        - updatedAt

    CreateUserBody:
      type: object
      properties:
        tenantId:
          type: string
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        active:
          type: boolean
      required:
        - tenantId
        - name
        - email
        - password

    UpdateUserBody:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        role:
          $ref: "#/components/schemas/UserRole"
        platformRole:
          $ref: "#/components/schemas/PlatformRole"
        active:
          type: boolean

    Lead:
      type: object
      properties:
        id:
          type: string
        tenantId:
          type: string
        nome:
          type: string
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        empresa:
          type: string
          nullable: true
        tamanhoEquipe:
          type: string
          nullable: true
        objetivo:
          type: string
          nullable: true
        urgencia:
          type: string
          nullable: true
        orcamento:
          type: string
          nullable: true
        planoRecomendado:
          type: string
          nullable: true
        dorPrincipal:
          type: string
          nullable: true
        proximaAcao:
          type: string
          nullable: true
        status:
          type: string
        activeAgentLock:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - tenantId
        - nome
        - status
        - createdAt
        - updatedAt

    CreateLeadBody:
      type: object
      properties:
        tenantId:
          type: string
        nome:
          type: string
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        empresa:
          type: string
          nullable: true
        tamanhoEquipe:
          type: string
          nullable: true
        objetivo:
          type: string
          nullable: true
        urgencia:
          type: string
          nullable: true
        orcamento:
          type: string
          nullable: true
        planoRecomendado:
          type: string
          nullable: true
        dorPrincipal:
          type: string
          nullable: true
        proximaAcao:
          type: string
          nullable: true
        status:
          type: string
        activeAgentLock:
          type: string
          nullable: true
      required:
        - tenantId
        - nome

    UpdateLeadBody:
      type: object
      properties:
        nome:
          type: string
        telefone:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        empresa:
          type: string
          nullable: true
        tamanhoEquipe:
          type: string
          nullable: true
        objetivo:
          type: string
          nullable: true
        urgencia:
          type: string
          nullable: true
        orcamento:
          type: string
          nullable: true
        planoRecomendado:
          type: string
          nullable: true
        dorPrincipal:
          type: string
          nullable: true
        proximaAcao:
          type: string
          nullable: true
        status:
          type: string
        activeAgentLock:
          type: string
          nullable: true
