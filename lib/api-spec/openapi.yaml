          $ref: "#/components/schemas/TenantStatus"
        vertical:
          type: string
          nullable: true
        agentsEnabled:
          type: object
          additionalProperties: true
        setupCompletedAt:
          type: string
          format: date-time
          nullable: true
        autonomyEnabledAt:
          type: string
          format: date-time
          nullable: true
        monthlyTokenLimit:
          type: integer
          nullable: true
        tokensUsedCurrentMonth:
          type: integer
        dailyMessageLimit:
          type: integer
          nullable: true
        messagesSentToday:
          type: integer
        analysisStalenessHours:
          type: ["integer", "null"]
          description: >
            Per-tenant override for how many hours must pass before a lead is considered
            stale and auto-reanalyzed. Null means fall back to the global ANALYSIS_STALENESS_HOURS env var.
        analysisMessageThreshold:
          type: ["integer", "null"]
          description: >
            Per-tenant override for how many new messages since the last analysis trigger
            an automatic re-analysis. Null means fall back to the global ANALYSIS_MESSAGE_THRESHOLD env var.
        maxAnalysesPerHour:
          type: ["integer", "null"]
          description: >
            Per-tenant override for the maximum number of AI analyses allowed per rolling
            hour window. Null means fall back to the global MAX_ANALYSES_PER_TENANT_PER_HOUR env var.
        subdomainSlug:
          type: string
          nullable: true
          description: Subdomain slug for *.vendor.ai automatic assignment.
        tipoFechamentoDefault:
          $ref: "#/components/schemas/TipoFechamento"
          nullable: true
          description: Tipo de fechamento padrão para novos deals deste tenant. Null significa 'pedido'.
        mensalidadeValor:
          type: number
          nullable: true
          description: Valor da mensalidade recorrente (copiado do deal ao ganhar). Usado para cobrança mensal no dia 5.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - slug
        - status
        - tokensUsedCurrentMonth
        - messagesSentToday
        - createdAt
        - updatedAt

